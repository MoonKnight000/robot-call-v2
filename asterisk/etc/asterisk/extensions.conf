; Dialplan. Outbound-only scope (PROJECT.md §1.2, §8.3).
[general]
static = yes
writeprotect = no

; Calls originated by the app land here and are handed to the Stasis app.
; The app name must match the ARI app the voice-agent-service registers
; ("uysot-voice-agent", PROJECT.md §8.3/§8.4).
[outbound-ai]
exten => _X.,1,NoOp(AI outbound call to ${EXTEN})
 same => n,Stasis(uysot-voice-agent,${CALL_ID})
 same => n,Hangup()

; Inbound from the trunk is out of scope for the MVP; reject politely.
[from-trunk]
exten => _X.,1,NoOp(Unexpected inbound call from trunk to ${EXTEN})
 same => n,Hangup()

; The provider qualifies us with OPTIONS to sip:s@<our-ip> (chan_sip style).
; res_pjsip_options answers 200 only if the request-URI user exists as an
; extension in the endpoint's context — without this `s` entry the trunk
; context has digit-only patterns and Asterisk replies 404 Not Found to every
; provider ping. Never reached by a real call: `s` is not a dialable number.
exten => s,1,NoOp(Provider qualify OPTIONS)
 same => n,Hangup()

; Browser call over WebRTC (pjsip.conf [webtest], docs/api/calls.md "web-test",
; docs/api/widgets.md). Dial 700 with an X-Web-Test header holding the session id the
; app handed out; it is passed on as the second Stasis argument, and the app hangs up
; any call whose session it does not know.
;
; Its own context, and deliberately only this one extension. The [webtest] credentials
; reach browsers we do not control — the widget endpoint hands them to any visitor of a
; customer's page — so whatever this context contains is what a copied password can do.
; With only 700 in it that is nothing: without a session id the app hangs the call up,
; and session ids are single-use, expire in five minutes and are rationed per agent
; (WidgetCallGate). Adding a trunk-dialling extension here would turn a public password
; into toll fraud, so do not.
[from-webrtc]
exten => 700,1,NoOp(Browser -> AI Stasis, web test session ${PJSIP_HEADER(read,X-Web-Test)})
 same => n,Answer()
 same => n,Stasis(uysot-voice-agent,web-test,${PJSIP_HEADER(read,X-Web-Test)})
 same => n,Hangup()

; Local test context for a registered softphone (no trunk needed). Dial 600 to
; reach the AI Stasis app — the full STT/TTS/dialog pipeline, testable on Windows.
; The softphone is an account we hold ourselves, so it also gets 700.
[from-internal]
include => from-webrtc

exten => 600,1,NoOp(Softphone -> AI Stasis)
 same => n,Answer()
 same => n,Stasis(uysot-voice-agent,softphone-test)
 same => n,Hangup()

; Operator transfer (§11.6). The app originates Local/support@operators into Stasis;
; the dialplan leg here enters the support queue (queues.conf). The Stasis leg is
; bridged with the caller, so once an agent answers, caller <-> agent are connected.
[operators]
exten => support,1,NoOp(Transfer to operator queue)
 same => n,Answer()
 same => n,Queue(support)
 same => n,Hangup()
