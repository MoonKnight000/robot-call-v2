; Operator queue for human transfer (PROJECT.md §10 Bosqich 11, §11.6).
; The app transfers a caller by originating Local/support@operators, whose dialplan
; leg (extensions.conf [operators]) enters this queue. Add real agent endpoints as
; members below (or via AMI/ARI). Ringing strategy and timeouts are conservative.

[general]
persistentmembers = yes

[support]
strategy = rrmemory          ; round-robin with memory
timeout = 20                 ; seconds to ring each member
retry = 5
maxlen = 0                   ; unlimited waiting callers
announce-frequency = 0
; Static members — replace with your operators' PJSIP endpoints.
; member => PJSIP/operator1
; member => PJSIP/operator2
