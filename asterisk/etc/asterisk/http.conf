; HTTP server — required for ARI (WebSocket on ws://asterisk:8088/ari/events).
; See PROJECT.md §12 (ari-url).
[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088

; The same server carries SIP over WebSocket for browser test calls
; (pjsip.conf [transport-ws]): ws://<host>:8088/ws. A web UI served over https
; may only open wss://, which needs TLS here — uncomment, mount the certificate
; into the container and publish 8089 in docker-compose.yml; then point
; WEB_TEST_WS_URL at wss://<host>:8089/ws.
;tlsenable = yes
;tlsbindaddr = 0.0.0.0:8089
;tlscertfile = /etc/asterisk/keys/asterisk.pem
;tlsprivatekey = /etc/asterisk/keys/asterisk.key
