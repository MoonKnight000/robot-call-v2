; PJSIP trunk to the SIP provider (PROJECT.md §8.2).
; Provider: Skyline (pbx.skyline.uz), account 781137492.
; Username/password live in pjsip_auth.conf (gitignored, #included below).
; Reminder: confirm the provider ALLOWS automated outbound dialing (PROJECT.md §13.1).

; --- Global PJSIP settings ---
[global]
type = global
; Log every SIP message to the Asterisk console (`docker compose logs -f asterisk`).
; Same effect as typing `pjsip set logger on` in the CLI, except the CLI version is
; forgotten on every restart and this is not. Needed right now to read the `c=` line
; of our outgoing SDP while the CGNAT/STUN setup is being verified.
; SET THIS BACK TO `no` once the trunk works — it logs the softphone's re-REGISTERs
; too and drowns the log.
debug = yes

; Per-company MANAGED SIP trunks (report #7) — generated by
; siptrunk.service.PjsipConfigWriter from sip_trunk rows that have real host/
; username/password entered via the panel, rewritten from scratch on every trunk
; create/update/delete. `#tryinclude` (not `#include`): this file does not exist
; until voice-agent.siptrunk.enabled is turned on and at least one managed trunk is
; saved — a plain `#include` would fail to load the rest of pjsip.conf (breaking the
; hand-configured trunk below) until then.
#tryinclude pjsip_trunks.conf

; ===========================================================================
; TRANSPORTS — two of them, so the trunk and the LAN softphone can work at the
; SAME time.
;
; Why two? A transport advertises exactly ONE address in SDP/Contact, and the
; two sides need different ones: the provider must be told our PUBLIC IP, the
; softphone must be told our LAN IP. `local_net` cannot bridge that gap here,
; because Asterisk runs in a Docker bridge network — its own address is the
; 172.x container IP, which no softphone on the LAN can reach. So: separate
; transports on separate ports, each with its own advertised address.
;
;   5060/udp -> transport-trunk : provider (internet)
;   5062/udp -> transport-lan   : softphone (LAN)
;
; Both ports are published in docker-compose.yml.
; ===========================================================================

; --- Trunk side: the provider is out on the internet, behind CGNAT ---
[transport-trunk]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; SIGNALLING address. Our own REGISTER opens the UDP mapping the provider
; answers through, and force_rport/rewrite_contact below make the far side reply
; to wherever the packet really came from — so this value mostly needs to not be
; the useless 172.x container address.
; !! The ISP hands out this address dynamically !! If registration starts
; failing, re-check with `curl ifconfig.me`, update the line, and
; `docker compose restart asterisk`.
external_signaling_address = 82.215.109.20

; MEDIA address is deliberately NOT pinned here — rtp.conf `stunaddr` discovers
; the real external ip:port per stream, which is the only thing that can be
; right under CGNAT (see the long note in rtp.conf).
;
; VERIFIED 2026-07-26 and STUN did NOT apply: the INVITE to 998953692029 carried
;   c=IN IP4 172.18.0.5   (the container address, unroutable for the provider)
; and Skyline answered 183 Session Progress, then 408 Request Timeout six seconds
; later — never a 200 OK. So the line below is now on. Re-check the `c=` line after
; every restart; if it reads 202.79.184.60 the SDP is finally sane.
external_media_address = 82.215.109.20

; Peers inside these ranges are "local" — do not NAT-rewrite towards them.
local_net = 192.168.0.0/24
local_net = 172.16.0.0/12

; --- LAN side: softphone registers here; advertise the host's LAN IP ---
[transport-lan]
type = transport
protocol = udp
bind = 0.0.0.0:5062
external_media_address = 192.168.0.100
external_signaling_address = 192.168.0.100

; --- Registration to the provider ---
[trunk-provider]
type = registration
transport = transport-trunk
outbound_auth = trunk-auth
server_uri = sip:pbx.skyline.uz
client_uri = sip:781137492@pbx.skyline.uz
retry_interval = 60
; NAT keepalive #1 (NETWORK.md §4.3). We sit behind a router with no port
; forward, so the provider can only reach us through the UDP mapping our own
; outbound traffic creates — and that mapping expires (MikroTik: 3 min for an
; established UDP stream; many home routers 30-180s). Re-REGISTER well inside
; that window instead of the default 3600s. If the provider answers 423
; "Interval Too Brief", Asterisk automatically retries with its Min-Expires.
expiration = 120

; Credentials (username/password) live in the gitignored pjsip_auth.conf.
#include pjsip_auth.conf

; --- Outbound endpoint (used to place calls) ---
[trunk-endpoint]
type = endpoint
transport = transport-trunk
context = from-trunk
disallow = all
allow = ulaw
allow = alaw
direct_media = no
from_user = 781137492
from_domain = pbx.skyline.uz
outbound_auth = trunk-auth
aors = trunk-aor
; NAT: we sit behind a router (and Docker's bridge). Latch onto the address the
; provider's RTP actually arrives from, and answer signalling to the source
; port/address instead of what the far side advertises.
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[trunk-aor]
type = aor
contact = sip:pbx.skyline.uz
; NAT keepalive #2: OPTIONS ping to the provider every 30s. Does two jobs —
; refreshes the UDP mapping in the gaps between REGISTERs, and makes trunk
; health visible (`pjsip show aors`, `pjsip show contacts` -> Reachable /
; Unreachable) instead of only finding out when a call fails.
; If Skyline does not answer OPTIONS the contact will read Unreachable: that is
; cosmetic for us (originate does not filter contacts by status), but set
; qualify_frequency = 0 if you would rather not see it.
qualify_frequency = 30
qualify_timeout = 5.0    ; default 3.0 is tight for an internet trunk

; --- Identify inbound traffic from the provider as the trunk (optional, outbound-only scope) ---
[trunk-identify]
type = identify
endpoint = trunk-endpoint
match = pbx.skyline.uz
; The hostname above is resolved once at load time and the provider's signalling
; host is not necessarily what it resolves to — pin the address the provider's
; OPTIONS/INVITEs actually arrive from, otherwise they are treated as anonymous.
; If Skyline ever changes it, read the new one off the `Received SIP request ...
; from UDP:<ip>:5060` log line and update here.
match = 91.203.175.6

; ===========================================================================
; Local test softphone — for Windows/Mac dev testing, runs alongside the trunk.
;
; Register a softphone (MicroSIP, Zoiper, ...) with:
;   user   = softphone
;   pass   = softphone123          (CHANGE ME before any non-local use)
;   server = 192.168.0.100:5062    <- NOTE THE PORT: 5062, not 5060
;
; Two things you can do once registered:
;   * DIAL 600 -> talk to the AI (extensions.conf [from-internal]).
;   * Let the app call YOU -> POST /api/calls?number=600 rings this softphone,
;     exercising the same outbound code path as a real call but for free.
; ===========================================================================
[softphone]
type = endpoint
transport = transport-lan
context = from-internal
disallow = all
allow = ulaw
allow = alaw
direct_media = no
auth = softphone-auth
aors = softphone

[softphone-auth]
type = auth
auth_type = userpass
username = softphone
password = softphone123   ; CHANGE ME

[softphone]
type = aor
max_contacts = 2
remove_existing = yes
