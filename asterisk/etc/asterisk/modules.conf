; Module loading. Autoload everything, then explicitly ensure the modules
; required by this project are loaded (PROJECT.md §8.1).
[modules]
autoload = yes

; ARI + HTTP (control channel over WebSocket)
load = res_http_websocket.so
load = res_ari.so
load = res_ari_channels.so
load = res_ari_applications.so
load = res_ari_bridges.so
load = res_ari_endpoints.so

; PJSIP (trunk) + RTP (audio)
load = chan_pjsip.so
load = res_pjsip.so
load = res_pjsip_session.so
load = res_rtp_asterisk.so

; externalMedia support
load = res_ari_channels.so
