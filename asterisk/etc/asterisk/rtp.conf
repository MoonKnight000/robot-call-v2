; RTP media port range used by Asterisk itself. This is separate from the
; voice-agent-service externalMedia listener range (app config, PROJECT.md §12).
[general]
rtpstart = 10000
rtpend = 10200

; --- STUN: required because this host sits behind CGNAT ---
; The ISP hands the router a private WAN address (10.80.112.4), so the address
; the outside world sees (202.79.184.60) belongs to the carrier's NAT and is
; shared. Router port-forwarding cannot help — it only reaches the private WAN
; address. Hard-coding external_media_address is a guess too: the carrier picks
; the outside port and it will not match our local one.
;
; STUN removes the guess. Asterisk asks a public STUN server "what address and
; port does my RTP appear to come from?" and puts THAT exact pair in the SDP, so
; the provider sends media to a mapping that genuinely exists.
;
; This works only if the carrier NAT keeps one mapping per source port
; (endpoint-independent). If it allocates a fresh port per destination
; (symmetric NAT), no amount of STUN helps and the VPS relay is the only fix —
; the symptom is a call that connects with RxPkt staying at 0.
stunaddr = stun.l.google.com:19302

; --- ICE: browser test calls (pjsip.conf [webtest], docs/RUN.md "Brauzerdan test") ---
; A WebRTC peer learns our media address from ICE candidates, not from the SDP
; c= line, so the transports' external_media_address does nothing for it. Under
; Docker Desktop the container's own address is unreachable from the host, hence
; the host-candidate rewrite below: the container address (pinned in
; docker-compose.yml, asterisk ipv4_address) is advertised as the host's LAN IP,
; and the published 10000-10200/udp range carries the media. The stunaddr above
; adds a public srflx candidate as well; harmless, ICE simply skips what fails.
; On a Linux host with network_mode: host, delete the mapping line.
icesupport = yes

[ice_host_candidates]
172.29.0.10 => 192.168.0.100
