; AMI (Asterisk Manager Interface) — used by the app for exactly one thing: reloading
; res_pjsip.so after a managed SIP trunk is created/edited (report #7,
; agent.ami.AmiClient/siptrunk.service.PjsipConfigWriter). NOT used for call control —
; that stays on ARI (ari.conf) — so this user only needs the "system" permission class,
; which covers the Reload action.
;
; The [<AMI_USER>] section itself lives in manager_auth.conf — generated from .env by
; asterisk/render-auth.sh before Asterisk starts (docker-compose.yml asterisk-auth-sync),
; gitignored, never committed. Set AMI_ENABLED=true on the app side once it is in use.
;
; bindaddr stays 0.0.0.0 so the app container can reach it over the Docker network;
; docker-compose.yml publishes 5038 on 127.0.0.1 only, never on a LAN/public interface.

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

#include manager_auth.conf
