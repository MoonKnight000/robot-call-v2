; ARI users. The voice-agent-service connects with these credentials.
;
; The [<ARI_USER>] user section itself lives in ari_auth.conf — generated from .env by
; asterisk/render-auth.sh before Asterisk starts (docker-compose.yml asterisk-auth-sync),
; gitignored, never committed. Keep ARI_USER / ARI_PASSWORD in .env the single source.
[general]
enabled = yes
pretty = yes
; allowed_origins = *   ; uncomment if connecting from a browser-based client

#include ari_auth.conf
