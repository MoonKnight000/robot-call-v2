# Local infrastructure for the uysot-voice project (PROJECT.md §2, §10 Stage 0).
# Credentials come from .env (see .env.example). Defaults are dev-only.
services:
  postgres:
    image: postgres:18-alpine
    container_name: robot-call-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-robot_call}
      POSTGRES_USER: ${DB_USER:-robot_call}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-robot_call}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ requires the mount at /var/lib/postgresql (not .../data) —
      # the image stores data in a version-specific subdir (18/docker) so that
      # `pg_upgrade --link` works. Mounting .../data makes the entrypoint abort.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-robot_call} -d ${DB_NAME:-robot_call}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: robot-call-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: robot-call-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-robot_call}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-robot_call}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: robot-call-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-robot_call}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-robot_call}
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Rewrites pjsip.conf's [transport-trunk] external_*_address to the current
  # public IP before asterisk starts (NETWORK.md §10 "Dinamik IP muammosi") —
  # runs once per `docker compose up`, so a changed ISP IP is always current on
  # the next start without a manual check or a mid-session restart.
  asterisk-ip-sync:
    image: curlimages/curl:8.11.0
    container_name: robot-call-asterisk-ip-sync
    environment:
      PJSIP_CONF: /etc/asterisk/pjsip.conf
    volumes:
      - ./asterisk/etc/asterisk:/etc/asterisk
      - ./asterisk/update-external-ip.sh:/update-external-ip.sh:ro
    entrypoint: ["sh", "/update-external-ip.sh"]

  # Asterisk 20 LTS. Config lives in ./asterisk/etc/asterisk (mounted read-write).
  # SIP (5060/udp) + RTP (10000-10200/udp) + ARI HTTP (8088/tcp).
  #
  # NOTE on networking: SIP/RTP work best with host networking (Linux). On
  # Docker Desktop (Windows/Mac) `network_mode: host` is limited — for real
  # call testing run Asterisk on a Linux host/VM or the target server. The
  # explicit port mappings below let ARI (8088) and SIP work in bridge mode
  # for local ARI development even where host mode is unavailable.
  asterisk:
    image: andrius/asterisk:20
    container_name: robot-call-asterisk
    depends_on:
      asterisk-ip-sync:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Tashkent}   # so Asterisk log timestamps match the app's
    volumes:
      - ./asterisk/etc/asterisk:/etc/asterisk
      - ./recordings:/var/spool/asterisk/recording
    ports:
      - "5060:5060/udp" # SIP signaling (UDP)
      - "5060:5060/tcp" # SIP signaling (TCP)
      - "8088:8088"     # ARI HTTP / WebSocket
      - "5038:5038"     # AMI
      - "10000-10200:10000-10200/udp" # RTP media range
    restart: unless-stopped
    # For Linux hosts, prefer host networking instead of the port mappings above:
    # network_mode: host

  # The voice-agent app. Running it here (same Docker network as Asterisk) is what
  # makes externalMedia RTP work on Docker Desktop (Windows/Mac): Asterisk sends
  # media to RTP_LOCAL_IP=app (this service's DNS name), container-to-container —
  # no host networking required. Provide credentials via .env / the mounts below.
  app:
    build: .
    container_name: robot-call-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      asterisk:
        condition: service_started
    environment:
      # The dialer's dial window (campaign.dial_window_start/end) is compared
      # against LocalTime.now() — without this the container runs in UTC and a
      # 09:00–20:00 window silently means 14:00–01:00 Tashkent time.
      TZ: ${TZ:-Asia/Tashkent}
      # Shared secret for /api/** and /actuator/** (header X-Api-Key). No default on
      # purpose: an unset key means the API rejects everything rather than dialling
      # the trunk for anyone who can reach port 8080.
      API_KEY: ${API_KEY:-}
      SECURITY_PUBLIC_UI: ${SECURITY_PUBLIC_UI:-true}
      # HS256 signing key for user login (Authorization: Bearer). No default on purpose,
      # same fail-closed reasoning as API_KEY above.
      JWT_SECRET: ${JWT_SECRET:-}
      # In-network service hostnames (override the localhost defaults).
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-robot_call}
      DB_USER: ${DB_USER:-robot_call}
      DB_PASSWORD: ${DB_PASSWORD:-robot_call}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-robot_call}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-robot_call}
      ARI_URL: http://asterisk:8088/
      ARI_USER: ${ARI_USER:-robot_call}
      ARI_PASSWORD: ${ARI_PASSWORD:-CHANGE_ME_ARI_PASSWORD}
      # AMI (report #7) — reloads res_pjsip.so after a managed SIP trunk changes.
      # Off by default (AMI_ENABLED unset); needs manager.conf configured on the
      # Asterisk side too (asterisk/etc/asterisk/manager.conf).
      AMI_ENABLED: ${AMI_ENABLED:-false}
      AMI_HOST: asterisk
      AMI_PORT: ${AMI_PORT:-5038}
      AMI_USER: ${AMI_USER:-robot_call-ami}
      AMI_PASSWORD: ${AMI_PASSWORD:-CHANGE_ME_AMI_PASSWORD}
      # Where PjsipConfigWriter writes the generated trunk config — the SAME directory
      # the asterisk service mounts pjsip.conf from (the volume below), so both
      # containers see the same files. Off by default (SIPTRUNK_CONFIG_ENABLED unset).
      SIPTRUNK_CONFIG_ENABLED: ${SIPTRUNK_CONFIG_ENABLED:-false}
      SIPTRUNK_CONFIG_DIR: /etc/asterisk
      # Asterisk sends the caller's audio (externalMedia RTP) to this address.
      RTP_LOCAL_IP: app
      MINIO_ENDPOINT: http://minio:9000
      MINIO_USER: ${MINIO_USER:-robot_call}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-robot_call}
      MINIO_BUCKET: ${MINIO_BUCKET:-files}
      STORAGE_ENABLED: ${STORAGE_ENABLED:-true}
      # Credentials (see .env.example). Default provider is Yandex (no Google file
      # needed). For Google STT/TTS, uncomment GOOGLE_APPLICATION_CREDENTIALS below
      # AND the gcp.json mount.
      # GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp.json
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Which chat provider Spring AI activates. "none" boots the app with no LLM —
      # needed for a keyless deploy, since google-genai with a blank key throws while
      # building the client and the application never starts.
      LLM_CHAT_PROVIDER: ${LLM_CHAT_PROVIDER:-google-genai}
      # Plain Gemini model ids — no provider prefix. The pro models need a billed key,
      # and gemini-2.5-flash 404s for keys that never used it.
      LLM_DIALOG_MODEL: ${LLM_DIALOG_MODEL:-gemini-3.6-flash}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gemini-3.6-flash}
      # Thinking level (MINIMAL/LOW/MEDIUM/HIGH — bound case-insensitively). Must reach
      # the container: without these lines a value set in .env never arrives and
      # application.yml's default silently wins. MINIMAL keeps a phone turn fast.
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-minimal}
      SUMMARY_REASONING_EFFORT: ${SUMMARY_REASONING_EFFORT:-low}
      STT_PROVIDER: ${STT_PROVIDER:-yandex}
      TTS_PROVIDER: ${TTS_PROVIDER:-yandex}
      STT_YANDEX_API_KEY: ${STT_YANDEX_API_KEY:-}
      STT_YANDEX_FOLDER_ID: ${STT_YANDEX_FOLDER_ID:-}
      # End-of-utterance tuning for Yandex STT v3:
      # HIGH sensitivity + 700ms max pause cuts ~1.5 seconds off the turn latency.
      STT_YANDEX_EOU_SENSITIVITY: ${STT_YANDEX_EOU_SENSITIVITY:-HIGH}
      STT_YANDEX_EOU_MAX_PAUSE_MS: ${STT_YANDEX_EOU_MAX_PAUSE_MS:-700}
      STT_VAD_GATING: ${STT_VAD_GATING:-false}
      STT_ENDPOINTING: ${STT_ENDPOINTING:-false}
      # Preemptive LLM Speculation (starts generating while interim speech is arriving)
      DIALOG_PREEMPTIVE: ${DIALOG_PREEMPTIVE:-true}
      DIALOG_STREAMING: ${DIALOG_STREAMING:-true}
      # Aisha (STT_PROVIDER/TTS_PROVIDER=aisha).
      STT_AISHA_API_KEY: ${STT_AISHA_API_KEY:-}
      TTS_AISHA_API_KEY: ${TTS_AISHA_API_KEY:-}
      TTS_AISHA_SPEAKER: ${TTS_AISHA_SPEAKER:-neutral}
      ARI_LOG_LEVEL: ${ARI_LOG_LEVEL:-ERROR}
      # Barge-in + answering-machine detection (§7.2, §8.6).
      VAD_MODEL_PATH: ${VAD_MODEL_PATH:-/app/silero_vad.onnx}
      VAD_THRESHOLD: ${VAD_THRESHOLD:-0.5}
      VAD_MIN_SPEECH_MS: ${VAD_MIN_SPEECH_MS:-200}
      VAD_AMD_ENABLED: ${VAD_AMD_ENABLED:-true}
      VAD_AMD_MIN_SPEECH_MS: ${VAD_AMD_MIN_SPEECH_MS:-2800}
      TTS_YANDEX_API_KEY: ${TTS_YANDEX_API_KEY:-}
      TTS_YANDEX_FOLDER_ID: ${TTS_YANDEX_FOLDER_ID:-}
      TTS_YANDEX_VOICE: ${TTS_YANDEX_VOICE:-alena}
      TTS_YANDEX_VOICE_UZ: ${TTS_YANDEX_VOICE_UZ:-nigora}
      # Fast greeting delay
      DIALOG_GREETING_DELAY_MS: ${DIALOG_GREETING_DELAY_MS:-800}
    ports:
      - "8080:8080"
    volumes:
      - ./recordings:/app/recordings
      # Same host directory the asterisk service mounts pjsip.conf from — lets
      # PjsipConfigWriter write pjsip_trunks.conf where Asterisk can #include it
      # (report #7). Harmless while SIPTRUNK_CONFIG_ENABLED is off.
      - ./asterisk/etc/asterisk:/etc/asterisk
      # For Google STT/TTS: uncomment and point GOOGLE_CREDS_PATH (.env) at your
      # service-account JSON. (Leave commented when using Yandex.)
      # - ${GOOGLE_CREDS_PATH:-./gcp.json}:/run/secrets/gcp.json:ro
    restart: unless-stopped

  # --- Observability (Stage 12) — commented out; not needed for local dev. ---
