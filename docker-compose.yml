# Local infrastructure for the uysot-voice project (PROJECT.md §2, §10 Stage 0).
# Credentials come from .env (see .env.example). Every password is `${VAR:?...}` on
# purpose: without a .env `docker compose up` stops at config time instead of bringing
# the stack up on a guessable default. Only SIP (5060), RTP (10000-10200), the ARI/WS
# port the browser softphone needs (8088) and the app (8080) are published on all
# interfaces; databases, brokers, MinIO and AMI bind to 127.0.0.1.
services:
  postgres:
    # Postgres 18 with pgvector (V11: the catalog search's vector index). Debian-based, not
    # alpine — switching an existing volume over needs one REINDEX (docs/RUN.md).
    image: pgvector/pgvector:pg18
    container_name: robot-call-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-robot_call}
      POSTGRES_USER: ${DB_USER:-robot_call}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18+ requires the mount at /var/lib/postgresql (not .../data) —
      # the image stores data in a version-specific subdir (18/docker) so that
      # `pg_upgrade --link` works. Mounting .../data makes the entrypoint abort.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-robot_call} -d ${DB_NAME:-robot_call}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: robot-call-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: robot-call-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-robot_call}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:15672:15672"   # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: robot-call-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-robot_call}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"     # S3 API (the app proxies every download — never public)
      - "127.0.0.1:9001:9001"     # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Rewrites pjsip.conf's [transport-trunk] external_*_address to the current
  # public IP before asterisk starts (NETWORK.md §10 "Dinamik IP muammosi") —
  # runs once per `docker compose up`, so a changed ISP IP is always current on
  # the next start without a manual check or a mid-session restart.
  asterisk-ip-sync:
    image: curlimages/curl:8.11.0
    container_name: robot-call-asterisk-ip-sync
    environment:
      PJSIP_CONF: /etc/asterisk/pjsip.conf
    volumes:
      - ./asterisk/etc/asterisk:/etc/asterisk
      - ./asterisk/update-external-ip.sh:/update-external-ip.sh:ro
    entrypoint: ["sh", "/update-external-ip.sh"]

  # Writes ari_auth.conf / manager_auth.conf / pjsip_local_auth.conf from .env before
  # asterisk starts (asterisk/render-auth.sh) — the committed *.conf files only #include
  # them, so no Asterisk password is tracked in git. Refuses blank / CHANGE_ME values.
  asterisk-auth-sync:
    image: curlimages/curl:8.11.0
    container_name: robot-call-asterisk-auth-sync
    # The asterisk image's own user (andrius/asterisk: asterisk = 1000:1000), so the
    # mode-600 files written below are readable by Asterisk. Under the curl image's default
    # user (uid 100) they were not, and ARI/AMI/softphone auth silently failed to load.
    user: "1000:1000"
    environment:
      ASTERISK_CONF_DIR: /etc/asterisk
      ARI_USER: ${ARI_USER:-robot_call}
      ARI_PASSWORD: ${ARI_PASSWORD:?set ARI_PASSWORD in .env}
      AMI_USER: ${AMI_USER:-uysot-ami}
      AMI_PASSWORD: ${AMI_PASSWORD:?set AMI_PASSWORD in .env}
      SOFTPHONE_PASSWORD: ${SOFTPHONE_PASSWORD:?set SOFTPHONE_PASSWORD in .env}
      WEB_TEST_SIP_USER: ${WEB_TEST_SIP_USER:-webtest}
      WEB_TEST_SIP_PASSWORD: ${WEB_TEST_SIP_PASSWORD:?set WEB_TEST_SIP_PASSWORD in .env}
    volumes:
      - ./asterisk/etc/asterisk:/etc/asterisk
      - ./asterisk/render-auth.sh:/render-auth.sh:ro
    entrypoint: ["sh", "/render-auth.sh"]

  # Asterisk 20 LTS. Config lives in ./asterisk/etc/asterisk (mounted read-write).
  # SIP (5060/udp) + RTP (10000-10200/udp) + ARI HTTP (8088/tcp).
  #
  # NOTE on networking: SIP/RTP work best with host networking (Linux). On
  # Docker Desktop (Windows/Mac) `network_mode: host` is limited — for real
  # call testing run Asterisk on a Linux host/VM or the target server. The
  # explicit port mappings below let ARI (8088) and SIP work in bridge mode
  # for local ARI development even where host mode is unavailable.
  asterisk:
    image: andrius/asterisk:20
    container_name: robot-call-asterisk
    depends_on:
      asterisk-ip-sync:
        condition: service_completed_successfully
      asterisk-auth-sync:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Tashkent}   # so Asterisk log timestamps match the app's
    volumes:
      - ./asterisk/etc/asterisk:/etc/asterisk
      - ./recordings:/var/spool/asterisk/recording
    ports:
      - "5060:5060/udp" # SIP signaling (UDP)
      - "5060:5060/tcp" # SIP signaling (TCP)
      # ARI HTTP / WebSocket — also SIP-over-WS for the browser softphone. The ARI password
      # is full control of the PBX (originate to any number over the trunk) and this
      # listener has no TLS, so it stays on loopback unless .env sets
      # ASTERISK_HTTP_BIND=0.0.0.0 for LAN browser test calls. The app itself reaches it
      # in-network (ARI_URL=http://asterisk:8088/) and does not need it published.
      - "${ASTERISK_HTTP_BIND:-127.0.0.1}:8088:8088"
      - "127.0.0.1:5038:5038"     # AMI — the app reaches it in-network; never on a LAN/public interface
      - "10000-10200:10000-10200/udp" # RTP media range
    # Pinned so rtp.conf [ice_host_candidates] can map this address to the host's
    # LAN IP for browser (WebRTC) test calls — keep the two in sync.
    networks:
      default:
        ipv4_address: 172.29.0.10
    restart: unless-stopped
    # For Linux hosts, prefer host networking instead of the port mappings above:
    # network_mode: host

  # --- LiveKit telephony engine (CompanyConfig.telephonyEngine = LIVEKIT, docs/LIVEKIT.md) ---
  # Only started with the "livekit" profile: `docker compose --profile livekit up -d`, or
  # COMPOSE_PROFILES=livekit in .env. Runs next to Asterisk, so every port differs from its:
  # LiveKit SIP takes 5070 and RTP 10300-10400 (Asterisk: 5060, 10000-10200).
  #
  # Both configs are passed inline (LIVEKIT_CONFIG / SIP_CONFIG_BODY) so the API key and
  # secret come from .env and no credential file is tracked in git. The secret must be at
  # least 32 characters — the app signs with HS256, which refuses a shorter key. Not
  # `:?`-required: Compose interpolates every service, so that would stop a plain
  # Asterisk-only `up` too; a blank key makes livekit itself refuse to start instead.
  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.11}
    container_name: robot-call-livekit
    profiles: ["livekit"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          # true on a server behind NAT: LiveKit learns its public IP over STUN
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-false}
        # Shared with livekit-sip: the two talk to each other over this Redis (and db).
        redis:
          address: redis:6379
          db: 1
        keys:
          "${LIVEKIT_API_KEY:-}": "${LIVEKIT_API_SECRET:-}"
        # Room/participant events -> LiveKitWebhookController. App run from IntelliJ instead
        # of this compose: LIVEKIT_WEBHOOK_URL=http://host.docker.internal:8080/api/webhooks/livekit
        webhook:
          api_key: "${LIVEKIT_API_KEY:-}"
          urls:
            - ${LIVEKIT_WEBHOOK_URL:-http://app:8080/api/webhooks/livekit}
        logging:
          level: ${LIVEKIT_LOG_LEVEL:-info}
    ports:
      # HTTP API (Twirp) + WebRTC signalling. The app reaches it in-network
      # (LIVEKIT_HOST=http://livekit:7880); publish it on 0.0.0.0 only for browser clients.
      - "${LIVEKIT_HTTP_BIND:-127.0.0.1}:7880:7880"
      - "7881:7881/tcp"               # WebRTC over TCP (fallback when UDP is blocked)
      - "50000-50100:50000-50100/udp" # WebRTC media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # LiveKit SIP: the phone side of a LiveKit call. Trunk calls (in and out) land here and are
  # joined to a LiveKit room as a SIP participant. Trunks and the inbound dispatch rule are
  # LiveKit API objects, not config: created once with the `lk` CLI (docs/LIVEKIT.md).
  #
  # NOTE on networking: like Asterisk, SIP/RTP behind Docker's bridge NAT advertises the
  # container address in SDP. On a Linux server use `network_mode: host` (and drop `ports:`)
  # with use_external_ip, as LiveKit's own deployment guide does.
  livekit-sip:
    image: ${LIVEKIT_SIP_IMAGE:-livekit/sip:latest}
    container_name: robot-call-livekit-sip
    profiles: ["livekit"]
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      SIP_CONFIG_BODY: |
        api_key: "${LIVEKIT_API_KEY:-}"
        api_secret: "${LIVEKIT_API_SECRET:-}"
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          db: 1
        sip_port: 5070
        rtp_port: 10300-10400
        use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-false}
        logging:
          level: ${LIVEKIT_LOG_LEVEL:-info}
    ports:
      - "5070:5070/udp"
      - "5070:5070/tcp"
      - "10300-10400:10300-10400/udp"
    restart: unless-stopped

  # The media bridge (./livekit-bridge, Go): joins each LiveKit call's room as the agent and
  # streams the phone leg to the app's RTP port as G.711 — what externalMedia is to Asterisk.
  # Nothing is published: the app drives it (LIVEKIT_BRIDGE_URL) and exchanges RTP with it
  # inside this network, so the app has to run in this compose too (RTP_LOCAL_IP=app).
  livekit-bridge:
    build: ./livekit-bridge
    image: robot-call-livekit-bridge
    container_name: robot-call-livekit-bridge
    profiles: ["livekit"]
    depends_on:
      livekit:
        condition: service_started
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # How the app reaches this container — the address it sends the agent's voice to.
      BRIDGE_RTP_HOST: livekit-bridge
      # Where the caller's keypad digits are reported (LiveKitBridgeController), signed with the API secret.
      # App run from IntelliJ instead of this compose: http://host.docker.internal:8080/api/webhooks/livekit-bridge/dtmf
      BRIDGE_APP_DTMF_URL: ${LIVEKIT_BRIDGE_DTMF_URL:-http://app:8080/api/webhooks/livekit-bridge/dtmf}
    restart: unless-stopped

  # The voice-agent app. Running it here (same Docker network as Asterisk) is what
  # makes externalMedia RTP work on Docker Desktop (Windows/Mac): Asterisk sends
  # media to RTP_LOCAL_IP=app (this service's DNS name), container-to-container —
  # no host networking required. Provide credentials via .env / the mounts below.
  app:
    build: .
    container_name: robot-call-app
    # Graceful shutdown drains live calls (voice-agent.shutdown.drain-timeout-sec, 60 s),
    # then tears the rest down (teardown-timeout-sec, 30 s) — Docker's default 10 s would
    # SIGKILL the JVM in the middle and leave callers on a dead line.
    stop_grace_period: 120s
    # Every line of .env reaches the container, so a new setting needs no line here.
    # `environment:` below takes precedence over it: that is where the localhost values
    # .env holds for an IntelliJ run are swapped for in-network hostnames.
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      asterisk:
        condition: service_started
    environment:
      # The dialer's dial window (campaign.dial_window_start/end) is compared
      # against LocalTime.now() — without this the container runs in UTC and a
      # 09:00–20:00 window silently means 14:00–01:00 Tashkent time.
      TZ: ${TZ:-Asia/Tashkent}
      # Browser origins of the console; empty means no cross-origin caller (see auth.yml).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # HS256 signing key for user login (Authorization: Bearer) — the only way into
      # /api/**. Required: a blank secret would boot an API nobody can log in to.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # In-network service hostnames (override the localhost defaults).
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-robot_call}
      DB_USER: ${DB_USER:-robot_call}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-robot_call}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      ARI_URL: http://asterisk:8088/
      ARI_USER: ${ARI_USER:-robot_call}
      ARI_PASSWORD: ${ARI_PASSWORD:?set ARI_PASSWORD in .env}
      # Browser test calls sign in to the [webtest] PJSIP endpoint with this — the same
      # value asterisk-auth-sync writes into pjsip_local_auth.conf.
      WEB_TEST_SIP_USER: ${WEB_TEST_SIP_USER:-webtest}
      WEB_TEST_SIP_PASSWORD: ${WEB_TEST_SIP_PASSWORD:?set WEB_TEST_SIP_PASSWORD in .env}
      # A-number the callee sees. Left blank the app sets nothing, and PJSIP falls back
      # to the endpoint's from_user — the Skyline account login, which is why a callee's
      # phone shows "+781137492": a login is not a subscriber number, so the handset
      # renders it as an international number with no country code. Set it to a real DID
      # the account owns (E.164 without "+", e.g. 998712001122); a number it does not own
      # comes back 603 Declined. Per-trunk sip_trunk.caller_id overrides this.
      CALLER_ID: ${CALLER_ID:-}
      # AMI (report #7) — reloads res_pjsip.so after a managed SIP trunk changes.
      # Off by default (AMI_ENABLED unset); needs manager.conf configured on the
      # Asterisk side too (asterisk/etc/asterisk/manager.conf).
      AMI_ENABLED: ${AMI_ENABLED:-false}
      AMI_HOST: asterisk
      AMI_PORT: ${AMI_PORT:-5038}
      AMI_USER: ${AMI_USER:-uysot-ami}
      AMI_PASSWORD: ${AMI_PASSWORD:?set AMI_PASSWORD in .env}
      # Where PjsipConfigWriter (trunks) and PjsipOperatorEndpointConfigAdapter (operators)
      # write their generated PJSIP files — the generated/ subdirectory of the config the
      # asterisk service mounts, which pjsip.conf #tryincludes (the volume below).
      # Off by default (SIPTRUNK_CONFIG_ENABLED unset).
      SIPTRUNK_CONFIG_ENABLED: ${SIPTRUNK_CONFIG_ENABLED:-false}
      SIPTRUNK_CONFIG_DIR: /etc/asterisk/generated
      # Asterisk sends the caller's audio (externalMedia RTP) to this address.
      RTP_LOCAL_IP: app
      # LiveKit engine (the "livekit" profile above). LIVEKIT_ENABLED, LIVEKIT_API_KEY,
      # LIVEKIT_API_SECRET and LIVEKIT_SIP_TRUNK_ID come from .env as they are.
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_BRIDGE_URL: http://livekit-bridge:8090
      MINIO_ENDPOINT: http://minio:9000
      MINIO_USER: ${MINIO_USER:-robot_call}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-files}
      STORAGE_ENABLED: ${STORAGE_ENABLED:-true}
      # Uysot CRM and its OAuth app. The OAuth hosts default to dev here, unlike the YAML's
      # production defaults — without that the browser would be sent to the production
      # consent page while everything else points at dev.
      #
      # The URLs repeat config/integrations.yml's defaults rather than falling back to them:
      # an env var set to the empty string is still *set*, so `${VAR:-}` here would override
      # the YAML default with a blank and leave the flow unconfigured. Keep the two in step.
      #
      # CRM_API_TOKEN is only the fallback for a company that has not connected through
      # Settings > Integrations; once the OAuth flow has run, that company's stored token wins.
      CRM_ENABLED: ${CRM_ENABLED:-true}
      CRM_BASE_URL: ${CRM_BASE_URL:-https://api.service.app.uysot.uz}
      CRM_API_TOKEN: ${CRM_API_TOKEN:-}
      CRM_CALL_HISTORY_EMPLOYEE_ID: ${CRM_CALL_HISTORY_EMPLOYEE_ID:-}
      UYSOT_OAUTH_AUTHORIZE_URL: ${UYSOT_OAUTH_AUTHORIZE_URL:-https://app.uysotdev.aws.softex.uz/oauth/authorize}
      UYSOT_OAUTH_TOKEN_URL: ${UYSOT_OAUTH_TOKEN_URL:-https://service.app.uysot.uz/v1/open-api/oauth/token}
      UYSOT_OAUTH_REVOKE_URL: ${UYSOT_OAUTH_REVOKE_URL:-https://service.app.uysot.uz/v1/open-api/oauth/revoke}
      UYSOT_OAUTH_REDIRECT_URI: ${UYSOT_OAUTH_REDIRECT_URI:-http://localhost:5173/settings/integrations}
      UYSOT_OAUTH_CALLBACK_REDIRECT_URL: ${UYSOT_OAUTH_CALLBACK_REDIRECT_URL:-http://localhost:5173/settings/integrations}
      UYSOT_OAUTH_CLIENT_ID: ${UYSOT_OAUTH_CLIENT_ID:-}
      UYSOT_OAUTH_CLIENT_SECRET: ${UYSOT_OAUTH_CLIENT_SECRET:-}
      # Credentials (see .env.example). Default provider is Yandex (no Google file
      # needed). .env holds a Windows path for the IntelliJ run, which means nothing in
      # the container — blanked here. For Google STT/TTS set it to /run/secrets/gcp.json
      # AND uncomment the gcp.json mount.
      GOOGLE_APPLICATION_CREDENTIALS: ""
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Which chat provider Spring AI activates. "none" boots the app with no LLM —
      # needed for a keyless deploy, since google-genai with a blank key throws while
      # building the client and the application never starts.
      LLM_CHAT_PROVIDER: ${LLM_CHAT_PROVIDER:-google-genai}
      # Plain Gemini model ids — no provider prefix. The pro models need a billed key,
      # and gemini-2.5-flash 404s for keys that never used it.
      LLM_DIALOG_MODEL: ${LLM_DIALOG_MODEL:-gemini-3.8-flash}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gemini-3.8-flash}
      # Thinking level (MINIMAL/LOW/MEDIUM/HIGH — bound case-insensitively). Low keeps a
      # phone turn fast while supported by 3.8.
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      SUMMARY_REASONING_EFFORT: ${SUMMARY_REASONING_EFFORT:-low}
      STT_PROVIDER: ${STT_PROVIDER:-yandex}
      TTS_PROVIDER: ${TTS_PROVIDER:-yandex}
      STT_YANDEX_API_KEY: ${STT_YANDEX_API_KEY:-}
      STT_YANDEX_FOLDER_ID: ${STT_YANDEX_FOLDER_ID:-}
      # End-of-utterance tuning for Yandex STT v3. Only read when STT_VAD_GATING is off
      # (see below): with the gate on, SpeechKit uses the external classifier and this
      # side decides when the utterance ended. SpeechKit only accepts [500, 5000].
      #
      # 500 + HIGH was measured cutting callers off: it ended one turn on a 0.60s pause
      # and the next on a 0.78s one, mid-sentence both times. On the second the bot
      # answered "keyingi oy" and hung up, and the rest of the sentence — "to'layman
      # oktyabrda" — arrived 0.2s later with the call already closing.
      # If turns feel slow again, put SENSITIVITY back to HIGH before touching the pause:
      # it is the cheaper half, and the pause is what protects a mid-sentence caller.
      STT_YANDEX_EOU_SENSITIVITY: ${STT_YANDEX_EOU_SENSITIVITY:-DEFAULT}
      STT_YANDEX_EOU_MAX_PAUSE_MS: ${STT_YANDEX_EOU_MAX_PAUSE_MS:-900}
      # Which languages SpeechKit may return. One is faster and more accurate; two turns
      # on per-sentence detection and lets the bot answer in the language the caller
      # actually speaks. See config/speech.yml.
      STT_DETECT_LANGUAGES: ${STT_DETECT_LANGUAGES:-uz-UZ}
      # End-of-utterance decided on this side instead of by SpeechKit: the VAD closes the
      # gate, the gate tells the recognizer, and STT_YANDEX_EOU_MAX_PAUSE_MS above stops
      # being read. This is the largest block of the wait a caller sits through — leaving
      # it to SpeechKit put 1.2-2.3s in front of every reply (VOICE-QUALITY-PLAN A.1).
      # All three must be on together, and all three need a working VAD_MODEL_PATH below:
      # with no VAD the gate is never built and this block is silently inert.
      # STT_VAD_GATING=false puts the decision back on SpeechKit; no rebuild needed.
      STT_VAD_GATING: ${STT_VAD_GATING:-true}
      STT_ENDPOINTING: ${STT_ENDPOINTING:-true}
      STT_ENDPOINTING_DYNAMIC: ${STT_ENDPOINTING_DYNAMIC:-true}
      # The top of the endpointing budget — the silence a long answer waits out. Short
      # answers close at STT_ENDPOINTING_SHORT_SILENCE_MS (500) instead, and a caller who
      # does not pause is brought down toward 600 by the dynamic setting above.
      # Raise this first if callers are being cut off mid-sentence.
      STT_VAD_POST_ROLL_MS: ${STT_VAD_POST_ROLL_MS:-1200}
      # Preemptive LLM speculation (starts generating while interim speech is arriving).
      # On: the stream is single-language now (STT_DETECT_LANGUAGES=uz-UZ), which is what
      # broke it before — the interims of a uz+ru stream came back decoded as Russian and
      # never matched the final. What it buys is the endpointing silence: a recording of a
      # real call measured 1.1-2.3s between the caller's last word and the final transcript,
      # and that whole block is time the guess is already being written in.
      # Watch the "speculation: hit/miss" log lines — a miss is a billed request for nothing.
      DIALOG_PREEMPTIVE: ${DIALOG_PREEMPTIVE:-true}
      # Carry the guess to its audio as well, not just its text. Measured on a real call:
      # stage=tts_ttfb went from 847ms on a speculation miss to 0-2ms on a hit, because
      # the first sentence was already synthesized into the TTS cache while the caller was
      # still talking. Costs characters on a miss — watch voice.tts.chars.synthesized.
      DIALOG_PREEMPTIVE_TTS: ${DIALOG_PREEMPTIVE_TTS:-true}
      DIALOG_STREAMING: ${DIALOG_STREAMING:-true}
      # Route turns of at most DIALOG_FAST_MODEL_MAX_WORDS words ("aha", "ha, to'layman")
      # to a smaller model — those are most of a call and pay time-to-first-token like any
      # other. Blank keeps every turn on the company's configured model. A model id this
      # API key cannot reach 404s, so a failed fast-model turn is retried on the normal
      # model (LlmTurnClient#retryTurn) rather than lost.
      DIALOG_FAST_MODEL: ${DIALOG_FAST_MODEL:-gemini-3.5-flash-lite}
      # 12, not 3: on a measured call the one turn that fell under 3 words answered in
      # 1.1s and the three that did not took 2.4-6.2s on the full model. Caller turns are
      # 4-7 words ("keyingi oyda oktabrdan atib to'layman"), so a 3-word cut let the
      # optimisation apply to almost nothing.
      DIALOG_FAST_MODEL_MAX_WORDS: ${DIALOG_FAST_MODEL_MAX_WORDS:-5}
      # Aisha (STT_PROVIDER/TTS_PROVIDER=aisha).
      STT_AISHA_API_KEY: ${STT_AISHA_API_KEY:-}
      TTS_AISHA_API_KEY: ${TTS_AISHA_API_KEY:-}
      TTS_AISHA_SPEAKER: ${TTS_AISHA_SPEAKER:-neutral}
      ARI_LOG_LEVEL: ${ARI_LOG_LEVEL:-ERROR}
      # Barge-in + answering-machine detection (§7.2, §8.6).
      VAD_MODEL_PATH: ${VAD_MODEL_PATH:-/app/silero_vad.onnx}
      VAD_THRESHOLD: ${VAD_THRESHOLD:-0.5}
      VAD_MIN_SPEECH_MS: ${VAD_MIN_SPEECH_MS:-400}
      VAD_AMD_ENABLED: ${VAD_AMD_ENABLED:-true}
      VAD_AMD_MIN_SPEECH_MS: ${VAD_AMD_MIN_SPEECH_MS:-3500}
      # Neural noise suppression on the caller's leg (GTCRN, docs/MODELS.md). Reads the
      # model from the ./models mount below; off, or with the file missing, calls keep the
      # broadband gate.
      DENOISER_ENABLED: ${DENOISER_ENABLED:-false}
      DENOISER_MODEL_PATH: ${DENOISER_MODEL_PATH:-/app/models/gtcrn_simple.onnx}
      TTS_YANDEX_API_KEY: ${TTS_YANDEX_API_KEY:-}
      TTS_YANDEX_FOLDER_ID: ${TTS_YANDEX_FOLDER_ID:-}
      TTS_YANDEX_VOICE: ${TTS_YANDEX_VOICE:-alena}
      TTS_YANDEX_VOICE_UZ: ${TTS_YANDEX_VOICE_UZ:-nigora}
      # Fast greeting delay
      DIALOG_GREETING_DELAY_MS: ${DIALOG_GREETING_DELAY_MS:-800}
    ports:
      - "8080:8080"
    volumes:
      - ./recordings:/app/recordings
      # Downloaded ONNX models (docs/MODELS.md) — GTCRN, Smart Turn, NAMO. Silero VAD is
      # baked into the image and does not need this. Point TURN_MODEL_PATH /
      # TEXT_TURN_MODEL_PATH / TEXT_TURN_TOKENIZER_PATH at /app/models/... to use the others.
      - ./models:/app/models:ro
      # Rolling app log (logback-spring.xml) — the per-turn "turn latency:" lines live here
      # after `docker compose logs` has scrolled past them.
      - ./logs:/app/logs
      # End-of-turn dataset from live calls (TurnDatasetProperties, TURN_DATASET_DIR is relative
      # to /app) — caller words, kept on the host so a recreated container does not lose them.
      - ./data/turn-dataset:/app/data/turn-dataset
      # Only the generated/ subdirectory of the asterisk config: the app writes
      # pjsip_trunks.conf and pjsip_operators.conf there and Asterisk #tryincludes them.
      # The rest of that directory (ARI/AMI/SIP credential files) stays out of this
      # container. Harmless while SIPTRUNK_CONFIG_ENABLED is off.
      - ./asterisk/etc/asterisk/generated:/etc/asterisk/generated
      # For Google STT/TTS: uncomment and point GOOGLE_CREDS_PATH (.env) at your
      # service-account JSON. (Leave commented when using Yandex.)
      # - ${GOOGLE_CREDS_PATH:-./gcp.json}:/run/secrets/gcp.json:ro
    restart: unless-stopped

