volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
  # grafanadata:

# Fixed subnet so the asterisk service can take a fixed address (see its
# `networks:` block). Change both if 172.29.0.0/24 collides with another network
# on this machine (`docker network ls` / `docker network inspect`).
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
