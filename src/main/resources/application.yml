spring:
  application:
    name: uysot-voice

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  lifecycle:
    timeout-per-shutdown-phase: 90s

  # Company logo / user avatar uploads (report #4, #11) are capped at 5 MB in
  # ImageUploadService — the Spring Boot default (1 MB) would reject those before that
  # check even runs, so both limits move together.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uysot_voice}
    username: ${DB_USER:uysot}
    password: ${DB_PASSWORD:uysot}

  flyway:
    enabled: true
    baseline-on-migrate: false
    placeholder-replacement: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:uysot}
    password: ${RABBITMQ_PASSWORD:uysot}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # SMTP for scheduled report emails (§10.10 "Jadval bo'yicha yuborish", voice-agent.report-schedule
  # below). Blank host/username/password until an operator sets one — the dispatch
  # sweep itself stays off (voice-agent.report-schedule.enabled: false) until then, so
  # no send is attempted against an unconfigured server.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    model:
      chat: ${LLM_CHAT_PROVIDER:google-genai}

    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${LLM_DIALOG_MODEL:gemini-3.6-flash}
            max-output-tokens: 512
            temperature: 0.3
            thinking-level: ${LLM_REASONING_EFFORT:MINIMAL}
voice-agent:
  security:
    # Shared secret for every /api/** and /actuator/** request (header: X-Api-Key).
    # Blank = fail-closed: nothing authenticates and the API answers 401. There is no
    # sensible default here — POST /api/calls dials the real trunk.
    api-key: ${API_KEY:}
    # Optional second secret that may only READ: /api/reports/** and /actuator/**.
    # Reporting, transcripts and recordings are what most people need day to day, and
    # handing them the key that can dial 50 000 subscribers to get them is the wrong
    # trade. Blank = no read-only role (everything needs the admin key, as before).
    read-api-key: ${READ_API_KEY:}
    # Serve the static test panel and swagger-ui without a key. The panel still sends
    # the key with every API call it makes. Set false to hide them too.
    public-ui: ${SECURITY_PUBLIC_UI:true}
    # Browser origins allowed to call the API cross-origin (comma-separated). The bundled
    # static panel is same-origin and never needs this; a separately hosted frontend (e.g.
    # a Vite dev server) does. Empty = no cross-origin browser calls allowed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    jwt:
      # HS256 signing key for user login (ROADMAP E.1, Authorization: Bearer). Blank =
      # fail-closed: nobody can log in. Hashed to 256 bits before use, so any non-blank
      # value works — length beyond that adds no extra security.
      secret: ${JWT_SECRET:}
      # Access token lifetime. No server-side revocation exists — logout is a client-side
      # token discard (stateless JWT), see AuthController.logout.
      expiry-minutes: ${JWT_EXPIRY_MINUTES:720}
    password-reset:
      # "Parolni unutdingizmi?" email sender (backend-uchun-talablar.md §9) — same
      # spring.mail.* SMTP connection as report-schedule. Unlike report-schedule there is
      # no enabled flag: POST /api/auth/forgot-password always answers 200 regardless of
      # whether the send actually succeeds (never reveal whether an email is registered),
      # so an unconfigured SMTP server just means the send silently fails server-side.
      from: ${PASSWORD_RESET_FROM:no-reply@uysot.uz}
  encryption:
    # AES-256 key (base64, 32 bytes) for secrets that must be read back — Uysot OAuth
    # client_secret/access/refresh tokens (§11 integrations, shared.util.SecretCipher).
    # Unlike JWT_SECRET/API_KEY, this cannot be "any non-blank value": it is decoded as
    # raw key bytes, so it must be exactly 32 bytes once base64-decoded. Generate one:
    #   openssl rand -base64 32
    # Blank = the integrations feature stays inert (fails closed) rather than storing
    # secrets in plaintext.
    secret-key: ${ENCRYPTION_SECRET_KEY:}
  user:
    # First admin account, seeded once on startup if the default company has no users yet
    # (UserBootstrap) — otherwise nobody could ever call POST /api/auth/login to create
    # the rest through the API. Blank email/password = nothing seeded (fail-closed).
    bootstrap-admin-name: ${BOOTSTRAP_ADMIN_NAME:Admin}
    bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  asterisk:
    enabled: ${ASTERISK_ENABLED:true}
    # ari4java needs the HTTP base URL (not ws://). It derives the WebSocket itself.
    ari-url: ${ARI_URL:http://localhost:8088/}
    ari-user: ${ARI_USER:uysot}
    ari-password: ${ARI_PASSWORD:CHANGE_ME_ARI_PASSWORD}
    app-name: ${ARI_APP:uysot-voice-agent}
    trunk-endpoint: ${TRUNK_ENDPOINT:trunk-endpoint}
    # Number-based endpoint routing. A number matching local-number-pattern is
    # dialled through local-endpoint (the registered test softphone) instead of the
    # trunk — so POST /api/calls?number=600 rings your softphone and exercises the
    # exact same outbound path as a real call, for free. Real subscriber numbers
    # (998...) do not match and go out over the trunk as usual.
    # Set local-endpoint to empty to disable and always use the trunk.
    local-endpoint: ${LOCAL_ENDPOINT:softphone}
    # 3-4 digits = internal extension. Written without {n,m} on purpose: a closing
    # brace inside a ${...:default} would terminate the placeholder early.
    local-number-pattern: ${LOCAL_NUMBER_PATTERN:\d\d\d\d?}
    caller-id: ${CALLER_ID:}
    answer-timeout-sec: 30
    ami:
      # AMI is used for exactly one thing: reloading res_pjsip.so after a managed SIP
      # trunk is created/edited (report #7, agent.ami.AmiClient) — not call control,
      # that's ARI above. Off by default: requires manager.conf configured on the
      # Asterisk side (see asterisk/etc/asterisk/manager.conf) and only matters once
      # voice-agent.siptrunk.enabled is also on.
      enabled: ${AMI_ENABLED:false}
      host: ${AMI_HOST:localhost}
      port: ${AMI_PORT:5038}
      username: ${AMI_USER:uysot-ami}
      password: ${AMI_PASSWORD:CHANGE_ME_AMI_PASSWORD}
  siptrunk:
    # Writes the generated PJSIP trunk config (report #7, siptrunk.service.PjsipConfigWriter).
    # Off by default: config-dir must be the SAME directory Asterisk reads pjsip.conf
    # from, mounted into this app's container (see docker-compose.yml's app service) —
    # a managed trunk's row still saves fine with this off, it just is not registered
    # with Asterisk until an operator wires this up.
    enabled: ${SIPTRUNK_CONFIG_ENABLED:false}
    config-dir: ${SIPTRUNK_CONFIG_DIR:}
    config-file-name: ${SIPTRUNK_CONFIG_FILE:pjsip_trunks.conf}
  rtp:
    # Address Asterisk sends RTP to. Must be reachable FROM Asterisk:
    #  - all local (Asterisk on host): 127.0.0.1
    #  - Asterisk in Docker, app on host: host.docker.internal (or the host LAN IP)
    local-ip: ${RTP_LOCAL_IP:127.0.0.1}
    port-range-start: 20000
    port-range-end: 20500
    recording-dir: ${RTP_RECORDING_DIR:recordings}
    # Optional: 8 kHz mono 16-bit WAV auto-played to the caller on answer (Stage 4 test).
    test-playback-file: ${RTP_TEST_PLAYBACK_FILE:}
    # Netty threads shared by every call's RTP socket. 0 = one per processor (min 2).
    # A single thread carries both the inbound packets and the 20ms playback pacer of
    # every concurrent call, which jitters at the ~20 calls the MVP targets.
    event-loop-threads: ${RTP_EVENT_LOOP_THREADS:0}
  stt:
    enabled: ${STT_ENABLED:true}
    # Active STT provider: yandex (default) or google. SpeechKit v3 recognises both
    # uz-UZ (Latin script) and ru-RU.
    provider: ${STT_PROVIDER:yandex}
    default-language: ${STT_DEFAULT_LANGUAGE:uz-UZ}
    # Yandex bills STT per streamed audio-second, and most of a call is not speech —
    # the bot talks, the caller thinks, the line idles. The Silero VAD that already runs
    # for barge-in decides what reaches the recognizer; the rest is counted
    # (voice.stt.audio.seconds.skipped) and dropped. Needs VAD enabled with its model
    # present, otherwise every frame is streamed exactly as before.
    vad-gating:
      enabled: ${STT_VAD_GATING:true}
      # Audio kept before the first speech window and sent once the gate opens. Covers
      # the VAD's own detection delay — too small and every utterance loses its first
      # syllable.
      pre-roll-ms: ${STT_VAD_PRE_ROLL_MS:500}
      # How long the stream stays open after speech stops. This is the silence the
      # provider's end-of-utterance detector listens for: too short and the final
      # transcript never arrives and the turn stalls. Lower it only while watching
      # whether finals still come through.
      post-roll-ms: ${STT_VAD_POST_ROLL_MS:1500}
    google:
      # Leave model blank for uz-UZ (phone_call is English/Russian-centric and may
      # not support Uzbek). Set to phone_call for ru-RU if desired.
      model: ${STT_MODEL:}
      sample-rate: 8000
      enable-punctuation: true
      endpointing-silence-ms: 600
    yandex:
      # v3 streaming (gRPC bidirectional). Supports uz-UZ and ru-RU. Needs an API key
      # (folder id optional with an API key).
      api-key: ${STT_YANDEX_API_KEY:}
      folder-id: ${STT_YANDEX_FOLDER_ID:}
      host: ${STT_YANDEX_HOST:stt.api.cloud.yandex.net}
      port: ${STT_YANDEX_PORT:443}
      sample-rate: 8000
      # Recognition model; blank = server default. "general" works for uz-UZ/ru-RU.
      model: ${STT_YANDEX_MODEL:general}
      interim-results: ${STT_YANDEX_INTERIM:true}
  tts:
    enabled: ${TTS_ENABLED:true}
    # Preferred provider: yandex (default) or google. Used first when it supports the
    # language; falls back by support (a language with no Yandex voice → Google).
    provider: ${TTS_PROVIDER:yandex}
    default-language: ${TTS_DEFAULT_LANGUAGE:uz-UZ}
    # Synthesized-audio cache. Yandex bills per character and this agent repeats itself
    # by design, so a hit saves both money and a synthesis round trip inside a live turn.
    cache:
      # Per-process LRU. 8 kHz 16-bit mono ≈ 16 KB per spoken second, so 200 entries is
      # a few MB. 0 = off.
      size: ${TTS_CACHE_SIZE:200}
      # Longest line worth an entry — above this a line rarely repeats.
      max-chars: ${TTS_CACHE_MAX_CHARS:200}
      # Second level in Redis: a line paid for on one instance is free on the others and
      # survives a restart. Best-effort — a Redis outage costs hits, never a call.
      redis: ${TTS_CACHE_REDIS:true}
      ttl-days: ${TTS_CACHE_TTL_DAYS:30}
      # Synthesize the fixed lines (disclosure, farewell, "say that again") at startup,
      # so the first call of a deploy neither pays for them nor waits for them.
      prewarm: ${TTS_CACHE_PREWARM:true}
    # Voices a campaign can be created with (GET /api/tts/voices fills the picker in
    # the panel; POST /api/campaigns validates the id against this list) now live in
    # the `tts_voice` table (PROJECT.md §2.5, migration V3), not here — a campaign
    # that picks one speaks with it and with the provider that owns it; one that picks
    # nothing keeps the provider/voices routing configured below. Add a Google voice
    # the same way once one has been listened to: INSERT INTO tts_voice.
    google:
      enabled: ${TTS_GOOGLE_ENABLED:true}
      sample-rate: 8000
      speaking-rate: ${TTS_GOOGLE_RATE:1.0}
      pitch: ${TTS_GOOGLE_PITCH:0.0}
      # Optional per-language voice names; blank -> Google's default voice for the
      # language. ⚠️ Listen to the uz-UZ voice before MVP (§2.5).
      # An empty key here would bind as "" and fail; use {} (or list entries below).
      voices: {}
#         uz-UZ: uz-UZ  -Standard-A
#         ru-RU: ru-RU-Standard-A
    yandex:
      # Natural ru-RU voice. On by default (preferred provider); needs an API key.
      enabled: ${TTS_YANDEX_ENABLED:true}
      api-key: ${TTS_YANDEX_API_KEY:}
      folder-id: ${TTS_YANDEX_FOLDER_ID:}
      voice: ${TTS_YANDEX_VOICE:alena}
      # Per-language voices. Each language needs its own voice — a ru-RU voice cannot
      # speak Uzbek text. Uzbek: nigora. A language with no entry (and not ru-*) is
      # reported unsupported, so the router falls back to Google.
      voices:
        uz-UZ: ${TTS_YANDEX_VOICE_UZ:nigora}
      emotion: ${TTS_YANDEX_EMOTION:neutral}
      api-url: ${TTS_YANDEX_API_URL:https://tts.api.cloud.yandex.net/speech/v1/tts:synthesize}
      sample-rate: 8000
  dialog:
    enabled: ${DIALOG_ENABLED:true}
    # When true, the bot greets and drives the conversation on answer (Stage 7
    # verification without a campaign/DB). Turn off once the dialer supplies calls.
    auto-start: ${DIALOG_AUTO_START:true}
    language: ${DIALOG_LANGUAGE:uz-UZ}
    # Voice for manual/auto-started calls (an id from the tts_voice table) — campaign
    # calls carry the voice chosen when the campaign was created. Blank = configured
    # routing; this is how a voice is auditioned before a campaign uses it.
    tts-voice: ${DIALOG_TTS_VOICE:}
    # Kanal "javob berildi" bo'lgani bilan mijoz go'shakni hali qulog'iga olib
    # bormagan bo'ladi (200 OK dan keyin telefon/GSM tomoni audio yo'lini ochishga
    # ham vaqt oladi). Shu pauzasiz salomlashuvning boshi yo'qoladi: mijoz
    # "assalom" ni eshitmay, faqat "...alaykum" ni ushlaydi.
    # Juda uzaytirmang — jimlik ham "alo?" deyishga majbur qiladi.
    greeting-delay-ms: ${DIALOG_GREETING_DELAY_MS:1200}
    max-turns: ${DIALOG_MAX_TURNS:25}
    max-call-seconds: ${DIALOG_MAX_CALL_SECONDS:300}
    # Stream the LLM reply and synthesize sentence by sentence (§7.2), so the caller
    # hears the first sentence while the rest is still being generated. Blocking mode
    # waits for the whole reply AND the whole synthesis before any audio goes out —
    # that is roughly 1.5-2.5s per turn against the <1s target (§1.3).
    # Set false if the provider misbehaves with streaming + tool calls.
    streaming: ${DIALOG_STREAMING:true}
    # §11.1: say "this is an automated system, the call is recorded" from code before
    # the LLM's first turn. Leaving it to the system prompt means a model that skips
    # or paraphrases it away breaks a legal requirement. The prompt is then told not
    # to repeat the greeting.
    mandatory-disclosure: ${DIALOG_MANDATORY_DISCLOSURE:true}
    # Send only the tools the current FSM state can legitimately use. Tool declarations
    # are re-sent (and re-billed) on every turn, and a tool that cannot fire yet is
    # mostly an opportunity to misfire — nothing can be promised before the debt has
    # been named. Set false to send all of them if a transition starts getting missed.
    state-scoped-tools: ${DIALOG_STATE_SCOPED_TOOLS:true}
    # Hard cap on how many messages of the conversation are resent each turn; older ones
    # are dropped in blocks (a block at a time, because each trim invalidates the
    # provider's cached prefix). A normal call never reaches this — it bounds the cost of
    # a pathological one. 0 = never trim.
    history-max-messages: ${DIALOG_HISTORY_MAX_MESSAGES:40}
    # Silence watchdog. A turn only happens on a final transcript, so a caller who says
    # nothing — or a recognizer that stops emitting finals — used to leave the call mute
    # until max-call-seconds. After this many quiet seconds the bot asks "alo, meni
    # eshityapsizmi?"; after no-input-max-prompts unanswered asks it says goodbye and
    # hangs up (disposition HUNG_UP, so the target is retried). 0 = no watchdog.
    # Long enough to let someone think: interrupting a caller drawing breath is worse
    # than waiting a beat too long.
    no-input-seconds: ${DIALOG_NO_INPUT_SECONDS:9}
    no-input-max-prompts: ${DIALOG_NO_INPUT_MAX_PROMPTS:2}
    # §4.4: check money figures in the model's reply against the injected facts before
    # they are spoken. A hallucinated debt amount is the worst thing this system can do —
    # the caller hears an official demand for money they do not owe, on a recorded line.
    # A blocked reply is retried once with the mistake named, then escalated to a human.
    # Watch voice.dialog.fact.guard.blocks; it should be zero.
    fact-guard: ${DIALOG_FACT_GUARD:true}
    # Cumulative LLM tokens one call may spend before it is closed politely (§C14). The
    # turn and duration caps bound a call that behaves; this bounds one that loops, where
    # each turn resends the whole context. ~25 turns of a normal call is well under this.
    # 0 = no budget.
    max-tokens-per-call: ${DIALOG_MAX_TOKENS_PER_CALL:200000}
    # Placeholder debtor facts until campaign targets exist (Stage 10). FACTS —
    # never generated by the LLM (§4.4).
    test-context:
      client-name: ${DIALOG_CLIENT_NAME:Aziz Karimov}
      debt-amount: ${DIALOG_DEBT_AMOUNT:1500000}
      currency: ${DIALOG_CURRENCY:so'm}
      due-date: ${DIALOG_DUE_DATE:2026-07-01}
      contract-number: ${DIALOG_CONTRACT:UY-2026-00123}
      goal: ${DIALOG_GOAL:To'lanmagan qarz bo'yicha to'lov sanasini kelishish.}
  vad:
    # Barge-in via Silero VAD (§7.2). Needs silero_vad.onnx; without it, VAD is
    # off and the bot cannot be interrupted (rest of the pipeline still works).
    enabled: ${VAD_ENABLED:true}
    model-path: ${VAD_MODEL_PATH:}
    sample-rate: 8000
    window-samples: 256
    threshold: ${VAD_THRESHOLD:0.5}
    min-speech-ms: ${VAD_MIN_SPEECH_MS:200}
    silence-reset-ms: ${VAD_SILENCE_RESET_MS:400}
    # Answering-machine detection (§8.6), driven by the same VAD scores as barge-in.
    # A person answers with something short ("alo?") and then waits; a machine plays an
    # uninterrupted greeting. So one continuous run of speech longer than
    # min-continuous-speech-ms, within the first observe-ms, means a recording: the call
    # is marked VOICEMAIL, cut off, and retried later at a different hour.
    #
    # Without it the agent holds a full conversation with a voicemail beep — STT, LLM and
    # TTS spent on nobody, and a disposition that describes nothing.
    #
    # The threshold is deliberately generous. Cutting off a talkative human
    # ("Assalomu alaykum, eshitaman, kim gaplashadi?") is far worse than paying for one
    # wasted voicemail, so tune it DOWN only against real recordings.
    amd:
      enabled: ${VAD_AMD_ENABLED:true}
      observe-ms: ${VAD_AMD_OBSERVE_MS:6000}
      min-continuous-speech-ms: ${VAD_AMD_MIN_SPEECH_MS:3500}
      silence-tolerance-ms: ${VAD_AMD_SILENCE_TOLERANCE_MS:250}
  summary:
    # Post-call structured summary (§4.3). §2.6 wants a stronger model here than the
    # dialog uses, but the pro models are quota 0 on a free Gemini key (verified: every
    # call 429s, and SummaryService swallows that into a null summary). Flash produces
    # valid CallSummary JSON; switch to a pro model once the key is on billing.
    # NOTE: gemini-2.5-flash now 404s for keys that never used it ("no longer available
    # to new users"), so the default is a 3.x flash like the dialog's.
    enabled: ${SUMMARY_ENABLED:true}
    model: ${SUMMARY_MODEL:gemini-3.6-flash}
    # Set explicitly so the summary does not inherit the dialog's latency tuning
    # (512 tokens / thinking off) — here quality matters and latency does not.
    reasoning-effort: ${SUMMARY_REASONING_EFFORT:low}
    max-tokens: ${SUMMARY_MAX_TOKENS:2048}
  storage:
    # Upload files (call recordings, company logos, user avatars) to MinIO/S3. Off by
    # default (recordings stay local; image uploads fail — see ImageUploadService).
    enabled: ${STORAGE_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_USER:uysot}
    secret-key: ${MINIO_PASSWORD:uysot-secret}
    # One shared bucket for every stored_file — object keys are namespaced per company/
    # category (com-{companyId}/{images,audio,documents}/...) so a single bucket is
    # enough; see FileStorageService.
    bucket: ${MINIO_BUCKET:files}
    # Drop the on-disk WAV once it is in object storage. Off while storage is off —
    # deleting then would throw the only copy away.
    delete-local-after-upload: ${STORAGE_DELETE_LOCAL:true}
    # §11.3: recordings are evidence in a dispute, and the retention period has to be
    # configurable. Recordings and their transcripts are purged after this many days;
    # call_attempt/call_result metadata is kept for reporting. 0 = keep forever.
    retention-days: ${STORAGE_RETENTION_DAYS:90}
    # Nightly, outside the 09:00-20:00 dial window.
    retention-cron: ${STORAGE_RETENTION_CRON:0 30 3 * * *}
  crm:
    # Write the summary back to Uysot CRM as a note. Off until configured.
    enabled: ${CRM_ENABLED:false}
    base-url: ${CRM_BASE_URL:}
    api-token: ${CRM_API_TOKEN:}
    note-path: ${CRM_NOTE_PATH:api/notes}
    # Read one client before dialling ({id} = client id): refreshes the debtor facts and
    # picks up preferred_language (§3.1 priority 1, §9 step 4). The imported context_data
    # is a snapshot from when the campaign was built — for a debt amount that means
    # stating a figure the client may already have paid down. Blank = no lookup, keep the
    # imported values. A failed lookup never blocks the call.
    client-path: ${CRM_CLIENT_PATH:api/clients/{id}}
  integration:
    uysot:
      # Uysot's OAuth2 endpoints (§11 settings, authorization-code flow — verified
      # against Uysot's real Open API docs, report #10). Endpoint URLs are the same for
      # every deployment (defaulted below); client-id/client-secret are this platform's
      # own registered Uysot app — global, not per-company (report #10 design
      # correction — see UysotOAuthProperties) — and genuinely secret, so no default.
      # Blank client-id/client-secret/redirect-uri = the whole feature stays inert
      # (CrmIntegrationService refuses to build an authorize URL) until an operator
      # registers an app with Uysot and supplies its credentials.
      authorize-url: ${UYSOT_OAUTH_AUTHORIZE_URL:https://app.uysotdev.aws.softex.uz/oauth/authorize}
      token-url: ${UYSOT_OAUTH_TOKEN_URL:https://serv.app.uysotdev.aws.softex.uz/v1/open-api/oauth/token}
      revoke-url: ${UYSOT_OAUTH_REVOKE_URL:https://serv.app.uysotdev.aws.softex.uz/v1/open-api/oauth/revoke}
      redirect-uri: ${UYSOT_OAUTH_REDIRECT_URI:}
      client-id: ${UYSOT_OAUTH_CLIENT_ID:}
      client-secret: ${UYSOT_OAUTH_CLIENT_SECRET:}
  notification:
    # One Telegram bot for the whole deployment (§11 settings) — a company only supplies
    # its own destination chat_id as its notification_channel.target. Blank = the
    # Telegram channel is skipped deployment-wide (NotificationTelegramSender logs why).
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
  outbox:
    # Retries the post-call work that failed the first time (§4.3). A CRM outage or an LLM
    # quota error used to mean a WARN log and a permanently lost note — for a call whose
    # whole purpose is a CRM note, that loses the call. Two sweeps: ended attempts with a
    # transcript but no call_result get summarized again; results with no crm_note_id get
    # re-posted from the stored summary (no LLM call needed).
    enabled: ${OUTBOX_ENABLED:true}
    interval-minutes: ${OUTBOX_INTERVAL_MINUTES:5}
    # Attempts per row before it is left alone, so a permanently broken row stops retrying.
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    batch: ${OUTBOX_BATCH:20}
  dialer:
    # Scheduled outbound dialer (Stage 10). Scans ACTIVE campaigns and dispatches
    # due targets via RabbitMQ, bounded by dispatch-batch (rate) and concurrency.
    enabled: ${DIALER_ENABLED:true}
    tick-seconds: ${DIALER_TICK_SECONDS:5}
    dispatch-batch: ${DIALER_DISPATCH_BATCH:3}
    max-concurrent-calls: ${DIALER_MAX_CONCURRENT:5}
    reclaim-after-sec: ${DIALER_RECLAIM_AFTER_SEC:60}
    # How long before a target is dialled again, by why the last attempt failed. One
    # 24-hour interval for everything spent most of a campaign's three retries on the
    # outcome least likely to change.
    retry:
      # Rang out or busy — the subscriber exists and may be free this afternoon.
      no-answer-minutes: ${DIALER_RETRY_NO_ANSWER_MINUTES:180}
      # Our fault or the carrier's; nothing about the subscriber changed.
      failed-minutes: ${DIALER_RETRY_FAILED_MINUTES:15}
      # A machine answers at every hour equally, so vary the hour: NOT a multiple of 24.
      voicemail-minutes: ${DIALER_RETRY_VOICEMAIL_MINUTES:1200}
      # Pull the computed time into the campaign's dial window and allowed weekdays
      # (§11.2), so next_attempt_at never reads 03:00 on a Sunday.
      respect-dial-window: ${DIALER_RETRY_RESPECT_WINDOW:true}
  operator:
    # Human-operator transfer (§11.6). endpoint is a direct agent (PJSIP/operator)
    # or the queue via a Local channel (Local/support@operators — see queues.conf).
    enabled: ${OPERATOR_ENABLED:true}
    endpoint: ${OPERATOR_ENDPOINT:Local/support@operators}
    answer-timeout-sec: ${OPERATOR_ANSWER_TIMEOUT:30}
  routing:
    # Sticky routing (§5.1): call_id -> instance_id in Redis. Blank id -> hostname.
    instance-id: ${INSTANCE_ID:}
    ttl-minutes: ${ROUTING_TTL_MINUTES:30}
  shutdown:
    # Seconds to let active calls finish before the app stops (§12).
    drain-timeout-sec: ${SHUTDOWN_DRAIN_TIMEOUT:60}
  alerting:
    # Alert when the recent call success rate (promise-to-pay) drops below threshold.
    enabled: ${ALERTING_ENABLED:true}
    window-minutes: ${ALERTING_WINDOW_MINUTES:30}
    min-sample: ${ALERTING_MIN_SAMPLE:20}
    success-threshold: ${ALERTING_SUCCESS_THRESHOLD:0.3}
    check-minutes: ${ALERTING_CHECK_MINUTES:5}
  report-schedule:
    # §10.10 "Jadval bo'yicha yuborish" — off by default: turning it on with no
    # spring.mail.host configured would just fail every send. Enable once SMTP is set.
    enabled: ${REPORT_SCHEDULE_ENABLED:false}
    check-minutes: ${REPORT_SCHEDULE_CHECK_MINUTES:60}
    from: ${REPORT_SCHEDULE_FROM:no-reply@uysot.uz}
  live:
    # Live SSE channel (§0.7): KPI ticks, live-call list, transcript lines, notifications.
    # Audio-level events are opt-in — they run on the RTP thread of every active call.
    audio-level-enabled: ${LIVE_AUDIO_LEVEL_ENABLED:false}
    kpi-poll-ms: ${LIVE_KPI_POLL_MS:2000}
  company:
    # Fallback only, for the two global bootstrap X-Api-Key secrets (voice-agent
    # .security.api-key/read-api-key) — real per-request resolution exists for JWT
    # logins (JwtCurrentCompanyResolver, ROADMAP E.1). See CurrentCompany/DefaultCompanyResolver.
    # Matches the bootstrap row R__seed_data.sql seeds as id 1.
    default-id: ${COMPANY_DEFAULT_ID:1}

server:
  port: 8080
  # Let in-flight HTTP requests finish; the drain manager handles active calls (§12).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # /actuator/health stays reachable without a key (orchestrator probes), but the
      # component breakdown — DB/Redis/Rabbit hosts and state — only for authenticated callers.
      show-details: when-authorized
  metrics:
    tags:
      application: uysot-voice
