spring:
  application:
    name: robot-call-v2

  lifecycle:
    timeout-per-shutdown-phase: 90s

  # httpclient5 is on the classpath for shared/http (outbound calls to tenant URLs). Boot's
  # auto-detection prefers it, which would move every auto-configured RestClient — Spring
  # AI's OpenAI client among them — onto Apache HttpComponents. Pinned to what Boot picked
  # before that dependency existed: Reactor Netty.
  http:
    clients:
      imperative:
        factory: reactor

  # Moves with ImageUploadService.MAX_BYTES — see that class.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uysot_voice}
    username: ${DB_USER:uysot}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: false
    placeholder-replacement: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:uysot}
    password: ${RABBITMQ_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Shared by scheduled reports, notification email and password reset. Blank until an
  # operator sets one — see ReportEmailSender, PasswordResetMailSender.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # voice-agent.* is split by subsystem under config/:
  #   auth.yml          — security, JWT, encryption, bootstrap admin
  #   telephony.yml     — Asterisk/ARI, AMI, SIP trunk, RTP, dialer, operator transfer
  #   speech.yml        — realtime engine, STT, turn detection, TTS, VAD/AMD
  #   dialog.yml        — spring.ai (LLM chat), dialog FSM, post-call summary
  #   integrations.yml  — storage, retention, CRM, Uysot OAuth, notifications, SMS, outbox,
  #                       report schedule
  #   misc.yml          — routing, shutdown, QA, chat, pack generator, insight, simulation,
  #                       alerting, live SSE, campaign recurrence, webhook retry, company
  #   billing.yml       — call rates, balance enforcement, auto-recharge, Payme/Click
  # Each value is documented on its @ConfigurationProperties class, not here.
  config:
    import:
      - classpath:config/auth.yml
      - classpath:config/telephony.yml
      - classpath:config/speech.yml
      - classpath:config/dialog.yml
      - classpath:config/integrations.yml
      - classpath:config/misc.yml
      - classpath:config/billing.yml

server:
  port: 8080
  # In-flight HTTP requests only; active calls are drained by GracefulShutdownManager (§12).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Reachable without a token for orchestrator probes, but the component breakdown
      # (DB/Redis/Rabbit hosts and state) only for authenticated callers.
      show-details: when-authorized
  metrics:
    tags:
      application: robot-call-v2

logging:
  level:
    # ari4java WARNs on its normal path and buries our own lines — see AriClient#open.
    ch.loway.oss.ari4java.tools.BaseAriAction: ${ARI_LOG_LEVEL:ERROR}
    ch.loway.oss.ari4java.generated.AriWSHelper: ${ARI_LOG_LEVEL:ERROR}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi/openapi.yaml
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    filter: true
    display-request-duration: true
    try-it-out-enabled: true