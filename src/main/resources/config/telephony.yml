# Asterisk, media and the outbound dialer. Every value has a counterpart in asterisk/etc/asterisk/*.conf.
voice-agent:
  telephony:
    # LiveKit engine (LiveKitProperties)
    livekit:
      enabled: ${LIVEKIT_ENABLED:false}
      host: ${LIVEKIT_HOST:http://localhost:7880}
      api-key: ${LIVEKIT_API_KEY:}
      api-secret: ${LIVEKIT_API_SECRET:}
      sip-trunk-id: ${LIVEKIT_SIP_TRUNK_ID:}
      public-url: ${LIVEKIT_PUBLIC_URL:}
      bridge-url: ${LIVEKIT_BRIDGE_URL:http://localhost:8090}
      answer-timeout-sec: ${LIVEKIT_ANSWER_TIMEOUT_SEC:30}
  # ARI call control (AsteriskProperties)
  asterisk:
    enabled: ${ASTERISK_ENABLED:true}
    ari-url: ${ARI_URL:http://localhost:8088/}
    ari-user: ${ARI_USER:robot_call}
    ari-password: ${ARI_PASSWORD:CHANGE_ME_ARI_PASSWORD}
    app-name: ${ARI_APP:uysot-voice-agent}
    trunk-endpoint: ${TRUNK_ENDPOINT:trunk-endpoint}
    local-endpoint: ${LOCAL_ENDPOINT:softphone}
    local-number-pattern: ${LOCAL_NUMBER_PATTERN:\d\d\d\d?}
    caller-id: ${CALLER_ID:}
    answer-timeout-sec: 30
    jitter-buffer: ${ASTERISK_JITTER_BUFFER:}
    operator-trunk: ${ASTERISK_OPERATOR_TRUNK:}

    # Browser test calls (WebTestProperties)
    web-test:
      ws-url: ${WEB_TEST_WS_URL:ws://localhost:8088/ws}
      sip-user: ${WEB_TEST_SIP_USER:webtest}
      sip-password: ${WEB_TEST_SIP_PASSWORD:}
      dial-number: ${WEB_TEST_DIAL_NUMBER:700}

    # Manager interface (AmiProperties)
    ami:
      enabled: ${AMI_ENABLED:false}
      host: ${AMI_HOST:localhost}
      port: ${AMI_PORT:5038}
      username: ${AMI_USER:uysot-ami}
      password: ${AMI_PASSWORD:CHANGE_ME_AMI_PASSWORD}
      # Poll interval of TrunkRegistrationMonitor (no Properties class)
      registration-check-seconds: ${AMI_REGISTRATION_CHECK_SECONDS:60}

  # Generated PJSIP trunk config (PjsipConfigProperties)
  siptrunk:
    enabled: ${SIPTRUNK_CONFIG_ENABLED:false}
    config-dir: ${SIPTRUNK_CONFIG_DIR:}
    config-file-name: ${SIPTRUNK_CONFIG_FILE:pjsip_trunks.conf}

  # Media leg (RtpProperties)
  rtp:
    local-ip: ${RTP_LOCAL_IP:127.0.0.1}
    port-range-start: 20000
    port-range-end: 20500
    recording-dir: ${RTP_RECORDING_DIR:recordings}
    codec: ${RTP_CODEC:ULAW}
    recording-mode: ${RTP_RECORDING_MODE:SPATIAL_STEREO}
    test-playback-file: ${RTP_TEST_PLAYBACK_FILE:}
    event-loop-threads: ${RTP_EVENT_LOOP_THREADS:0}
    receive-queue-capacity: ${RTP_RECEIVE_QUEUE_CAPACITY:2000}
    # Browser test/widget calls at 16 kHz (Asterisk G.722 / LiveKit browser room -> slin16), docs/ai/WEBRTC-ASTERISK-LIVEKIT-AUDIO-OPTIMIZATION.md
    wideband-web-test: ${RTP_WIDEBAND_WEB_TEST:false}

  # Outbound dialer (DialerProperties, RetryProperties)
  dialer:
    enabled: ${DIALER_ENABLED:true}
    tick-seconds: ${DIALER_TICK_SECONDS:5}
    dispatch-batch: ${DIALER_DISPATCH_BATCH:3}
    max-concurrent-calls: ${DIALER_MAX_CONCURRENT:2}
    max-concurrent-calls-per-company: ${DIALER_MAX_CONCURRENT_PER_COMPANY:2}
    reclaim-after-sec: ${DIALER_RECLAIM_AFTER_SEC:60}
    default-trunk-cps: ${DIALER_DEFAULT_TRUNK_CPS:1}
    retry:
      no-answer-minutes: ${DIALER_RETRY_NO_ANSWER_MINUTES:180}
      failed-minutes: ${DIALER_RETRY_FAILED_MINUTES:15}
      voicemail-minutes: ${DIALER_RETRY_VOICEMAIL_MINUTES:1200}
      respect-dial-window: ${DIALER_RETRY_RESPECT_WINDOW:true}

  # Human-operator transfer (OperatorProperties)
  operator:
    enabled: ${OPERATOR_ENABLED:true}
    endpoint: ${OPERATOR_ENDPOINT:Local/support@operators}
    answer-timeout-sec: ${OPERATOR_ANSWER_TIMEOUT:30}
    sip-config-file-name: ${OPERATOR_SIP_CONFIG_FILE:pjsip_operators.conf}
    require-acceptance: ${OPERATOR_REQUIRE_ACCEPTANCE:false}
    accept-timeout-sec: ${OPERATOR_ACCEPT_TIMEOUT:10}
