# Everything between the wire and the words: realtime engines, recognition, turn detection, synthesis, VAD/AMD.
voice-agent:
  # ffmpeg for the STT preview (AudioTranscoder)
  audio:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}

  # Speech-to-speech engines (RealtimeProperties, GeminiLiveProperties)
  realtime:
    enabled: ${REALTIME_ENABLED:true}
    provider: ${REALTIME_PROVIDER:}
    facts-in-prompt: ${REALTIME_FACTS_IN_PROMPT:true}
    normalize-output-level: ${REALTIME_NORMALIZE_OUTPUT_LEVEL:true}
    echo-gate-ratio: ${REALTIME_ECHO_GATE_RATIO:0.25}
    echo-min-bot-level: ${REALTIME_ECHO_MIN_BOT_LEVEL:300}
    tool-timeout-seconds: ${REALTIME_TOOL_TIMEOUT_SECONDS:15}
    transcript-stt: ${REALTIME_TRANSCRIPT_STT:true}
    gemini-live:
      api-key: ${GEMINI_API_KEY:}
      url: ${REALTIME_GEMINI_URL:wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent}
      model: ${GEMINI_LIVE_MODEL:gemini-3.8-live}
      voice: ${GEMINI_LIVE_VOICE:Aoede}
      connect-timeout-seconds: ${REALTIME_GEMINI_CONNECT_TIMEOUT_SECONDS:15}
      start-of-speech-sensitivity: ${REALTIME_GEMINI_START_SENSITIVITY:LOW}
      end-of-speech-sensitivity: ${REALTIME_GEMINI_END_SENSITIVITY:}
      prefix-padding-ms: ${REALTIME_GEMINI_PREFIX_PADDING_MS:100}
      silence-duration-ms: ${REALTIME_GEMINI_SILENCE_DURATION_MS:500}
      context-compression-trigger-tokens: ${REALTIME_GEMINI_CONTEXT_COMPRESSION_TOKENS:25600}
      affective-dialog: ${REALTIME_GEMINI_AFFECTIVE_DIALOG:false}
      proactive-audio: ${REALTIME_GEMINI_PROACTIVE_AUDIO:false}
      thinking-level: ${REALTIME_GEMINI_THINKING_LEVEL:}
    open-ai:
      api-key: ${OPENAI_API_KEY:}
      url: ${REALTIME_OPENAI_URL:wss://api.openai.com/v1/realtime}
      model: ${REALTIME_OPENAI_MODEL:gpt-realtime-2.1}
      voice: ${REALTIME_OPENAI_VOICE:alloy}
      connect-timeout-seconds: ${REALTIME_OPENAI_CONNECT_TIMEOUT_SECONDS:10}
      temperature: ${REALTIME_OPENAI_TEMPERATURE:0.7}
      audio-format: ${REALTIME_OPENAI_AUDIO_FORMAT:g711_ulaw}
      turn-detection: ${REALTIME_OPENAI_TURN_DETECTION:semantic_vad}
      eagerness: ${REALTIME_OPENAI_EAGERNESS:auto}
      noise-reduction: ${REALTIME_OPENAI_NOISE_REDUCTION:far_field}
      transcription-model: ${REALTIME_OPENAI_TRANSCRIPTION_MODEL:gpt-4o-transcribe}
    moshi:
      api-key: ${REALTIME_MOSHI_API_KEY:}
      url: ${REALTIME_MOSHI_URL:ws://localhost:8998/api/chat}
      model: ${REALTIME_MOSHI_MODEL:moshi}
      sample-rate: 24000
      connect-timeout-seconds: ${REALTIME_MOSHI_CONNECT_TIMEOUT_SECONDS:10}
    qwen-omni:
      api-key: ${REALTIME_QWEN_API_KEY:}
      url: ${REALTIME_QWEN_URL:wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
      model: ${REALTIME_QWEN_MODEL:qwen-omni-turbo}
      voice: ${REALTIME_QWEN_VOICE:cherry}
      connect-timeout-seconds: ${REALTIME_QWEN_CONNECT_TIMEOUT_SECONDS:10}
    pipecat:
      api-key: ${REALTIME_PIPECAT_API_KEY:${PIPECAT_CLOUD_API_KEY:}}
      url: ${REALTIME_PIPECAT_URL:${PIPECAT_BASE_URL:https://api.pipecat.daily.co/v1/public}}
      ws-url: ${REALTIME_PIPECAT_WS_URL:}
      agent-name: ${REALTIME_PIPECAT_AGENT:phone-agent}
      model: ${REALTIME_PIPECAT_MODEL:claude-3-5-haiku-20241022}
      sample-rate: 16000
      connect-timeout-seconds: ${REALTIME_PIPECAT_CONNECT_TIMEOUT_SECONDS:15}

  # Recognition (SttProperties, VadGatingProperties, EndpointingProperties)
  stt:
    enabled: ${STT_ENABLED:true}
    provider: ${STT_PROVIDER:yandex}
    default-language: ${STT_DEFAULT_LANGUAGE:uz-UZ}
    detect-languages: ${STT_DETECT_LANGUAGES:uz-UZ}
    response-timeout-ms: ${STT_RESPONSE_TIMEOUT_MS:30000}
    # Stream bridge tuning (SttStreamProperties)
    stream:
      replay-buffer-samples: ${STT_REPLAY_BUFFER_SAMPLES:16000}
      promoted-final-ttl-ms: ${STT_PROMOTED_FINAL_TTL_MS:2500}
      failover-after-failures: ${STT_FAILOVER_AFTER_FAILURES:2}
    transcription-modes: {}
    vad-gating:
      enabled: ${STT_VAD_GATING:true}
      pre-roll-ms: ${STT_VAD_PRE_ROLL_MS:800}
      post-roll-ms: ${STT_VAD_POST_ROLL_MS:1200}
      min-speech-ms: ${STT_VAD_MIN_SPEECH_MS:80}
      no-transcript-close-ms: ${STT_VAD_NO_TRANSCRIPT_CLOSE_MS:6000}
    endpointing:
      enabled: ${STT_ENDPOINTING:true}
      short-utterance-ms: ${STT_ENDPOINTING_SHORT_UTTERANCE_MS:1500}
      short-silence-ms: ${STT_ENDPOINTING_SHORT_SILENCE_MS:350}
      complete-silence-ms: ${STT_ENDPOINTING_COMPLETE_SILENCE_MS:400}
      max-utterance-ms: ${STT_ENDPOINTING_MAX_UTTERANCE_MS:25000}
      final-grace-ms: ${STT_ENDPOINTING_FINAL_GRACE_MS:250}
      dynamic:
        enabled: ${STT_ENDPOINTING_DYNAMIC:true}
        min-post-roll-ms: ${STT_ENDPOINTING_DYNAMIC_MIN_POST_ROLL_MS:800}
        ema-alpha: ${STT_ENDPOINTING_DYNAMIC_EMA_ALPHA:0.2}
        reopen-grace-ms: ${STT_ENDPOINTING_DYNAMIC_REOPEN_GRACE_MS:1200}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      url: ${STT_GEMINI_URL:wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent}
      model: ${STT_GEMINI_MODEL:gemini-3.5-transcribe-live}
      sample-rate: 16000
      connect-timeout-seconds: ${STT_GEMINI_CONNECT_TIMEOUT_SECONDS:10}
    yandex:
      api-key: ${STT_YANDEX_API_KEY:}
      folder-id: ${STT_YANDEX_FOLDER_ID:}
      host: ${STT_YANDEX_HOST:stt.api.cloud.yandex.net}
      port: ${STT_YANDEX_PORT:443}
      sample-rate: 8000
      model: ${STT_YANDEX_MODEL:general}
      auto-detect-model: ${STT_YANDEX_AUTO_DETECT_MODEL:general}
      interim-results: ${STT_YANDEX_INTERIM:true}
      eou-sensitivity: ${STT_YANDEX_EOU_SENSITIVITY:DEFAULT}
      eou-max-pause-hint-ms: ${STT_YANDEX_EOU_MAX_PAUSE_MS:900}
      keep-alive-seconds: ${STT_YANDEX_KEEPALIVE_SECONDS:60}
      text-normalization: ${STT_YANDEX_TEXT_NORMALIZATION:true}
      literature-text: ${STT_YANDEX_LITERATURE_TEXT:true}
    aisha:
      api-key: ${STT_AISHA_API_KEY:}
      url: ${STT_AISHA_URL:wss://back.aisha.group/api/v1/stt/realtime}
      interim-results: ${STT_AISHA_INTERIM:true}
    deepgram:
      api-key: ${STT_DEEPGRAM_API_KEY:}
      url: ${STT_DEEPGRAM_URL:wss://api.deepgram.com/v1/listen}
      model: ${STT_DEEPGRAM_MODEL:nova-3}
      sample-rate: 8000
      interim-results: ${STT_DEEPGRAM_INTERIM:true}
      connect-timeout-seconds: ${STT_DEEPGRAM_TIMEOUT_SECONDS:5}
    open-ai:
      api-key: ${OPENAI_API_KEY:}
      url: ${STT_OPENAI_URL:wss://api.openai.com/v1/realtime?intent=transcription}
      model: ${STT_OPENAI_MODEL:gpt-live-transcribe}
      sample-rate: ${STT_OPENAI_SAMPLE_RATE:24000}
      connect-timeout-seconds: ${STT_OPENAI_TIMEOUT_SECONDS:10}

  # Semantic end-of-turn, Smart Turn (SmartTurnProperties)
  turn:
    enabled: ${TURN_DETECTOR:true}
    model-path: ${TURN_MODEL_PATH:models/smart_turn_v3.onnx}
    languages: ${TURN_LANGUAGES:ru-RU,uz-UZ}
    shadow-languages: ${TURN_SHADOW_LANGUAGES:uz-UZ}
    threshold: ${TURN_THRESHOLD:0.5}
    max-extend-ms: ${TURN_MAX_EXTEND_MS:500}
    early-wait-ms: ${TURN_EARLY_WAIT_MS:0}
    early-threshold: ${TURN_EARLY_THRESHOLD:0.9}
    n-fft: ${TURN_N_FFT:400}
    hop-samples: ${TURN_HOP_SAMPLES:160}
    mels: ${TURN_MELS:80}
    frames: ${TURN_FRAMES:800}

  # How end-of-turn verdicts are combined (TurnTakingProperties, TurnPolicyFactory).
  # AUTO = every installed source as before (LLM verdict replaces the word rules; an unfinished turn
  # model or unfinished words extend the pause). LLM | TURN_MODEL | WORDS = only that source counts.
  # MIXED = the sources in a trusted order, the first with a verdict decides; per language below.
  turn-taking:
    engine: ${TURN_ENGINE:AUTO}
    mixed-order: ${TURN_MIXED_ORDER:llm,turn-model,words}
    mixed-languages:
      "[uz-UZ]": llm,words,turn-model     # no Uzbek turn model yet: Smart Turn only in shadow
      "[ru-RU]": turn-model,llm,words

  # Text-based end-of-turn (TextTurnProperties)
  text-turn:
    enabled: ${TEXT_TURN_DETECTOR:false}
    model-path: ${TEXT_TURN_MODEL_PATH:models/namo/model_quant.onnx}
    tokenizer-path: ${TEXT_TURN_TOKENIZER_PATH:models/namo/tokenizer.json}
    languages: ${TEXT_TURN_LANGUAGES:ru-RU}
    threshold: ${TEXT_TURN_THRESHOLD:0.5}
    max-extend-ms: ${TEXT_TURN_MAX_EXTEND_MS:600}
    early-wait-ms: ${TEXT_TURN_EARLY_WAIT_MS:0}
    early-threshold: ${TEXT_TURN_EARLY_THRESHOLD:0.9}
    max-tokens: ${TEXT_TURN_MAX_TOKENS:128}
  # LLM end-of-turn after TEN Turn Detection (LlmTurnProperties). TEN mode: base-url = the vLLM server
  # serving TEN_Turn_Detection, model TEN_Turn_Detection, max-tokens 1. PROMPT mode: blank model = the agent's
  # fastLlmModel, so base-url/api-key must be the endpoint serving it (Gemini's OpenAI-compatible one by default).
  llm-turn:
    enabled: ${LLM_TURN_DETECTOR:false}
    mode: ${LLM_TURN_MODE:PROMPT}
    base-url: ${LLM_TURN_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    api-key: ${LLM_TURN_API_KEY:${GEMINI_API_KEY:}}
    model: ${LLM_TURN_MODEL:}
    max-tokens: ${LLM_TURN_MAX_TOKENS:8}
    reasoning-effort: ${LLM_TURN_REASONING_EFFORT:}
    timeout-ms: ${LLM_TURN_TIMEOUT_MS:5000}
    unfinished-wait-ms: ${LLM_TURN_UNFINISHED_WAIT_MS:1000}
    wait-hold-ms: ${LLM_TURN_WAIT_HOLD_MS:6000}
  # End-of-turn dataset collection (TurnDatasetProperties)
  turn-dataset:
    enabled: ${TURN_DATASET_ENABLED:true}
    directory: ${TURN_DATASET_DIR:data/turn-dataset}
  # Neural noise suppression (DenoiserProperties)
  denoiser:
    enabled: ${DENOISER_ENABLED:true}
    model-path: ${DENOISER_MODEL_PATH:models/gtcrn_simple.onnx}

  # Synthesis (TtsProperties)
  tts:
    enabled: ${TTS_ENABLED:true}
    provider: ${TTS_PROVIDER:yandex}
    default-language: ${TTS_DEFAULT_LANGUAGE:uz-UZ}
    cache:
      size: ${TTS_CACHE_SIZE:200}
      max-chars: ${TTS_CACHE_MAX_CHARS:200}
      redis: ${TTS_CACHE_REDIS:true}
      ttl-days: ${TTS_CACHE_TTL_DAYS:30}
      prewarm: ${TTS_CACHE_PREWARM:true}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      url: ${TTS_GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models}
      model: ${TTS_GEMINI_MODEL:gemini-3.8-flash-tts}
      voice: ${TTS_GEMINI_VOICE:Aoede}
      voices:
        uz-UZ: ${TTS_GEMINI_VOICE_UZ:Aoede}
        ru-RU: ${TTS_GEMINI_VOICE_RU:Kore}
      sample-rate: 24000
      connect-timeout-seconds: ${TTS_GEMINI_TIMEOUT_SECONDS:10}
    yandex:
      api-key: ${TTS_YANDEX_API_KEY:}
      folder-id: ${TTS_YANDEX_FOLDER_ID:}
      voice: ${TTS_YANDEX_VOICE:alena}
      voices:
        uz-UZ: ${TTS_YANDEX_VOICE_UZ:zamira}
        ru-RU: ${TTS_YANDEX_VOICE_RU:alena}
      voice-roles:
        nigora: []
        zamira: []
        alena: [neutral, good]
        omazh: [neutral, evil]
      host: ${TTS_YANDEX_HOST:tts.api.cloud.yandex.net}
      port: ${TTS_YANDEX_PORT:443}
      sample-rate: 8000
      keep-alive-seconds: ${TTS_YANDEX_KEEPALIVE_SECONDS:60}
      request-timeout-ms: ${TTS_YANDEX_TIMEOUT_MS:10000}
    aisha:
      api-key: ${TTS_AISHA_API_KEY:}
      url: ${TTS_AISHA_URL:wss://back.aisha.group/api/v1/tts/realtime}
      speaker: ${TTS_AISHA_SPEAKER:neutral}
      speakers: {}
      moods: [neutral, cheerful, happy, sad]
      request-timeout-ms: ${TTS_AISHA_TIMEOUT_MS:10000}
    cartesia:
      api-key: ${TTS_CARTESIA_API_KEY:}
      url: ${TTS_CARTESIA_URL:https://api.cartesia.ai/tts/bytes}
      model: ${TTS_CARTESIA_MODEL:sonic-multilingual}
      voice: ${TTS_CARTESIA_VOICE:79a125e8-cd45-4c13-8a67-188112f4dd22}
      sample-rate: 8000
      connect-timeout-seconds: ${TTS_CARTESIA_TIMEOUT_SECONDS:5}
    open-ai:
      api-key: ${OPENAI_API_KEY:}
      url: ${TTS_OPENAI_URL:https://api.openai.com/v1/audio/speech}
      model: ${TTS_OPENAI_MODEL:gpt-4o-mini-tts}
      voice: ${TTS_OPENAI_VOICE:alloy}
      voices:
        uz-UZ: ${TTS_OPENAI_VOICE_UZ:alloy}
        ru-RU: ${TTS_OPENAI_VOICE_RU:nova}
      instructions: ${TTS_OPENAI_INSTRUCTIONS:}
      sample-rate: 24000
      connect-timeout-seconds: ${TTS_OPENAI_TIMEOUT_SECONDS:10}
    eleven-labs:
      api-key: ${ELEVENLABS_API_KEY:}
      url: ${TTS_ELEVENLABS_URL:https://api.elevenlabs.io/v1/text-to-speech}
      model: ${TTS_ELEVENLABS_MODEL:eleven_v4_turbo}
      voice: ${TTS_ELEVENLABS_VOICE:}
      voices:
        uz-UZ: ${TTS_ELEVENLABS_VOICE_UZ:}
        ru-RU: ${TTS_ELEVENLABS_VOICE_RU:}
      connect-timeout-seconds: ${TTS_ELEVENLABS_TIMEOUT_SECONDS:10}

  # TEN VAD in place of Silero (TenVadProperties); the native library comes from TEN-framework/ten-vad
  ten-vad:
    enabled: ${TEN_VAD_ENABLED:true}
    library-path: ${TEN_VAD_LIBRARY_PATH:models/ten-vad/libten_vad.so}
    hop-size: ${TEN_VAD_HOP_SIZE:256}
    # TEN's own thresholds, in place of vad.threshold / vad.listening-threshold on TEN calls.
    # Starting values, not calibrated: raise them if breathing still counts as the caller.
    threshold: ${TEN_VAD_THRESHOLD:0.6}
    listening-threshold: ${TEN_VAD_LISTENING_THRESHOLD:0.5}

  # Barge-in and answering-machine detection (VadProperties, AmdProperties)
  vad:
    enabled: ${VAD_ENABLED:true}
    # Which model scores a call (VadEngine, VadScorerFactory): AUTO = TEN when loaded, else Silero;
    # SILERO | TEN = that one (falls back to the other with a warning); MIXED = both on every window —
    # speech starts only when both hear it, continues while either does (MixedVadScorer).
    engine: ${VAD_ENGINE:AUTO}
    model-path: ${VAD_MODEL_PATH:models/silero_vad.onnx}
    sample-rate: 8000
    window-samples: 256
    threshold: ${VAD_THRESHOLD:0.4}
    listening-threshold: ${VAD_LISTENING_THRESHOLD:0.4}
    min-energy-rms: ${VAD_MIN_ENERGY_RMS:100.0}
    noise-floor-margin: ${VAD_NOISE_FLOOR_MARGIN:2.5}
    min-speech-ms: ${VAD_MIN_SPEECH_MS:240}
    silence-reset-ms: ${VAD_SILENCE_RESET_MS:250}
    echo-gate-ratio: ${VAD_ECHO_GATE_RATIO:0.2}
    echo-min-bot-level: ${VAD_ECHO_MIN_BOT_LEVEL:300.0}
    sustained-speech-ms: ${VAD_SUSTAINED_SPEECH_MS:500}
    amd:
      enabled: ${VAD_AMD_ENABLED:true}
      observe-ms: ${VAD_AMD_OBSERVE_MS:5000}
      min-continuous-speech-ms: ${VAD_AMD_MIN_SPEECH_MS:3500}
      silence-tolerance-ms: ${VAD_AMD_SILENCE_TOLERANCE_MS:600}
      beep-silence-ms: ${VAD_AMD_BEEP_SILENCE_MS:1500}
      beep-max-wait-ms: ${VAD_AMD_BEEP_MAX_WAIT_MS:10000}
