# ==============================================================================
# Speech Recognition (STT), Synthesis (TTS), and Voice Activity Detection (VAD)
# ==============================================================================
voice-agent:
  # Speech-to-speech engines (PipelineMode.REALTIME) — one vendor does recognition,
  # reasoning and speech, replacing the stt/tts/dialog chain below rather than sitting
  # beside it.
  realtime:
    enabled: ${REALTIME_ENABLED:true}
    provider: ${REALTIME_PROVIDER:gemini-live}
    facts-in-prompt: ${REALTIME_FACTS_IN_PROMPT:true}
    gemini-live:
      api-key: ${GEMINI_API_KEY:}
      url: ${REALTIME_GEMINI_URL:wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent}
      model: ${GEMINI_LIVE_MODEL:gemini-3.1-flash-live-preview}
      voice: ${GEMINI_LIVE_VOICE:Aoede}
      connect-timeout-seconds: ${REALTIME_GEMINI_CONNECT_TIMEOUT_SECONDS:15}
    open-ai:
      api-key: ${OPENAI_API_KEY:}
      url: ${REALTIME_OPENAI_URL:wss://api.openai.com/v1/realtime}
      model: ${REALTIME_OPENAI_MODEL:gpt-4o-realtime-preview}
      voice: ${REALTIME_OPENAI_VOICE:alloy}
      connect-timeout-seconds: ${REALTIME_OPENAI_CONNECT_TIMEOUT_SECONDS:10}
      temperature: ${REALTIME_OPENAI_TEMPERATURE:0.7}
    moshi:
      api-key: ${REALTIME_MOSHI_API_KEY:}
      url: ${REALTIME_MOSHI_URL:ws://localhost:8998/api/chat}
      model: ${REALTIME_MOSHI_MODEL:moshi}
      sample-rate: 24000
      connect-timeout-seconds: ${REALTIME_MOSHI_CONNECT_TIMEOUT_SECONDS:10}
    qwen-omni:
      api-key: ${REALTIME_QWEN_API_KEY:}
      url: ${REALTIME_QWEN_URL:wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
      model: ${REALTIME_QWEN_MODEL:qwen-omni-turbo}
      voice: ${REALTIME_QWEN_VOICE:cherry}
      connect-timeout-seconds: ${REALTIME_QWEN_CONNECT_TIMEOUT_SECONDS:10}

  stt:
    enabled: ${STT_ENABLED:true}
    # Default STT provider: yandex (default), aisha, gemini, or deepgram.
    # Individual calls pick provider from Company Engine Config.
    provider: ${STT_PROVIDER:yandex}
    default-language: ${STT_DEFAULT_LANGUAGE:uz-UZ}
    # Languages the recognizer may return, as a SpeechKit whitelist. More than one turns
    # on per-sentence detection — and on a uz-UZ + ru-RU stream that cost more than it
    # bought: the interims came back decoded as Russian and the final was re-decoded as
    # Uzbek ("распутай" and "yahshi bo'lsa keyingi oydan to'la boshlayman" were the same
    # audio), which is dead weight in the finalization the caller waits through.
    # A single language also disables answering the caller in the other one
    # (ClientInputGate#adaptLanguage needs two candidates) — put ru-RU back if calls are
    # genuinely bilingual.
    detect-languages: ${STT_DETECT_LANGUAGES:uz-UZ}
    # A stream that takes audio for this long without returning a single transcript is
    # treated as broken and replaced. Without VAD gating the caller's silence is streamed
    # too, so this must stay longer than any silence a caller can produce. 0 disables it.
    response-timeout-ms: ${STT_RESPONSE_TIMEOUT_MS:30000}
    # VAD gating: disabled by default so all audio frames stream directly to the STT provider
    # without cutting utterance beginnings or dropping speech.
    vad-gating:
      enabled: ${STT_VAD_GATING:false}
      pre-roll-ms: ${STT_VAD_PRE_ROLL_MS:800}
      post-roll-ms: ${STT_VAD_POST_ROLL_MS:1000}
      min-speech-ms: ${STT_VAD_MIN_SPEECH_MS:80}
    # External endpointing: disabled so the provider (Yandex SpeechKit / Aisha) handles
    # end-of-utterance detection cleanly.
    endpointing:
      enabled: ${STT_ENDPOINTING:false}
      short-utterance-ms: ${STT_ENDPOINTING_SHORT_UTTERANCE_MS:1500}
      short-silence-ms: ${STT_ENDPOINTING_SHORT_SILENCE_MS:500}
      max-utterance-ms: ${STT_ENDPOINTING_MAX_UTTERANCE_MS:20000}
      # Only reaches SpeechGate when vad-gating above is on as well — with the provider
      # doing its own endpointing there is no gate for these to adapt (AriService#buildAudioListeners).
      dynamic:
        enabled: ${STT_ENDPOINTING_DYNAMIC:false}
        min-post-roll-ms: ${STT_ENDPOINTING_DYNAMIC_MIN_POST_ROLL_MS:600}
        ema-alpha: ${STT_ENDPOINTING_DYNAMIC_EMA_ALPHA:0.2}
        reopen-grace-ms: ${STT_ENDPOINTING_DYNAMIC_REOPEN_GRACE_MS:900}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      url: ${STT_GEMINI_URL:wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent}
      model: ${STT_GEMINI_MODEL:gemini-3.5-transcribe}
      sample-rate: 16000
      connect-timeout-seconds: ${STT_GEMINI_CONNECT_TIMEOUT_SECONDS:10}
    yandex:
      api-key: ${STT_YANDEX_API_KEY:}
      folder-id: ${STT_YANDEX_FOLDER_ID:}
      host: ${STT_YANDEX_HOST:stt.api.cloud.yandex.net}
      port: ${STT_YANDEX_PORT:443}
      sample-rate: 8000
      model: ${STT_YANDEX_MODEL:general}
      # Model used instead of the one above when a call may be spoken in more than one language.
      # In SpeechKit v3, multilingual recognition uses the language restriction whitelist with the general model.
      auto-detect-model: ${STT_YANDEX_AUTO_DETECT_MODEL:general}
      interim-results: ${STT_YANDEX_INTERIM:true}
      # DEFAULT, not HIGH: HIGH ends the utterance at the first opportunity, and paired
      # with a 500 ms pause hint it cut callers off mid-sentence — see below.
      eou-sensitivity: ${STT_YANDEX_EOU_SENSITIVITY:DEFAULT}
      # The pause SpeechKit may treat as the end of the utterance rather than a gap
      # between words. This is the whole endpointing budget on the default path — no gate
      # runs on our side.
      #
      # 1200, raised back off the 500 floor because 500 does not survive real speech: on a
      # recorded call it ended the turn on a 0.60 s pause and again on a 0.78 s one, and
      # both times the caller was mid-sentence. The second cost the call — "keyingi oy"
      # was finalized, the bot answered and hung up, and "to'layman oktyabrda" arrived
      # 0.2 s later with nobody left to hear it. Thinking pauses in Uzbek run past a
      # second; a turnaround saved by talking over the caller is not saved.
      # What pays for it is speculation (dialog.preemptive): the reply is being written
      # during this pause, so most of it is no longer dead time.
      #
      # SpeechKit accepts [500, 5000] and nothing else: below 500 it does not clamp or
      # ignore the hint, it kills the session with INVALID_ARGUMENT on every call.
      eou-max-pause-hint-ms: ${STT_YANDEX_EOU_MAX_PAUSE_MS:1200}
      keep-alive-seconds: ${STT_YANDEX_KEEPALIVE_SECONDS:60}
    aisha:
      api-key: ${STT_AISHA_API_KEY:}
      url: ${STT_AISHA_URL:wss://back.aisha.group/api/v1/stt/realtime}
      interim-results: ${STT_AISHA_INTERIM:true}
    deepgram:
      api-key: ${STT_DEEPGRAM_API_KEY:}
      url: ${STT_DEEPGRAM_URL:wss://api.deepgram.com/v1/listen}
      model: ${STT_DEEPGRAM_MODEL:nova-3}
      sample-rate: 8000
      interim-results: ${STT_DEEPGRAM_INTERIM:true}
      connect-timeout-seconds: ${STT_DEEPGRAM_TIMEOUT_SECONDS:5}

  turn:
    # Everything under here works by changing how long the speech gate waits, so it only
    # runs when there IS a gate: stt.vad-gating.enabled above must be true as well. With
    # the recognizer endpointing for itself there is no wait to lengthen or shorten, and
    # this whole block is inert — the app says so at startup rather than leaving it to be
    # discovered during a tuning session.
    enabled: ${TURN_DETECTOR:false}
    model-path: ${TURN_MODEL_PATH:}
    languages: ${TURN_LANGUAGES:ru-RU}
    threshold: ${TURN_THRESHOLD:0.5}
    max-extend-ms: ${TURN_MAX_EXTEND_MS:500}
    # Early close: silence after which an utterance the model is SURE is finished is closed
    # without waiting out the rest of post-roll-ms. This is where the turnaround budget is
    # won — but it also puts the model in charge of interrupting people, so it is off (0)
    # until a replay run (TurnReplayTool) over real recordings says the turn boundaries
    # hold. Only ever applies to the languages listed above.
    early-wait-ms: ${TURN_EARLY_WAIT_MS:0}
    early-threshold: ${TURN_EARLY_THRESHOLD:0.9}
    n-fft: ${TURN_N_FFT:512}
    hop-samples: ${TURN_HOP_SAMPLES:256}
    mels: ${TURN_MELS:128}
    frames: ${TURN_FRAMES:500}

  tts:
    enabled: ${TTS_ENABLED:true}
    provider: ${TTS_PROVIDER:yandex}
    default-language: ${TTS_DEFAULT_LANGUAGE:uz-UZ}
    cache:
      size: ${TTS_CACHE_SIZE:200}
      max-chars: ${TTS_CACHE_MAX_CHARS:200}
      redis: ${TTS_CACHE_REDIS:true}
      ttl-days: ${TTS_CACHE_TTL_DAYS:30}
      prewarm: ${TTS_CACHE_PREWARM:false}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      url: ${TTS_GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models}
      model: ${TTS_GEMINI_MODEL:gemini-3.1-flash-tts-preview}
      voice: ${TTS_GEMINI_VOICE:Aoede}
      voices:
        uz-UZ: ${TTS_GEMINI_VOICE_UZ:Aoede}
        ru-RU: ${TTS_GEMINI_VOICE_RU:Kore}
      sample-rate: 24000
      connect-timeout-seconds: ${TTS_GEMINI_TIMEOUT_SECONDS:10}
    yandex:
      api-key: ${TTS_YANDEX_API_KEY:}
      folder-id: ${TTS_YANDEX_FOLDER_ID:}
      voice: ${TTS_YANDEX_VOICE:alena}
      voices:
        uz-UZ: ${TTS_YANDEX_VOICE_UZ:nigora}
        ru-RU: ${TTS_YANDEX_VOICE_RU:alena}
      voice-roles:
        nigora: []
        alena: [neutral, good]
        omazh: [neutral, evil]
      host: ${TTS_YANDEX_HOST:tts.api.cloud.yandex.net}
      port: ${TTS_YANDEX_PORT:443}
      sample-rate: 8000
      keep-alive-seconds: ${TTS_YANDEX_KEEPALIVE_SECONDS:60}
    aisha:
      api-key: ${TTS_AISHA_API_KEY:}
      url: ${TTS_AISHA_URL:wss://back.aisha.group/api/v1/tts/realtime}
      speaker: ${TTS_AISHA_SPEAKER:neutral}
      speakers: {}
      moods: []
      request-timeout-ms: ${TTS_AISHA_TIMEOUT_MS:10000}
    cartesia:
      api-key: ${TTS_CARTESIA_API_KEY:}
      url: ${TTS_CARTESIA_URL:https://api.cartesia.ai/tts/bytes}
      model: ${TTS_CARTESIA_MODEL:sonic-multilingual}
      voice: ${TTS_CARTESIA_VOICE:79a125e8-cd45-4c13-8a67-188112f4dd22}
      sample-rate: 8000
      connect-timeout-seconds: ${TTS_CARTESIA_TIMEOUT_SECONDS:5}

  vad:
    enabled: ${VAD_ENABLED:true}
    model-path: ${VAD_MODEL_PATH:}
    sample-rate: 8000
    window-samples: 256
    threshold: ${VAD_THRESHOLD:0.5}
    listening-threshold: ${VAD_LISTENING_THRESHOLD:0.35}
    min-energy-rms: ${VAD_MIN_ENERGY_RMS:150.0}
    min-speech-ms: ${VAD_MIN_SPEECH_MS:250}
    silence-reset-ms: ${VAD_SILENCE_RESET_MS:250}
    amd:
      enabled: ${VAD_AMD_ENABLED:true}
      observe-ms: ${VAD_AMD_OBSERVE_MS:5000}
      min-continuous-speech-ms: ${VAD_AMD_MIN_SPEECH_MS:2800}
      silence-tolerance-ms: ${VAD_AMD_SILENCE_TOLERANCE_MS:600}
