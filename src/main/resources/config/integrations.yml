# Everything this platform talks to that is not a phone: object storage, the Uysot CRM,
# Telegram, outgoing mail.
voice-agent:
  # MinIO/S3 for recordings, logos and avatars — AudioStorageProperties
  storage:
    enabled: ${STORAGE_ENABLED:true}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_USER:robot_call}
    secret-key: ${MINIO_PASSWORD:robot_call}
    bucket: ${MINIO_BUCKET:files}
    delete-local-after-upload: ${STORAGE_DELETE_LOCAL:true}
    compress-audio: ${STORAGE_COMPRESS_AUDIO:true}
    ffmpeg-path: ${STORAGE_FFMPEG_PATH:${voice-agent.audio.ffmpeg-path:ffmpeg}}
    bitrate-kbps: ${STORAGE_BITRATE_KBPS:32}

  # How long personal data is kept — RetentionProperties, RetentionService. 0 = forever.
  # A call an agent ran keeps its transcript and recording for that agent's
  # conversationRetentionDays (a zeroPiiRetention agent: zero-pii-grace after the call);
  # conversation-days is for calls no agent ran and for voicemail / local leftovers.
  # The summary, client-memory and audit purges are off until set.
  retention:
    cron: ${RETENTION_CRON:${STORAGE_RETENTION_CRON:0 30 3 * * *}}
    conversation-days: ${RETENTION_CONVERSATION_DAYS:${STORAGE_RETENTION_DAYS:90}}
    zero-pii-grace: ${RETENTION_ZERO_PII_GRACE:1h}
    summary-days: ${RETENTION_SUMMARY_DAYS:0}
    client-memory-days: ${RETENTION_CLIENT_MEMORY_DAYS:0}
    audit-days: ${RETENTION_AUDIT_DAYS:0}
    # SENT / DEAD outbox_message rows — delivery bookkeeping, not personal data, so on by default.
    outbox-days: ${RETENTION_OUTBOX_DAYS:30}
    batch-size: ${RETENTION_BATCH_SIZE:5000}

  # Uysot Open API v1 — CrmProperties, DebtorImportProperties.
  # https://apidoc.app.uysot.uz
  crm:
    enabled: ${CRM_ENABLED:true}
    base-url: ${CRM_BASE_URL:https://api.service.app.uysot.uz}
    api-token: ${CRM_API_TOKEN:}
    lead-path: ${CRM_LEAD_PATH:v1/open-api/lead/{id}}
    lead-filter-path: ${CRM_LEAD_FILTER_PATH:v1/open-api/lead/filter}
    lead-note-path: ${CRM_LEAD_NOTE_PATH:v1/open-api/lead-note/{id}/list}
    contract-path: ${CRM_CONTRACT_PATH:v1/open-api/contract/{id}}
    contract-filter-path: ${CRM_CONTRACT_FILTER_PATH:v1/open-api/contract/filter}
    call-history-path: ${CRM_CALL_HISTORY_PATH:v1/open-api/call-history}
    debtor-import:
      min-delay-days: ${CRM_DEBTOR_MIN_DELAY_DAYS:1}
      max-debtors: ${CRM_DEBTOR_MAX:200}
      page-size: ${CRM_DEBTOR_PAGE_SIZE:100}
      max-pages: ${CRM_DEBTOR_MAX_PAGES:20}
    call-history-employee-id: ${CRM_CALL_HISTORY_EMPLOYEE_ID:}

  # Per-company OAuth connection to the same CRM — UysotOAuthProperties.
  # Takes precedence over the static crm.api-token above.
  integration:
    uysot:
      authorize-url: ${UYSOT_OAUTH_AUTHORIZE_URL:https://app.uysot.uz/oauth/authorize}
      token-url: ${UYSOT_OAUTH_TOKEN_URL:https://service.app.uysot.uz/v1/open-api/oauth/token}
      revoke-url: ${UYSOT_OAUTH_REVOKE_URL:https://service.app.uysot.uz/v1/open-api/oauth/revoke}
      redirect-uri: ${UYSOT_OAUTH_REDIRECT_URI:https://voice.app.uysot.uz/api/settings/integrations/uysot/callback}
      callback-redirect-url: ${UYSOT_OAUTH_CALLBACK_REDIRECT_URL:http://localhost:5173/settings/integrations}
      client-id: ${UYSOT_OAUTH_CLIENT_ID:}
      client-secret: ${UYSOT_OAUTH_CLIENT_SECRET:}

  notification:
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    # Sender address of notification e-mails. Falls back to the scheduled-report sender,
    # which this used to borrow outright.
    email-from: ${NOTIFICATION_EMAIL_FROM:${REPORT_SCHEDULE_FROM:no-reply@uysot.uz}}

  # SMS gateway — SmsProperties. Disabled: the message is logged (masked) and not sent.
  sms:
    enabled: ${SMS_ENABLED:false}
    default-sender: ${SMS_DEFAULT_SENDER:4546}
    eskiz:
      email: ${SMS_ESKIZ_EMAIL:}
      password: ${SMS_ESKIZ_PASSWORD:}
      base-url: ${SMS_ESKIZ_BASE_URL:https://notify.eskiz.uz/api}
      callback-url: ${SMS_ESKIZ_CALLBACK_URL:}

  # Post-call outbox — OutboxProperties: summary retries, and retries of the CRM note and call
  # history (their first delivery, right after the call, happens either way).
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    interval-minutes: ${OUTBOX_INTERVAL_MINUTES:5}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    batch: ${OUTBOX_BATCH:20}
    delivery-interval-seconds: ${OUTBOX_DELIVERY_INTERVAL_SECONDS:30}
    # Wait after a CRM write's first failure; doubled after each further one, at most an hour.
    backoff-seconds: ${OUTBOX_BACKOFF_SECONDS:120}

  report-schedule:
    enabled: ${REPORT_SCHEDULE_ENABLED:false}
    check-minutes: ${REPORT_SCHEDULE_CHECK_MINUTES:60}
    from: ${REPORT_SCHEDULE_FROM:no-reply@uysot.uz}
