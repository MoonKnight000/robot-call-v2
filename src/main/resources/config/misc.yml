# Everything that has no larger home: clustering, shutdown, QA scoring, chat, pack
# generation, insights, simulation, alerting, the live SSE channel, campaign recurrence,
# webhook retries, the default company.
voice-agent:
  # Multi-instance call routing (CallRouteRegistry)
  routing:
    instance-id: ${INSTANCE_ID:}
    ttl-minutes: ${ROUTING_TTL_MINUTES:30}
    internal-url: ${INSTANCE_INTERNAL_URL:}

  # Graceful shutdown (ShutdownProperties)
  shutdown:
    drain-timeout-sec: ${SHUTDOWN_DRAIN_TIMEOUT:60}
    teardown-timeout-sec: ${SHUTDOWN_TEARDOWN_TIMEOUT:30}
    event-lane-timeout-sec: 5

  # LLM-as-judge call scoring (QualityProperties)
  quality:
    enabled: ${QUALITY_ENABLED:true}
    sample-rate: ${QUALITY_SAMPLE_RATE:1.0}
    model: ${QUALITY_MODEL:gemini-3.8-flash}
    max-tokens: ${QUALITY_MAX_TOKENS:512}

  # TTS voice list sync (TtsVoiceSyncProperties)
  voice-sync:
    enabled: ${VOICE_SYNC_ENABLED:true}
    languages: ${VOICE_SYNC_LANGUAGES:uz-UZ,ru-RU,en-US,kk-KZ}
    interval-ms: ${VOICE_SYNC_INTERVAL_MS:86400000}
    initial-delay-ms: ${VOICE_SYNC_INITIAL_DELAY_MS:30000}

  # Widget text channel limits (ChatProperties)
  chat:
    max-messages-per-session: ${CHAT_MAX_MESSAGES:40}
    daily-sessions-per-agent: ${CHAT_DAILY_SESSIONS:200}
    session-ttl-minutes: ${CHAT_SESSION_TTL_MINUTES:120}

  # Pack draft generator (PackGeneratorProperties)
  pack-generator:
    model: ${PACK_GENERATOR_MODEL:gemini-3.8-flash}
    max-tokens: ${PACK_GENERATOR_MAX_TOKENS:8192}

  # Nightly insight job (InsightProperties)
  insight:
    enabled: ${INSIGHT_ENABLED:true}
    cron: ${INSIGHT_CRON:0 20 6 * * *}
    window-hours: ${INSIGHT_WINDOW_HOURS:24}
    min-calls: ${INSIGHT_MIN_CALLS:10}
    max-per-agent: ${INSIGHT_MAX_PER_AGENT:5}
    model: ${INSIGHT_MODEL:gemini-3.8-flash}
    max-tokens: ${INSIGHT_MAX_TOKENS:2048}

  # Startup dialog simulation, never on in production (SimulationProperties, VoiceSimulationProperties)
  simulation:
    enabled: ${SIMULATION_ENABLED:false}
    personas-path: ${SIMULATION_PERSONAS:}
    scenario-id: ${SIMULATION_SCENARIO_ID:0}
    language: ${SIMULATION_LANGUAGE:uz-UZ}
    max-turns: ${SIMULATION_MAX_TURNS:12}
    persona-model: ${SIMULATION_PERSONA_MODEL:gemini-3.8-flash}
    voice:
      persona-voice: ${SIMULATION_VOICE_PERSONA_VOICE:}
      snr-db: ${SIMULATION_VOICE_SNR_DB:15}
      bot-quiet-ms: ${SIMULATION_VOICE_BOT_QUIET_MS:1500}
      turn-timeout-ms: ${SIMULATION_VOICE_TURN_TIMEOUT_MS:30000}

  # Agent publish gate (AgentEvalProperties)
  agent-eval:
    publish-gate: ${AGENT_EVAL_PUBLISH_GATE:}

  # Engine bundles on the agent form (EngineProfileProperties)
  engine-profiles:
    items:
      - id: fast
        label: Tez va arzon
        description: Qisqa javoblar, eng past narx va kechikish
        stt-provider: yandex
        stt-model: general
        llm-model: gemini-3.5-flash-lite
        fast-llm-model: gemini-3.5-flash-lite
        temperature: 0.65
        max-output-tokens: 200
      - id: balanced
        label: Muvozanatli
        description: Odatiy qo'ng'iroqlar uchun narx va aql muvozanati
        stt-provider: yandex
        stt-model: general
        llm-model: gemini-3.8-flash
        fast-llm-model: gemini-3.5-flash-lite
        temperature: 0.65
        max-output-tokens: 300
      - id: fast
        label: Tez va arzon
        description: Qisqa javoblar, eng past narx va kechikish
        stt-provider: yandex
        stt-model: general
        llm-model: gpt-5.6-luna
        fast-llm-model: gpt-5.6-luna
        temperature: 0.65
        max-output-tokens: 200
      - id: balanced
        label: Muvozanatli
        description: Odatiy qo'ng'iroqlar uchun narx va aql muvozanati
        stt-provider: yandex
        stt-model: general
        llm-model: gpt-5.6-terra
        fast-llm-model: gpt-5.6-luna
        temperature: 0.65
        max-output-tokens: 300
      - id: quality
        label: Sifatli
        description: Murakkab suhbatlar uchun kuchliroq model, sekinroq va qimmatroq
        stt-provider: yandex
        stt-model: general
        llm-model: gpt-5.6-sol
        fast-llm-model: gpt-5.6-luna
        temperature: 0.65
        max-output-tokens: 400

  # Success rate, turnaround SLO and speculation hit rate alerts (AlertingProperties)
  alerting:
    enabled: ${ALERTING_ENABLED:true}
    window-minutes: ${ALERTING_WINDOW_MINUTES:30}
    min-sample: ${ALERTING_MIN_SAMPLE:20}
    success-threshold: ${ALERTING_SUCCESS_THRESHOLD:0.3}
    check-minutes: ${ALERTING_CHECK_MINUTES:5}
    turnaround-budget-ms: ${ALERTING_TURNAROUND_BUDGET_MS:1000}
    turnaround-min-turns: ${ALERTING_TURNAROUND_MIN_TURNS:30}
    speculation-min-hit-rate: ${ALERTING_SPECULATION_MIN_HIT_RATE:0.5}
    provider-failover-threshold: ${ALERTING_PROVIDER_FAILOVER_THRESHOLD:5}
    min-mean-mos: ${ALERTING_MIN_MEAN_MOS:3.5}

  # Live SSE channel (LiveProperties)
  live:
    audio-level-enabled: ${LIVE_AUDIO_LEVEL_ENABLED:false}
    kpi-poll-ms: ${LIVE_KPI_POLL_MS:2000}

  # Recurring campaigns (RecurringCampaignScheduler)
  campaign:
    recurrence-enabled: ${CAMPAIGN_RECURRENCE_ENABLED:true}
    recurrence-check-ms: ${CAMPAIGN_RECURRENCE_CHECK_MS:60000}

  # Webhook delivery retries (WebhookDeliveryService)
  webhook:
    retry-check-ms: ${WEBHOOK_RETRY_CHECK_MS:60000}

  # Default company for startup work (CompanyProperties)
  company:
    default-id: ${COMPANY_DEFAULT_ID:1}

  # ROI report operator yardstick (RoiReportProperties)
  report:
    roi:
      operator-hourly-cost-uzs: ${REPORT_ROI_OPERATOR_HOURLY_COST_UZS:30000}
      operator-seconds-per-attempt: ${REPORT_ROI_OPERATOR_SECONDS_PER_ATTEMPT:45}
      operator-hours-per-month: ${REPORT_ROI_OPERATOR_HOURS_PER_MONTH:176}
