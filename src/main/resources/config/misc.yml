# Everything that has no larger home: clustering, shutdown, QA scoring, chat, pack
# generation, insights, simulation, alerting, the live SSE channel, campaign recurrence,
# webhook retries, the default company.
voice-agent:
  # CallRouteRegistry (§5.1)
  routing:
    instance-id: ${INSTANCE_ID:}
    ttl-minutes: ${ROUTING_TTL_MINUTES:30}

  # ShutdownProperties — drain, then parallel teardown, then ARI event lanes (§12)
  shutdown:
    drain-timeout-sec: ${SHUTDOWN_DRAIN_TIMEOUT:60}
    teardown-timeout-sec: ${SHUTDOWN_TEARDOWN_TIMEOUT:30}
    event-lane-timeout-sec: 5

  # LLM-as-judge scoring of finished calls — QualityProperties
  quality:
    enabled: ${QUALITY_ENABLED:true}
    sample-rate: ${QUALITY_SAMPLE_RATE:1.0}
    model: ${QUALITY_MODEL:gemini-3.8-flash}
    max-tokens: ${QUALITY_MAX_TOKENS:512}

  # Daily pull of each TTS provider's voice list into tts_voice — TtsVoiceSyncProperties.
  # Only providers with a list API (ElevenLabs, Gemini, Cartesia) take part; the rest stay seeded.
  voice-sync:
    enabled: ${VOICE_SYNC_ENABLED:true}
    languages: ${VOICE_SYNC_LANGUAGES:uz-UZ,ru-RU,en-US,kk-KZ}
    interval-ms: ${VOICE_SYNC_INTERVAL_MS:86400000}
    initial-delay-ms: ${VOICE_SYNC_INITIAL_DELAY_MS:30000}

  # The widget's text channel — ChatProperties, ChatService (UNIVERSAL-OPERATOR-PLAN E.4).
  # Ceilings, not preferences: the endpoint is open to anything that can send an HTTP request
  # and every message it holds is a model call somebody pays for.
  chat:
    max-messages-per-session: ${CHAT_MAX_MESSAGES:40}
    daily-sessions-per-agent: ${CHAT_DAILY_SESSIONS:200}
    session-ttl-minutes: ${CHAT_SESSION_TTL_MINUTES:120}

  # Writes a pack draft from a business description — PackGeneratorProperties,
  # SpringAiPackGeneratorAdapter (UNIVERSAL-OPERATOR-PLAN E.1). Used only when somebody presses
  # "generate", so a larger model than the judge's is worth it: the draft is a whole scenario.
  pack-generator:
    model: ${PACK_GENERATOR_MODEL:gemini-3.8-pro}
    max-tokens: ${PACK_GENERATOR_MAX_TOKENS:8192}

  # The nightly job that reads what the judge wrote and proposes what to change —
  # InsightProperties, DailyInsightJob (UNIVERSAL-OPERATOR-PLAN D.3). It reads the quality
  # rows above, so it proposes nothing on a deployment with the judge turned off.
  insight:
    enabled: ${INSIGHT_ENABLED:true}
    # Early morning, so the night's proposals are waiting rather than appearing during the day.
    # For testing: INSIGHT_CRON="0 * * * * *" runs it every minute.
    cron: ${INSIGHT_CRON:0 20 6 * * *}
    window-hours: ${INSIGHT_WINDOW_HOURS:24}
    min-calls: ${INSIGHT_MIN_CALLS:10}
    max-per-agent: ${INSIGHT_MAX_PER_AGENT:5}
    model: ${INSIGHT_MODEL:gemini-3.8-flash}
    max-tokens: ${INSIGHT_MAX_TOKENS:2048}

  # Scripted callers against the real prompt and tools, at startup — DialogSimulationRunner,
  # SimulationProperties. Never on in production: it spends tokens on every boot.
  simulation:
    enabled: ${SIMULATION_ENABLED:false}
    personas-path: ${SIMULATION_PERSONAS:}
    scenario-id: ${SIMULATION_SCENARIO_ID:0}
    language: ${SIMULATION_LANGUAGE:uz-UZ}
    max-turns: ${SIMULATION_MAX_TURNS:12}
    persona-model: ${SIMULATION_PERSONA_MODEL:gemini-3.8-flash}

  # Success rate, turnaround SLO and speculation hit rate — AlertingProperties
  alerting:
    enabled: ${ALERTING_ENABLED:true}
    window-minutes: ${ALERTING_WINDOW_MINUTES:30}
    min-sample: ${ALERTING_MIN_SAMPLE:20}
    success-threshold: ${ALERTING_SUCCESS_THRESHOLD:0.3}
    check-minutes: ${ALERTING_CHECK_MINUTES:5}
    turnaround-budget-ms: ${ALERTING_TURNAROUND_BUDGET_MS:1000}
    turnaround-min-turns: ${ALERTING_TURNAROUND_MIN_TURNS:30}
    speculation-min-hit-rate: ${ALERTING_SPECULATION_MIN_HIT_RATE:0.5}
    provider-failover-threshold: ${ALERTING_PROVIDER_FAILOVER_THRESHOLD:5}
    min-mean-mos: ${ALERTING_MIN_MEAN_MOS:3.5}

  # Live SSE channel (§0.7) — LiveProperties
  live:
    audio-level-enabled: ${LIVE_AUDIO_LEVEL_ENABLED:false}
    kpi-poll-ms: ${LIVE_KPI_POLL_MS:2000}

  # Recurring campaigns (DAILY/WEEKLY/MONTHLY/CRON) — RecurringCampaignScheduler
  campaign:
    recurrence-enabled: ${CAMPAIGN_RECURRENCE_ENABLED:true}
    recurrence-check-ms: ${CAMPAIGN_RECURRENCE_CHECK_MS:60000}

  # Failed webhook deliveries are retried on this tick — WebhookDeliveryService
  webhook:
    retry-check-ms: ${WEBHOOK_RETRY_CHECK_MS:60000}

  # Owner of startup work with no request behind it — CompanyProperties
  company:
    default-id: ${COMPANY_DEFAULT_ID:1}
