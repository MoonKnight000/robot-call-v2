# The LLM side of a call: which model answers a turn, and how the dialog engine drives it.
# Vendor defaults below are what Spring AI binds when a company has no AiModelConfig of its own.
spring:
  ai:
    model:
      chat: ${LLM_CHAT_PROVIDER:google-genai}

    # Gemini
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${LLM_DIALOG_MODEL:gemini-3.8-flash}
          max-output-tokens: 1024
          # LOW / MEDIUM / HIGH (MINIMAL is unsupported on 3.8 Flash)
          thinking-level: ${LLM_REASONING_EFFORT:LOW}

    # OpenAI itself, not an OpenAI-compatible vendor (see TurnTools#buildOptions)
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:disabled}
      chat:
        model: ${LLM_DIALOG_MODEL:gpt-5.6-luna}
        max-tokens: 1024

    # Claude
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:disabled}
      chat:
        model: ${LLM_DIALOG_MODEL:claude-haiku-5-5}
        max-tokens: 1024

voice-agent:
  # Selectable text-LLM vendors (ChatProviderProperties)
  llm:
    default-provider: ${LLM_CHAT_PROVIDER:google-genai}
    gemini-api-key: ${GEMINI_API_KEY:}
    open-ai-api-key: ${OPENAI_API_KEY:}
    open-ai-base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}

  # Panel AI copilot (CopilotProperties)
  copilot:
    model: ${COPILOT_MODEL:gemini-3.8-flash}
    max-tokens: ${COPILOT_MAX_TOKENS:8192}
    max-tool-calls: ${COPILOT_MAX_TOOL_CALLS:15}
    max-history: ${COPILOT_MAX_HISTORY:20}

  # Post-call summary (SummaryProperties)
  summary:
    enabled: ${SUMMARY_ENABLED:true}
    model: ${SUMMARY_MODEL:gemini-3.8-flash}
    reasoning-effort: ${SUMMARY_REASONING_EFFORT:low}
    max-tokens: ${SUMMARY_MAX_TOKENS:2048}
    timeout-ms: ${SUMMARY_TIMEOUT_MS:60000}

  # Real-time intent detection (IntentProperties)
  intent:
    enabled: ${INTENT_DETECTION_ENABLED:true}

  # Dialog engine (DialogProperties, LlmTimeoutProperties, PromptCacheProperties, ReplyLimitProperties, ChunkerProperties, DialogTuningProperties, TestContextProperties)
  dialog:
    enabled: ${DIALOG_ENABLED:true}
    auto-start: ${DIALOG_AUTO_START:true}
    language: ${DIALOG_LANGUAGE:uz-UZ}
    tts-voice: ${DIALOG_TTS_VOICE:}
    greeting-delay-ms: ${DIALOG_GREETING_DELAY_MS:400}
    max-turns: ${DIALOG_MAX_TURNS:25}
    language-switch-finals: ${DIALOG_LANGUAGE_SWITCH_FINALS:1}
    max-call-seconds: ${DIALOG_MAX_CALL_SECONDS:300}
    streaming: ${DIALOG_STREAMING:true}
    # "bir lahza" only when this call's measured first-token wait reaches this; said at once, not after a timer.
    filler-wait-threshold-ms: ${DIALOG_FILLER_WAIT_THRESHOLD_MS:2500}
    # That filler is a few words about what the caller said, from the fast model; "Bir lahza" is the fallback.
    filler-bridge: ${DIALOG_FILLER_BRIDGE:false}
    backchannel-after-ms: ${DIALOG_BACKCHANNEL_AFTER_MS:4000}
    backchannel-volume-percent: ${DIALOG_BACKCHANNEL_VOLUME_PERCENT:35}
    interject-after-ms: ${DIALOG_INTERJECT_AFTER_MS:25000}
    false-interruption-timeout-ms: ${DIALOG_FALSE_INTERRUPTION_TIMEOUT_MS:1500}
    wait-for-caller-timeout-ms: ${DIALOG_WAIT_FOR_CALLER_TIMEOUT_MS:3000}
    prompt-cache:
      warmup: ${DIALOG_LLM_WARMUP:true}
      warmup-fast-model: ${DIALOG_LLM_WARMUP_FAST_MODEL:true}
      stable-toolset: ${DIALOG_STABLE_TOOLSET:true}
    # Output cap of a turn when the company/agent sets none (ReplyLimitProperties); 0 = vendor default.
    # A thinking model gets the reserve on top: its reasoning counts against the same cap.
    reply-limit:
      max-tokens: ${DIALOG_REPLY_MAX_TOKENS:70}
      thinking-reserve-tokens: ${DIALOG_REPLY_THINKING_RESERVE_TOKENS:768}
    # Where a streamed reply is cut for synthesis (ChunkerProperties). Only the opening piece is on the
    # caller's clock, so it is cut at a comma after a few words; later pieces keep whole sentences.
    # The effect shows as the chunk_wait stage of voice.turn.stage.latency.
    chunker:
      opening-min-chars: ${DIALOG_CHUNKER_OPENING_MIN_CHARS:14}
      opening-clause-words: ${DIALOG_CHUNKER_OPENING_CLAUSE_WORDS:4}
      min-chunk-chars: ${DIALOG_CHUNKER_MIN_CHUNK_CHARS:20}
      long-clause-chars: ${DIALOG_CHUNKER_LONG_CLAUSE_CHARS:90}
    llm-timeout:
      token-gap-ms: ${DIALOG_LLM_TOKEN_GAP_TIMEOUT_MS:5000}
      queue-drain-ms: ${DIALOG_LLM_QUEUE_DRAIN_TIMEOUT_MS:30000}
      call-timeout-ms: ${DIALOG_LLM_CALL_TIMEOUT_MS:15000}
      backup-after-ms: ${DIALOG_LLM_BACKUP_AFTER_MS:1000}
    tuning:
      drain-timeout-ms: ${DIALOG_DRAIN_TIMEOUT_MS:30000}
      farewell-grace-ms: ${DIALOG_FAREWELL_GRACE_MS:15000}
      min-echo-chars: ${DIALOG_MIN_ECHO_CHARS:15}
      llm-retry-backoff-ms: ${DIALOG_LLM_RETRY_BACKOFF_MS:200}
      max-stage-attempts: ${DIALOG_MAX_STAGE_ATTEMPTS:8}
      playback-poll-ms: 100
      hangup-tail-ms: ${DIALOG_HANGUP_TAIL_MS:500}
    preemptive: ${DIALOG_PREEMPTIVE:true}
    preemptive-tts: ${DIALOG_PREEMPTIVE_TTS:true}
    speculative-turn-cue: ${DIALOG_SPECULATIVE_TURN_CUE:true}
    preemptive-min-chars: ${DIALOG_PREEMPTIVE_MIN_CHARS:5}
    min-interruption-words: ${DIALOG_MIN_INTERRUPTION_WORDS:3}
    mandatory-disclosure: ${DIALOG_MANDATORY_DISCLOSURE:false}
    fast-model: ${DIALOG_FAST_MODEL:gemini-3.5-flash-lite}
    fast-model-max-words: ${DIALOG_FAST_MODEL_MAX_WORDS:10}
    state-scoped-tools: ${DIALOG_STATE_SCOPED_TOOLS:true}
    history-max-messages: ${DIALOG_HISTORY_MAX_MESSAGES:40}
    no-input-seconds: ${DIALOG_NO_INPUT_SECONDS:9}
    no-input-max-prompts: ${DIALOG_NO_INPUT_MAX_PROMPTS:2}
    # The first check(s) on a quiet line are worded by the fast model about the conversation; the last stays fixed.
    no-input-contextual: ${DIALOG_NO_INPUT_CONTEXTUAL:true}
    fast-path: ${DIALOG_FAST_PATH:true}
    knowledge-base: ${DIALOG_KNOWLEDGE_BASE:true}
    low-confidence-threshold: ${DIALOG_LOW_CONFIDENCE_THRESHOLD:0.5}
    fact-guard: ${DIALOG_FACT_GUARD:true}
    # noteClientFact: the model notes what the caller said that no outcome tool records; carried in every turn's annex.
    client-facts: ${DIALOG_CLIENT_FACTS:true}
    fact-violation-escalate-after: ${DIALOG_FACT_VIOLATION_ESCALATE_AFTER:2}
    pre-tool-speech: ${DIALOG_PRE_TOOL_SPEECH:true}
    knowledge-passages: ${DIALOG_KNOWLEDGE_PASSAGES:3}
    tool-result-rounds: ${DIALOG_TOOL_RESULT_ROUNDS:2}
    max-tokens-per-call: ${DIALOG_MAX_TOKENS_PER_CALL:0}
    test-context:
      client-name: ${TEST_CLIENT_NAME:Murodjon}
      debt-amount: ${TEST_DEBT_AMOUNT:1500000}
      currency: ${TEST_CURRENCY:so'm}
      due-date: ${TEST_DUE_DATE:2026-10-01}
      contract-number: ${TEST_CONTRACT_NUMBER:12345}
      goal: ${TEST_GOAL:Qarzdorlik bo'yicha to'lov sanasini kelishish}
      scenario-key: ${TEST_SCENARIO_KEY:debt-collection}
