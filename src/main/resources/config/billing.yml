# What a call costs, all in UZS. See BillingRateProperties, BillingRates, BillingLlmRates,
# BillingAutoRecharge — including why the numbers are written in UZS rather than USD.
voice-agent:
  billing:
    version: ${BILLING_RATE_VERSION:2026-09-v1}
    enforce-balance: ${BILLING_ENFORCE_BALANCE:true}
    reservation-uzs: ${BILLING_RESERVATION_UZS:5000}

    rates:
      llm:
        prompt-per-million-uzs: ${BILLING_LLM_PROMPT_UZS:1900}
        completion-per-million-uzs: ${BILLING_LLM_COMPLETION_UZS:7600}
        cached-prompt-per-million-uzs: ${BILLING_LLM_CACHED_UZS:475}
      stt-per-minute-uzs: ${BILLING_STT_UZS:75}
      tts-per-1k-chars-uzs: ${BILLING_TTS_UZS:50}
      # Speech-to-speech engine per connected minute (recognition + reasoning + speech in
      # one). ~0.03 USD/min for Gemini Live at typical talk ratios; set from the vendor's
      # invoice, not from this default.
      realtime-per-minute-uzs: ${BILLING_REALTIME_UZS:400}
      telephony-per-minute-uzs: ${BILLING_TELEPHONY_UZS:190}
      platform-fee-per-minute-uzs: ${BILLING_PLATFORM_FEE_UZS:100}
      markup-basis-points: ${BILLING_MARKUP_BPS:2000}

    auto-recharge:
      threshold-uzs: ${BILLING_AUTO_RECHARGE_THRESHOLD_UZS:50000}
      amount-uzs: ${BILLING_AUTO_RECHARGE_AMOUNT_UZS:500000}
      cron: ${BILLING_AUTO_RECHARGE_CRON:0 */15 * * * *}

    # The free trial a self-registered company starts with (TrialCreditProperties). Trial
    # money is spent first; what is left of it after `duration` is taken back.
    trial:
      credit-uzs: ${BILLING_TRIAL_CREDIT_UZS:20000}
      duration: ${BILLING_TRIAL_DURATION:7d}
      expiry-cron: ${BILLING_TRIAL_EXPIRY_CRON:0 0 * * * *}

    # Payme / Click top-ups (PaymentProperties). Credentials come from the merchant cabinets
    # and are never committed; a method left unconfigured refuses its top-ups with 409
    # PAYMENT_METHOD_NOT_CONFIGURED and its callbacks as unauthenticated.
    payment:
      # A top-up left unpaid this long becomes EXPIRED (checked every expiry-cron).
      topup-ttl: ${PAYMENT_TOPUP_TTL:24h}
      expiry-cron: ${PAYMENT_TOPUP_EXPIRY_CRON:0 */10 * * * *}
      payme:
        enabled: ${PAYME_ENABLED:false}
        merchant-id: ${PAYME_MERCHANT_ID:}
        # Cashbox key; Payme's callbacks authenticate as HTTP Basic Paycom:<key>.
        key: ${PAYME_KEY:}
        # https://test.paycom.uz for the sandbox.
        checkout-url: ${PAYME_CHECKOUT_URL:https://checkout.paycom.uz}
        return-url: ${PAYME_RETURN_URL:}
        # Fiscal receipt (CheckPerformTransaction.detail); blank IKPU code sends none.
        ikpu-code: ${PAYME_IKPU_CODE:}
        package-code: ${PAYME_PACKAGE_CODE:}
        vat-percent: ${PAYME_VAT_PERCENT:12}
      click:
        enabled: ${CLICK_ENABLED:false}
        service-id: ${CLICK_SERVICE_ID:}
        merchant-id: ${CLICK_MERCHANT_ID:}
        # Every Click callback's sign_string is an md5 over this key.
        secret-key: ${CLICK_SECRET_KEY:}
        return-url: ${CLICK_RETURN_URL:}
