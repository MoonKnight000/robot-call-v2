components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "JWT access token obtained from /api/auth/login. Pass in header: 'Authorization: Bearer <token>'"
    ApiKeyAuth:
      type: "apiKey"
      in: "header"
      name: "X-Api-Key"
      description: "Company API key for automated external integrations and cron jobs."
