openapi: "3.0.3"
info:
  title: "Uysot Voice Platform (robot-call-v2) API"
  version: "2.0.0"
  description: "AI-powered voice agent platform, automated outbound/inbound call center, IVR routing, real-time telephony, and omnichannel conversational AI."
servers:
  - url: "/"
    description: "Current Server (Relative)"
  - url: "https://voice.app.uysot.uz"
    description: "Production Environment"
tags:
  - name: "AI Agents"
    description: "Ovozli sun'iy intellekt agentlari, xarakter, prompt va ovoz sozlamalari"
  - name: "AI Model Settings"
    description: "Company-level default AI model configurations, temperature, and token parameters"
  - name: "AI Models Catalog"
    description: "Supported foundational LLM, Speech-to-Speech, and voice models catalog"
  - name: "API Keys"
    description: "Dasturiy kirish uchun API-kalitlar va ularning huquqlari"
  - name: "Auth"
    description: "Foydalanuvchi autentifikatsiyasi, tokenlar, 2FA TOTP va parolni tiklash"
  - name: "Billing"
    description: "Kompaniya balansi, tariflar va to'lovlar (Payme, Click)"
  - name: "Payment Webhooks"
    description: "Payment gateway callback processing for Click and Payme merchant services"
  - name: "Call Flows"
    description: "Visual IVR graphs, routing flowcharts, validation, and publishing"
  - name: "Call Queues"
    description: "Operator navbatlari, qo'ng'iroqlarni taqsimlash va guruhlar"
  - name: "Calls"
    description: "Qo'ng'iroqlar jurnali (CDR), audio yozuvlar, transkript va tahlillar"
  - name: "Campaigns"
    description: "Chiqish qo'ng'iroqlari kampaniyalari, nishon raqamlar va CSV yuklash"
  - name: "Campaign A/B Variants"
    description: "Campaign A/B testing variant management and conversion comparative reports"
  - name: "Public Widget Chat"
    description: "Public text conversation channel for website AI agents"
  - name: "Chat History"
    description: "Audit and review history of Widget and Telegram AI text conversations"
  - name: "Telegram Bots"
    description: "Management and public webhook receivers for AI agent Telegram bots"
  - name: "Companies"
    description: "Kompaniya profili, telefon sozlamalari va ish tartibi"
  - name: "Contacts"
    description: "Kontaktlar kitobi, ro'yxatlar, teglar va import"
  - name: "Conversions & Attribution"
    description: "Call conversion goals, business outcomes, and call attribution tracking"
  - name: "CRM Webhooks"
    description: "CRM integratsiyalari va kiruvchi webhooklar (Uysot, AmoCRM, Bitrix24)"
  - name: "Do Not Call"
    description: "Chiqish qo'ng'iroqlari taqiqlangan raqamlar (DNC) qora ro'yxati"
  - name: "Inbound Caller Rules"
    description: "Caller-specific routing rules, VIP priority overrides, and inbound blocklists"
  - name: "Inbound Routes"
    description: "Kiruvchi raqamlar, yo'naltirish qoidalari va IVR menyular"
  - name: "Agent Insights"
    description: "AI agent continuous self-improvement suggestions, prompt tuning insights, and supervisor approvals"
  - name: "CRM Integrations"
    description: "CRM integrations (Uysot, amoCRM, Kommo, Bitrix24) and OAuth connection management"
  - name: "Knowledge Base"
    description: "RAG bilimlar bazasi, manbalar va semantik qidiruv hujjatlari"
  - name: "Knowledge Base Sources"
    description: "RAG document uploads, web crawlers, and ingestion queue for agent knowledge"
  - name: "Live Call Control"
    description: "Live call supervisory actions: whisper coaching, operator takeover, and scenario mid-call switching"
  - name: "Live Stream"
    description: "Realtime SSE streaming events (call lifecycle, live audio levels, transcripts, KPI)"
  - name: "Model Context Protocol (MCP)"
    description: "Integration with external Model Context Protocol (MCP) servers and tool sets"
  - name: "Client Memory"
    description: "Cross-call memory, persistent facts, preferences, and supervisor notes about callers"
  - name: "Missed Calls"
    description: "Missed calls queue management and operator callback workflows"
  - name: "Notifications"
    description: "User notifications inbox and preferences"
  - name: "Notification Settings"
    description: "Company-level notification channel matrix and alerts configuration"
  - name: "Operators"
    description: "Operator hisoblari, navbat a'zoligi va SIP webphone ma'lumotlari"
  - name: "Industry Packs"
    description: "Pre-built vertical industry templates (debt collection, retail, clinic, real estate) and custom pack generation"
  - name: "User Profile"
    description: "Current user self-service profile, 2FA, avatar, sessions, and UI preferences"
  - name: "Call Quality Reviews"
    description: "Quality monitoring, AI call evaluations, and supervisor reviews inbox"
  - name: "Reports & Analytics"
    description: "Contact center, campaign performance, queue metrics, and call detail analytics"
  - name: "Reports"
    description: "Aloqa markazi analitikasi, KPI ko'rsatkichlari va hisobot eksporti"
  - name: "Roles"
    description: "Rollar (RBAC) va ruxsatnomalar katalogi"
  - name: "Scenarios"
    description: "Vizual dialog ssenariylari, graf tugunlari va ssenariy testi"
  - name: "Business Schedules & Holidays"
    description: "Call center operating hours, holiday calendars, and open/closed status calculation"
  - name: "Global Search"
    description: "Global command palette search across calls, campaigns, and contacts"
  - name: "Secret Vault"
    description: "Encrypted storage for external API tokens, credentials, and secrets"
  - name: "Files"
    description: "Unified file storage, upload, and media streaming endpoints"
  - name: "Tools"
    description: "AI agent custom function calling tools, REST integrations, and OpenAPI 3 import"
  - name: "Users"
    description: "Foydalanuvchilar ro'yxati, taklifnoma, rol biriktirish va bloklash"
  - name: "Speech & Voice Preview"
    description: "Speech synthesis (TTS) and recognition (STT) testing and audio preview"
  - name: "Voice Settings"
    description: "Company-level speech synthesis and recognition default tuning overrides"
  - name: "Voicemail"
    description: "Voicemail boxes and incoming audio messages queue"
  - name: "Website Widgets"
    description: "Management and public runtime endpoints for website AI voice call widgets"
paths:
  "/api/ai-agents/templates":
    get:
      tags:
        - "AI Agents"
      summary: "Tayyor agent shablonlarini olish (Templates)"
      parameters:
        - name: "language"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/ai-agents/engine-options":
    get:
      tags:
        - "AI Agents"
      summary: "Qo'llab-quvvatlanadigan STT/TTS va LLM dvigatel parametrlari"
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/ai-agents":
    post:
      tags:
        - "AI Agents"
      summary: "Yangi AI agent yaratish"
      requestBody:
        required: true
        description: "CreateAiAgentRequest request body"
        content:
          "application/json":
            schema:
              type: "object"
              description: "CreateAiAgentRequest"
      responses:
        200:
          description: "Agent yaratildi"
          content:
            "application/json":
              schema:
                type: "object"
        400:
          description: "Validatsiya xatosi"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/ai-agentsid:\\d+":
    get:
      tags:
        - "AI Agents"
      summary: "Bitta sinov natijasi tafsilotlari (transkript va baholar)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Agent identifikatori"
          schema:
            type: "integer"
            format: "int64"
        - name: "runId"
          in: "path"
          required: true
          description: "Sinov yugurishi identifikatori"
          schema:
            type: "integer"
            format: "int64"
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
    put:
      tags:
        - "AI Agents"
      summary: "Sinov holatini tahrirlash"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Agent identifikatori"
          schema:
            type: "integer"
            format: "int64"
        - name: "caseId"
          in: "path"
          required: true
          description: "Sinov holati identifikatori"
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        required: true
        description: "SaveAgentTestCaseRequest request body"
        content:
          "application/json":
            schema:
              type: "object"
              description: "SaveAgentTestCaseRequest"
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
    delete:
      tags:
        - "AI Agents"
      summary: "Sinov holatini o'chirish"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Agent identifikatori"
          schema:
            type: "integer"
            format: "int64"
        - name: "caseId"
          in: "path"
          required: true
          description: "Sinov holati identifikatori"
          schema:
            type: "integer"
            format: "int64"
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
    post:
      tags:
        - "AI Agents"
      summary: "Agentni sinovdan o'tkazishni boshlash (Evaluate)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Agent identifikatori"
          schema:
            type: "integer"
            format: "int64"
        - name: "version"
          in: "query"
          required: false
          schema:
            type: "integer"
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/api-keys/scopes":
    get:
      tags:
        - "API Keys"
      summary: "Berilishi mumkin bo'lgan huquqlar (Scopes)"
      description: "API kalitiga biriktirish mumkin bo'lgan ruxsatnomalar to'plamini qaytaradi. Huquq: `API_KEY_READ`."
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/api-keys":
    get:
      tags:
        - "API Keys"
      summary: "Kompaniya API kalitlari ro'yxati"
      description: "Kompaniyaning barcha faol va bekor qilingan API kalitlari ro'yxatini qaytaradi. Kalit maxfiy qismi ko'rinmaydi. Huquq: `API_KEY_READ`."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "API kalit identifikatori"
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        required: true
        description: "CreateApiKeyRequest request body"
        content:
          "application/json":
            schema:
              type: "object"
              description: "CreateApiKeyRequest"
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/auth/login":
    post:
      tags:
        - "Auth"
      summary: "Tizimga kirish (Login)"
      description: "Foydalanuvchi nomi va parol orqali tizimga kirish. Muvaffaqiyatli kirilganda "
      requestBody:
        required: true
        description: "LoginRequest request body"
        content:
          "application/json":
            schema:
              type: "object"
              description: "LoginRequest"
      responses:
        200:
          description: "Muvaffaqiyatli kirish"
          content:
            "application/json":
              schema:
                type: "object"
        400:
          description: "Noto'g'ri login/parol yoki 2FA kodi talab qilinadi (TOTP_REQUIRED)"
          content:
            "application/json":
              schema:
                type: "object"
        429:
          description: "Urinishlar soni oshib ketganligi sababli vaqtincha bloklangan (LOGIN_TEMPORARILY_LOCKED)"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/auth/activate":
    post:
      tags:
        - "Auth"
      summary: "Akkauntni faollashtirish"
      description: "Taklifnoma tokeni (`token`) va yangi parol bilan taklif etilgan yangi akkauntni faollashtiradi."
      requestBody:
        required: true
        description: "ActivateRequest request body"
        content:
          "application/json":
            schema:
              type: "object"
              description: "ActivateRequest"
      responses:
        200:
          description: "Akkaunt faollashtirildi va tizimga kirildi"
          content:
            "application/json":
              schema:
                type: "object"
        400:
          description: "Token yaroqsiz yoki muddati o'tgan"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/auth/forgot-password":
    post:
      tags:
        - "Auth"
      summary: "Parolni unutganda tiklash so'rovi"
      description: "Ko'rsatilgan email manziliga parolni tiklash tokenini yuboradi."
      requestBody:
        required: true
        description: "ForgotPasswordRequest request body"
        content:
          "application/json":
            schema:
              type: "object"
              description: "ForgotPasswordRequest"
      responses:
        200:
          description: "Parolni tiklash xati yuborildi"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/auth/reset-password":
    post:
      tags:
        - "Auth"
      summary: "Parolni yangilash (Reset password)"
      description: "Email orqali olingan token va yangi parol bilan parolni yangilaydi."
      requestBody:
        required: true
        description: "ResetPasswordRequest request body"
        content:
          "application/json":
            schema:
              type: "object"
              description: "ResetPasswordRequest"
      responses:
        200:
          description: "Parol muvaffaqiyatli yangilandi"
          content:
            "application/json":
              schema:
                type: "object"
        400:
          description: "Token eskirgan yoki yaroqsiz"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/auth/refresh":
    post:
      tags:
        - "Auth"
      summary: "Access tokenni yangilash (Refresh token)"
      description: "Eskirgan access tokenni HttpOnly cookie yoki JSON body orqali uzatilgan `refresh_token` yordamida yangilaydi."
      requestBody:
        required: true
        description: "RefreshTokenRequest request body"
        content:
          "application/json":
            schema:
              type: "object"
              description: "RefreshTokenRequest"
      responses:
        200:
          description: "Yangi access va refresh token berildi"
          content:
            "application/json":
              schema:
                type: "object"
        401:
          description: "Refresh token muddati o'tgan yoki bekor qilingan"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/auth/logout":
    post:
      tags:
        - "Auth"
      summary: "Tizimdan chiqish (Logout)"
      description: "Foydalanuvchi sessiyasini bekor qiladi va brauzerdagi `refresh_token` cookie'sini tozalaydi."
      responses:
        200:
          description: "Muvaffaqiyatli chiqildi"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/auth/me":
    get:
      tags:
        - "Auth"
      summary: "Joriy foydalanuvchi profili va huquqlari"
      description: "Tizimga kirgan joriy foydalanuvchining shaxsiy ma'lumotlari, roli, huquqlari (permissions) va kompaniyasini qaytaradi."
      responses:
        200:
          description: "Foydalanuvchi ma'lumotlari"
          content:
            "application/json":
              schema:
                type: "object"
        401:
          description: "Autentifikatsiyadan o'tilmagan"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/auth/stream-ticket":
    post:
      tags:
        - "Auth"
      summary: "Oqimlar uchun bir martalik chipta (Stream Ticket)"
      description: "Brauzerning `EventSource` (SSE) yoki audio pleerlari `Authorization` sarlavhasini yubora olmagan holatlar uchun 60 soniya yaroqli bir martalik chipta yaratadi."
      responses:
        200:
          description: "Chipta muvaffaqiyatli yaratildi"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/auth/uysot/callback":
    post:
      tags:
        - "Auth"
      summary: "Uysot CRM OAuth Callback orqali kirish"
      description: "Uysot CRM tizimidan OAuth callback orqali kelgan foydalanuvchini autentifikatsiya qiladi."
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/companies":
    get:
      tags:
        - "Auth"
      summary: "Foydalanuvchiga tegishli kompaniyalar"
      description: "Joriy foydalanuvchi kirish huquqiga ega bo'lgan kompaniyalar ro'yxatini qaytaradi."
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
    post:
      tags:
        - "Companies"
      summary: "Yangi kompaniya (ijorachi) ro'yxatdan o'tkazish"
      description: "Platforma ma'murlari uchun yangi tenant kompaniya ochish. Huquq: `PLATFORM_ADMIN`."
      requestBody:
        required: true
        description: "CreateCompanyRequest request body"
        content:
          "application/json":
            schema:
              type: "object"
              description: "CreateCompanyRequest"
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/billing/overview":
    get:
      tags:
        - "Billing"
      summary: "Hisob-kitob umumiy ko'rinishi (Overview)"
      description: "Joriy balans, oylik sarf-xarajatlar, kutilayotgan invoyslar va tarif rejasini qaytaradi. Huquq: `BILLING_READ`."
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/billing/spend-chart":
    get:
      tags:
        - "Billing"
      summary: "Oylik xarajatlar grafigi"
      description: "So'nggi oylardagi (odatiy 6 oy) sarflangan mablag' dinamikasi. Huquq: `BILLING_READ`."
      parameters:
        - name: "months"
          in: "query"
          required: true
          description: "Oylar soni"
          schema:
            type: "integer"
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/billing/invoices":
    get:
      tags:
        - "Billing"
      summary: "Invoyslar (Hisob-fakturalar) ro'yxati"
      description: "Barcha to'lovlar va hisob-fakturalar tarixini sahifalab olish. Huquq: `BILLING_READ`."
      parameters:
        - name: "page"
          in: "query"
          required: true
          schema:
            type: "integer"
        - name: "size"
          in: "query"
          required: true
          schema:
            type: "integer"
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/billingid":
    get:
      tags:
        - "Billing"
      summary: "Invoysni PDF shaklida yuklab olish"
      description: "To'lov hisob-fakturasining rasmiy PDF hujjatini yuklab oladi. Huquq: `BILLING_READ`."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Invoys identifikatori"
          schema:
            type: "string"
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/billing/topup":
    post:
      tags:
        - "Billing"
      summary: "Balansni to'ldirish (Top-up)"
      description: "Payme yoki Click orqali hisobni to'ldirish uchun to'lov havolasi va tranzaksiya ma'lumotlarini yaratadi. Huquq: `BILLING_EDIT`."
      requestBody:
        required: true
        description: "TopupRequest request body"
        content:
          "application/json":
            schema:
              type: "object"
              description: "TopupRequest"
      responses:
        200:
          description: "Success"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/billing/click/prepare":
    post:
      tags:
        - "Payment Webhooks"
      summary: "Click payment prepare webhook"
      description: "Called by Click servers (action 0) to verify and open a pending transaction."
      parameters:
        - name: "form"
          in: "query"
          required: true
          description: "Click URL-encoded form parameters"
          schema:
            type: "string"
      responses:
        200:
          description: "Click JSON response with error code and prepare ID"
          content:
            "application/json":
              schema:
                type: "object"
  "/api/billing/click/complete":
    post:
      tags:
        - "Payment Webhooks"
      summary: "Click payment complete webhook"
      description: "Called by Click servers (action 1) to finalize transaction and credit balance."
      parameters:
        - name: "form"
          in: "query"
          required: true
          description: "Click URL-encoded form parameters"
          schema:
            type: "string"
      responses:
        200:
          description: "Click JSON response with confirm status"
          content:
            "application/json":
              schema:
                type: "object"
  "/api/billing/payme/callback":
    post:
      tags:
        - "Payment Webhooks"
      summary: "Payme JSON-RPC 2.0 merchant webhook"
      description: "Handles Payme merchant callbacks (CheckPerformTransaction, CreateTransaction, PerformTransaction, etc.)."
      parameters:
        - name: "authorization"
          in: "header"
          required: false
          schema:
            type: "string"
      requestBody:
        required: true
        description: "String request body"
        content:
          "application/json":
            schema:
              type: "object"
              description: "String"
      responses:
        200:
          description: "Payme JSON-RPC 2.0 response"
          content:
            "application/json":
              schema:
                type: "object"
  "/api/call-flows":
    post:
      tags:
        - "Call Flows"
      summary: "Create call flow"
      description: "Creates a new IVR routing flow graph. Requires CALL_FLOW_EDIT."
      requestBody:
        required: true
        description: "SaveCallFlowRequest request body"
        content:
          "application/json":
            schema:
              type: "object"
              description: "SaveCallFlowRequest"
      responses:
        200:
          description: "Paginated list of call flows"
          content:
            "application/json":
              schema:
                type: "object"
        400:
          description: "Invalid call flow schema or structure"
          content:
            "application/json":
              schema:
                type: "object"
      security:
        - BearerAuth: []
  "/api/call-flowsid":
    get:
      tags:
        - "Call Flows"
      summary: "Get call flow by ID"
