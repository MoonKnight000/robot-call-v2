/api/voicemails/{id}/audio:
  get:
    tags:
    - Voicemail
    summary: Xabarni tinglash
    description: |-
      The message audio (WAV); supports `Range` like a call recording.

      **Huquq:** `MISSED_CALL_READ`
    operationId: voicemail_audio
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: Range
      in: header
      required: false
      schema:
        type: string
    responses:
      '200':
        description: Fayl
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
/api/voicemails/{id}/status:
  put:
    tags:
    - Voicemail
    summary: Holatni o'zgartirish
    description: '**Huquq:** `MISSED_CALL_EDIT`'
    operationId: voicemail_updateStatus
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/voicemail.yaml#/UpdateVoicemailStatusRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
