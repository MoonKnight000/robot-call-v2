# Reports — report controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/reports/audit/list:
  post:
    tags:
    - Reports
    summary: Tizim audit jurnali (Audit log)
    description: '**Huquq:** `AUDIT_READ`'
    operationId: report_auditLog
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/audit.yaml#/AuditFilter
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/audit.yaml#/AuditLogPage
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
