# Platform SIP trunks — PLATFORM_ADMIN sets up any company's trunks (PlatformSipTrunkController).
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/companies/{companyId}/sip-trunks:
  post:
    tags:
    - Companies
    summary: Trunk yaratish
    description: '**Huquq:** `PLATFORM_ADMIN`'
    operationId: platformSipTrunk_create
    parameters:
    - name: companyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/siptrunk.yaml#/CreateSipTrunkRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/siptrunk.yaml#/SipTrunkRow
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
