# Contacts — contact controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/contacts:
  post:
    tags:
    - Contacts
    summary: Yangi kontakt
    description: '**Huquq:** `CONTACT_EDIT`'
    operationId: contact_create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/contact.yaml#/CreateContactRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/contact.yaml#/Contact
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
/api/contacts/csv:
  post:
    tags:
    - Contacts
    summary: Kontaktlarni CSV'dan import qilish
    description: '**Huquq:** `CONTACT_EDIT`'
    operationId: contact_importCsv
    requestBody:
      required: true
      content:
        text/csv:
          schema:
            type: string
        text/plain:
          schema:
            type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/contact.yaml#/ContactImportResult
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
/api/contacts/data:
  get:
    tags:
    - Contacts
    summary: Shaxs ma'lumotlari eksporti {#subject-export}
    description: '**Huquq:** `CONTACT_READ`'
    operationId: contact_exportData
    parameters:
    - name: phone
      in: query
      required: true
      schema:
        type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/contact.yaml#/ContactDataExport
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
  delete:
    tags:
    - Contacts
    summary: Shaxs ma'lumotlarini o'chirish {#subject-erasure}
    description: '**Huquq:** `CONTACT_EDIT`'
    operationId: contact_eraseData
    parameters:
    - name: phone
      in: query
      required: true
      schema:
        type: string
    - name: confirm
      in: query
      required: false
      schema:
        type: boolean
        default: false
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/contact.yaml#/ContactErasureResponse
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
