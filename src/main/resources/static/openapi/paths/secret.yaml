# Secret Vault — secret controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/secrets:
  get:
    tags:
    - Secret Vault
    summary: Maxfiy kalitlar ro'yxati
    description: '**Huquq:** `INTEGRATION_READ`'
    operationId: secret_list
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../schemas/secret.yaml#/SecretRow
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
  post:
    tags:
    - Secret Vault
    summary: Yangi maxfiy kalit yaratish
    description: '**Huquq:** `INTEGRATION_EDIT`'
    operationId: secret_create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/secret.yaml#/CreateSecretRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/secret.yaml#/SecretRow
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
/api/secrets/{id}:
  get:
    tags:
    - Secret Vault
    summary: Kalit tafsilotlarini olish
    description: '**Huquq:** `INTEGRATION_READ`'
    operationId: secret_get
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/secret.yaml#/SecretRow
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
  put:
    tags:
    - Secret Vault
    summary: Kalitni tahrirlash
    description: |-
      A blank `value` keeps the stored one, so a rename need not resend the secret.

      **Huquq:** `INTEGRATION_EDIT`
    operationId: secret_update
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/secret.yaml#/UpdateSecretRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/secret.yaml#/SecretRow
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
  delete:
    tags:
    - Secret Vault
    summary: Kalitni o'chirish
    description: '**Huquq:** `INTEGRATION_EDIT`'
    operationId: secret_delete
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
