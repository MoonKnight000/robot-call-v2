# Scenarios — scenario controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/scenarios:
  post:
    tags:
    - Scenarios
    summary: Yangi ssenariy
    description: '**Huquq:** `SCENARIO_EDIT`'
    operationId: scenario_create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/scenario.yaml#/CreateScenarioRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/scenario.yaml#/ScenarioRow
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
/api/scenarios/filter:
  post:
    tags:
    - Scenarios
