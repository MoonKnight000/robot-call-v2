  post:
    tags:
    - Live Call Control
    summary: Jonli operator ko'rsatmasi (Whisper Mode)
    description: '**Huquq:** `OPERATOR_EDIT`'
    operationId: liveControl_whisper
    parameters:
    - name: channelId
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/live.yaml#/WhisperRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/live.yaml#/LiveControlResponse
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
