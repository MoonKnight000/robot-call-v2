# Campaigns — campaign controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/campaigns:
  post:
    tags:
    - Campaigns
    summary: Yangi kampaniya yaratish
    description: '**Huquq:** `CAMPAIGN_EDIT`'
    operationId: campaign_create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/campaign.yaml#/CreateCampaignRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/campaign.yaml#/CreateCampaignResponse
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
