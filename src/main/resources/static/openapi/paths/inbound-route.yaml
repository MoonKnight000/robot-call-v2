# Inbound Routes — inbound-route controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/inbound-routes:
  post:
    tags:
    - Inbound Routes
    summary: Yangi marshrut
    description: '**Huquq:** `INBOUND_ROUTE_EDIT`'
    operationId: inboundRoute_create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/inbound.yaml#/CreateInboundRouteRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/inbound.yaml#/InboundRouteRow
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
