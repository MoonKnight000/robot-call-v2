# User Profile — profile controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/profile:
  get:
    tags:
    - User Profile
    summary: Profil ma'lumotlari
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_get
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/profile.yaml#/Profile
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
  put:
    tags:
    - User Profile
    summary: Profilni tahrirlash
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_update
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/profile.yaml#/UpdateProfileRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/profile.yaml#/Profile
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
/api/profile/2fa/disable:
  post:
    tags:
    - User Profile
    summary: O'chirish
    description: |-
      Switches it off; takes the current password and a code.

      **Huquq:** tizimga kirgan har qanday foydalanuvchi.
    operationId: profile_disableTwoFactor
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/profile.yaml#/DisableTwoFactorRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
/api/profile/2fa/enable:
  post:
    tags:
    - User Profile
    summary: Yoqish
    description: |-
      Switches two-factor login on with the first code from the new secret.

      **Huquq:** tizimga kirgan har qanday foydalanuvchi.
    operationId: profile_enableTwoFactor
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/profile.yaml#/TwoFactorCodeRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
/api/profile/2fa/setup:
  post:
    tags:
    - User Profile
    summary: Ikki bosqichli kirishni sozlash {#2fa}
    description: |-
      Starts two-factor setup: a new secret and its `otpauth://` link for the QR code. Nothing changes at login until `/2fa/enable` proves a code from it.

      **Huquq:** tizimga kirgan har qanday foydalanuvchi.
    operationId: profile_setupTwoFactor
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/auth.yaml#/TwoFactorSetupResponse
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
/api/profile/avatar:
  post:
    tags:
    - User Profile
    summary: Avatar yuklash
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_uploadAvatar
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
            required:
            - file
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/profile.yaml#/Profile
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
/api/profile/call-columns:
  put:
    tags:
    - User Profile
    summary: Qo'ng'iroqlar jadvali ustunlari
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_updateCallColumns
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/profile.yaml#/UpdateCallColumnsRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
/api/profile/notifications:
  get:
    tags:
    - User Profile
    summary: '"Bildirishnomalar" tab'
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_notifications
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../schemas/profile.yaml#/PersonalNotificationMatrixEntry
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
  put:
    tags:
    - User Profile
    summary: Matritsani saqlash
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_updateNotifications
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/profile.yaml#/UpdatePersonalNotificationSettingsRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../schemas/profile.yaml#/PersonalNotificationMatrixEntry
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
/api/profile/password:
  put:
    tags:
    - User Profile
    summary: '"Xavfsizlik" tab, parol almashtirish'
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_changePassword
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/profile.yaml#/ChangePasswordRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
/api/profile/schedule:
  get:
    tags:
    - User Profile
    summary: '"Ish jadvali" tab'
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_schedule
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../schemas/profile.yaml#/ScheduleSlot
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
  put:
    tags:
    - User Profile
    summary: Jadvalni saqlash
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_updateSchedule
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/profile.yaml#/UpdateScheduleRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    type: array
