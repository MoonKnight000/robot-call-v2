        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
/api/profile/sessions:
  get:
    tags:
    - User Profile
    summary: Faol sessiyalar
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_sessions
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../schemas/auth.yaml#/UserSessionRow
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
/api/profile/sessions/{id}:
  delete:
    tags:
    - User Profile
    summary: Sessiyani tugatish
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_revokeSession
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '404':
        $ref: ../common.yaml#/responses/NotFound
/api/profile/table-config/{key}:
  get:
    tags:
    - User Profile
    summary: Jadval sozlamasi
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_tableConfig
    parameters:
    - name: key
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '404':
        $ref: ../common.yaml#/responses/NotFound
  put:
    tags:
    - User Profile
    summary: Jadval sozlamasini saqlash
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_updateTableConfig
    parameters:
    - name: key
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '404':
        $ref: ../common.yaml#/responses/NotFound
/api/profile/today-stats:
  get:
    tags:
    - User Profile
    summary: Popover mini-statistika
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: profile_todayStats
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/profile.yaml#/TodayStats
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
