# Voice Settings — voice-settings controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/settings/voice:
  get:
    tags:
    - Voice Settings
    summary: Ovoz sozlamalarini olish
    description: '**Huquq:** `VOICE_READ`'
    operationId: voiceSettings_get
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/voice.yaml#/VoiceSettings
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
  put:
    tags:
    - Voice Settings
    summary: Ovoz sozlamalarini yangilash
    description: '**Huquq:** `VOICE_EDIT`'
    operationId: voiceSettings_update
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/voice.yaml#/UpdateVoiceSettingsRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/voice.yaml#/VoiceSettings
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
