# AI Agents — ai-agent controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/ai-agents:
  post:
    tags:
    - AI Agents
    summary: Agent yaratish
    description: '**Huquq:** `AI_AGENT_EDIT`'
    operationId: aiAgent_create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/aiagent.yaml#/CreateAiAgentRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/aiagent.yaml#/AiAgentRow
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
