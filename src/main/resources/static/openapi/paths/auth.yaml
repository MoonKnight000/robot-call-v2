# Auth — auth controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/auth/activate:
  post:
    tags:
    - Auth
    summary: Taklifni faollashtirish
    description: '**Ochiq endpoint** — token talab qilinmaydi.'
    operationId: auth_activate
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/ActivateRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/auth.yaml#/LoginResponse
      '400':
        $ref: ../common.yaml#/responses/BadRequest
    security: []
/api/auth/forgot-password:
  post:
    tags:
    - Auth
    summary: Parolni tiklashni so'rash
    description: '**Ochiq endpoint** — token talab qilinmaydi.'
    operationId: auth_forgotPassword
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/ForgotPasswordRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
      '400':
        $ref: ../common.yaml#/responses/BadRequest
    security: []
/api/auth/login:
  post:
    tags:
    - Auth
    summary: Kirish
    description: '**Ochiq endpoint** — token talab qilinmaydi.'
    operationId: auth_login
