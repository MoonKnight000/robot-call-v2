    tags:
    - Auth
    summary: Tokenni yangilash
    description: '**Ochiq endpoint** — token talab qilinmaydi.'
    operationId: auth_refresh
    parameters:
    - name: refresh_token
      in: cookie
      required: false
      schema:
        type: string
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/RefreshTokenRequest
    responses:
