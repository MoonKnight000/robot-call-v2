# Call Flows — call-flow controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/call-flows:
  post:
    tags:
    - Call Flows
    summary: Yangi flow (draft)
    description: '**Huquq:** `CALL_FLOW_EDIT`'
    operationId: callFlow_create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/callflow.yaml#/SaveCallFlowRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/callflow.yaml#/CallFlow
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
