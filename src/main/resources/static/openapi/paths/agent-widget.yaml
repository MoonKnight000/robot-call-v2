# Website Widgets — agent-widget controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/ai-agents/{agentId}/widgets:
  post:
    tags:
    - Website Widgets
    summary: Agent uchun vidjet yaratish
    description: '**Huquq:** `AI_AGENT_EDIT`'
    operationId: agentWidget_create
    parameters:
    - name: agentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/widget.yaml#/CreateWidgetRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/widget.yaml#/WidgetRow
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
  get:
    tags:
    - Website Widgets
    summary: Agentning vidjetlari
    description: '**Huquq:** `AI_AGENT_READ`'
    operationId: agentWidget_listByAgent
    parameters:
    - name: agentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../schemas/widget.yaml#/WidgetRow
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
/api/public/widgets/{widgetKey}/config:
  get:
    tags:
    - Website Widgets
    summary: Vidjet sozlamalari (embed skript uchun)
    description: |-
      Called by the embed script on the customer's page; no token, keyed by widget key.

      **Ochiq endpoint** — token talab qilinmaydi.
    operationId: agentWidget_getPublicConfig
    parameters:
    - name: widgetKey
      in: path
      required: true
      schema:
        type: string
    - name: Origin
      in: header
      required: false
      schema:
        type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/widget.yaml#/PublicWidgetConfigResponse
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '404':
        $ref: ../common.yaml#/responses/NotFound
    security: []
/api/public/widgets/{widgetKey}/session:
  post:
    tags:
    - Website Widgets
    summary: Vidjet orqali qo'ng'iroq sessiyasini ochish
    description: |-
      Books the call a visitor just asked for and returns what their browser dials in with. Same origin rules as the configuration endpoint, plus the agent's own daily and concurrent call limits — this is the one endpoint a stranger can spend the company's minutes on.

      **Ochiq endpoint** — token talab qilinmaydi.
    operationId: agentWidget_startPublicSession
    parameters:
    - name: widgetKey
      in: path
      required: true
      schema:
        type: string
    - name: language
      in: query
      required: false
      schema:
        type: string
    - name: Origin
      in: header
      required: false
      schema:
        type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/widget.yaml#/PublicWidgetSessionResponse
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '404':
        $ref: ../common.yaml#/responses/NotFound
    security: []
/api/widgets/{widgetId}:
  get:
    tags:
    - Website Widgets
    summary: Bitta vidjet
    description: '**Huquq:** `AI_AGENT_READ`'
    operationId: agentWidget_get
    parameters:
    - name: widgetId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/widget.yaml#/WidgetRow
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
  put:
    tags:
    - Website Widgets
    summary: Vidjetni tahrirlash
    description: '**Huquq:** `AI_AGENT_EDIT`'
    operationId: agentWidget_update
    parameters:
    - name: widgetId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/widget.yaml#/UpdateWidgetRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/widget.yaml#/WidgetRow
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
  delete:
    tags:
    - Website Widgets
    summary: Vidjetni o'chirish
    description: '**Huquq:** `AI_AGENT_EDIT`'
    operationId: agentWidget_delete
    parameters:
    - name: widgetId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
