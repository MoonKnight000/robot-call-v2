# Calls — call controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/calls:
  post:
    tags:
    - Calls
    summary: Qo'lda qo'ng'iroq qilish / Ssenariyni sinash
    description: '**Huquq:** `CALL_EDIT`'
    operationId: call_call
    parameters:
    - name: number
      in: query
      required: true
      schema:
        type: string
    - name: scenarioId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    - name: agentId
      in: query
      required: false
      description: AI agent (nashr qilingan versiyasi, o'z ssenariysi va ovozi bilan). scenarioId bilan birga berilmaydi — 400 CALL_SOURCE_INVALID
      schema:
        type: integer
        format: int64
    - name: sipTrunkId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/callrecord.yaml#/CallOriginateResponse
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
