# Global Search — search controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/search:
  get:
    tags:
    - Global Search
    summary: Global qidiruv
    description: '**Huquq:** `CALL_READ` yoki `CAMPAIGN_READ`'
    operationId: search_search
    parameters:
    - name: q
      in: query
      required: true
      schema:
        type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/search.yaml#/SearchResult
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
