/api/companies/{id}/logo:
  post:
    tags:
    - Companies
    summary: Logotip yuklash
    description: '**Huquq:** `COMPANY_EDIT`'
    operationId: company_uploadLogo
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
            required:
            - file
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
