# Companies — company controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/companies:
  get:
    tags:
    - Auth
    summary: Kompaniya tanlagich
    description: '**Huquq:** tizimga kirgan har qanday foydalanuvchi.'
    operationId: auth_companies
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../schemas/company.yaml#/Company
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
  post:
    tags:
    - Companies
    summary: Yangi kompaniya
    description: '**Huquq:** `PLATFORM_ADMIN`'
    operationId: company_create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/company.yaml#/CreateCompanyRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/company.yaml#/Company
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
/api/companies/list:
  post:
    tags:
    - Companies
    summary: Ro'yxat
    description: '**Huquq:** `PLATFORM_ADMIN`'
    operationId: company_list
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/company.yaml#/CompanyFilter
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/company.yaml#/CompanyPage
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
/api/companies/{id}:
  get:
    tags:
    - Companies
    summary: Bitta kompaniya
    description: '**Huquq:** `COMPANY_READ`'
    operationId: company_get
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/company.yaml#/Company
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
  put:
    tags:
    - Companies
    summary: Yangilash
    description: '**Huquq:** `COMPANY_EDIT`'
    operationId: company_update
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/company.yaml#/UpdateCompanyRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/company.yaml#/Company
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
