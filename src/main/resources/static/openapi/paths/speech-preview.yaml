# Speech & Voice Preview — speech-preview controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/stt/preview:
  post:
    tags:
    - Speech & Voice Preview
    summary: STT provayderni sinash
    description: |-
      The uploaded recording (WebM/Opus, MP4, WAV — anything ffmpeg reads) transcribed by one STT provider. Runs at the recording's own pace, so a 10-second file takes about 10 seconds to answer.

      **Huquq:** `VOICE_READ`
    operationId: speechPreview_previewStt
    parameters:
    - name: provider
      in: query
      required: false
      schema:
        type: string
    - name: language
      in: query
      required: false
      schema:
        type: string
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
            required:
            - file
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/voice.yaml#/SttPreviewResponse
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
/api/tts/voices/{id}/preview:
  post:
    tags:
    - Speech & Voice Preview
    summary: Ovozni eshitib ko'rish
    description: |-
      The line spoken by catalog voice `id`, as an `audio/wav` body the browser can hand straight to an `<audio>` element.

      **Huquq:** `VOICE_READ`
    operationId: speechPreview_previewVoice
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/voice.yaml#/PreviewVoiceRequest
    responses:
      '200':
        description: Fayl
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
