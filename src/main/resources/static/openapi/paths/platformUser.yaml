# Platform users — PLATFORM_ADMIN manages any company's users (PlatformUserController).
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/companies/{companyId}/users:
  get:
    tags:
    - Users
    summary: Kompaniya foydalanuvchilari
    description: '**Huquq:** `PLATFORM_ADMIN`'
    operationId: platformUser_list
    parameters:
    - name: companyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../schemas/user.yaml#/UserRow
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
      '404':
        $ref: ../common.yaml#/responses/NotFound
