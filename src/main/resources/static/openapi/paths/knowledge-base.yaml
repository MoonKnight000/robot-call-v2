# Knowledge Base — knowledge-base controller endpointlari.
# Har bir kalit — to'liq yo'l; openapi.yaml shu kalitlarga $ref qiladi.
/api/knowledge-base:
  post:
    tags:
    - Knowledge Base
    summary: Yangi yozuv
    description: '**Huquq:** `KNOWLEDGE_BASE_EDIT`'
    operationId: knowledgeBase_create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/knowledgebase.yaml#/KnowledgeItemCreateRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../common.yaml#/schemas/ResponseData
              - type: object
                properties:
                  data:
                    $ref: ../schemas/knowledgebase.yaml#/KnowledgeItemResponse
      '400':
        $ref: ../common.yaml#/responses/BadRequest
      '401':
        $ref: ../common.yaml#/responses/Unauthorized
      '403':
        $ref: ../common.yaml#/responses/Forbidden
