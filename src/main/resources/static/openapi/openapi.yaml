- name: Reports
  description: Aloqa markazi analitikasi, KPI ko'rsatkichlari va hisobot eksporti
- name: Reports & Analytics
  description: Contact center, campaign performance, queue metrics, and call detail analytics
- name: Roles
  description: Rollar (RBAC) va ruxsatnomalar katalogi
- name: Scenarios
  description: Vizual dialog ssenariylari, graf tugunlari va ssenariy testi
- name: Secret Vault
  description: Encrypted storage for external API tokens, credentials, and secrets
