# Swagger UI kirish nuqtasi (springdoc.swagger-ui.url). Endpointlar paths/*.yaml da — har controller
# alohida faylda; ma'lumot turlari schemas/*.yaml da — har feature alohida; umumiylari common.yaml da.
openapi: 3.0.3
info:
  title: Uysot Voice Platform (robot-call-v2) API
  version: 2.0.0
  description: |-
    AI voice agent platformasi: chiquvchi/kiruvchi qo'ng'iroqlar, IVR, real vaqt telefoniya va matnli AI kanallar.

    **Javob konverti.** Har bir JSON javob `ResponseData` ichida: `{data, message, messageCode, accept, errors}`. Ro'yxatlar `data` ichida `PageableData`: `{totalPages, currentPage, totalElements, data}`.

    **Xatolar.** `messageCode` — `ErrorCode` nomi; frontend tarjimani shu bo'yicha qiladi. Batafsil hujjat: `docs/api/`.

    **Autentifikatsiya.** `Authorization: Bearer <JWT>` (`/api/auth/login`) yoki `X-Api-Key`.
servers:
- url: /
  description: Joriy server
- url: https://voice.app.uysot.uz
  description: Production
security:
- BearerAuth: []
- ApiKeyAuth: []
