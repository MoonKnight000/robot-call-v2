  description: Speech synthesis (TTS) and recognition (STT) testing and audio preview
- name: Telegram Bots
  description: Management and public webhook receivers for AI agent Telegram bots
- name: Tools
  description: AI agent custom function calling tools, REST integrations, and OpenAPI 3 import
- name: User Profile
  description: Current user self-service profile, 2FA, avatar, sessions, and UI preferences
