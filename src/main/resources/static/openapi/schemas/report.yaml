  - totalCalls
  - totalMinutes
DirectionMix:
  type: object
  properties:
    outbound:
      $ref: '#/DirectionStats'
    inbound:
      $ref: '#/DirectionStats'
DirectionStats:
  type: object
  properties:
    count:
      type: integer
      format: int64
    pct:
      type: integer
      format: int32
    minutes:
      type: integer
      format: int64
    avgDurationSec:
      type: integer
      format: int32
    successRatePct:
      type: number
      format: double
  required:
  - count
  - pct
  - minutes
  - avgDurationSec
  - successRatePct
DurationHistogramBucket:
  type: object
  description: One duration range of the "Suhbat davomiyligi taqsimoti" histogram (§10.10 Grafik 5), over calls that connected (`duration_sec` not null). `rangeEndSec` is `null` for the open-ended last bucket (`600+`).
  properties:
    rangeLabel:
      type: string
    rangeStartSec:
      type: integer
      format: int32
    rangeEndSec:
      type: integer
      format: int32
    count:
      type: integer
      format: int64
  required:
  - rangeStartSec
  - count
FunnelStage:
  type: object
  description: One stage of the "Qo'ng'iroq → Javob → Shaxs tasdiqlandi → Suhbat → Natija" funnel (§10.10 Grafik 6).
  properties:
    stage:
      type: string
      description: 'constant id, in funnel order: `CALL`, `ANSWERED`, `PERSON_CONFIRMED`, `CONVERSATION`, `RESULT`'
    count:
      type: integer
      format: int64
      description: calls that reached this stage
    rate:
      type: number
      format: double
      description: '`count` / the funnel''s total calls (0..1) — conversion from the very top, not from the previous stage, so the chart reads as "what share of everything dialled got this far"'
  required:
  - count
  - rate
HourlyHeatmapCell:
  type: object
  description: |-
    One day×hour cell of the "Kun × soat javob foizi" heatmap (§10.10 Grafik 3).

    Both the day and the hour are on the company's clock (`company_config.timezone`), like the day buckets elsewhere in this package.
  properties:
    dayOfWeek:
      type: integer
      format: int32
      description: 'Postgres `extract(dow)`: `0` = Sunday .. `6` = Saturday'
    hour:
      type: integer
      format: int32
      description: 0..23
    total:
      type: integer
      format: int64
    answered:
      type: integer
      format: int64
    answerRate:
      type: number
      format: double
  required:
  - dayOfWeek
  - hour
  - total
  - answered
  - answerRate
InboundRouteStats:
  type: object
  description: '"Shu raqamga tushgan qo''ng''iroqlar statistikasi" (§10.9 drawer) — everything a call matched to one `inbound_route` has actually done, mirroring {@link CampaignStats}'' shape for the same question asked of an inbound number instead of a campaign.'
  properties:
    inboundRouteId:
      type: integer
      format: int64
      description: the route
    didNumber:
      type: string
      description: its dialled number, so a report is readable on its own
    totalCalls:
      type: integer
      format: int64
      description: every call this route has ever matched
    answeredCalls:
      type: integer
      format: int64
      description: attempts that reached a conversation (measured duration)
    answerRate:
      type: number
      format: double
      description: answeredCalls / totalCalls (0..1), 0 with no calls yet
    avgDurationSec:
      type: number
      format: double
      description: mean length of an answered call, or null with nothing to average
    lastCallAt:
      type: string
      format: date-time
      description: when this route was last dialled into, or null if never
    dispositions:
      type: object
      additionalProperties:
        type: integer
        format: int64
      description: finished attempts by disposition
    statsAvailableFrom:
      type: string
      format: date-time
      description: the earliest `call_attempt.started_at` in this company with a non-null `inbound_route_id` — i.e. when inbound-route attribution started being recorded at all (backend-uchun-talablar.md §8). `null` means no inbound call has ever been attributed to a route yet. Calls before this timestamp are invisible to every `inbound_route`'s stats, not just this one — the frontend should treat totals as "since `statsAvailableFrom`", not "all-time", when this is non-null and recent
  required:
  - inboundRouteId
  - totalCalls
  - answeredCalls
  - answerRate
OperatorReportRow:
