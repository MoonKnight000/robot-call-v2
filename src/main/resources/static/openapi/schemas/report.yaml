TranscriptLine:
  type: object
  description: One utterance of a call transcript.
  properties:
    seq:
      type: integer
      format: int32
      description: order within the call
    role:
      type: string
      description: AGENT or CLIENT
    text:
      type: string
      description: what was said
    dialogState:
      type: string
      description: FSM state the agent was in (null for client lines)
    tsOffsetMs:
      type: integer
      format: int32
      description: milliseconds from the start of the call
    confidence:
      type: number
      format: float
      description: recognizer confidence for client lines; a low value next to a strange transcript is usually the explanation for a strange turn
  required:
