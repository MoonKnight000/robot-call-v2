ReportPeriodicity:
  type: string
  enum:
  - DAILY
  - WEEKLY
  - MONTHLY
  description: How often a `report_schedule` row sends its email (§10.10 "Jadval bo'yicha yuborish"). `#span()` doubles as both "how long to wait before the next send" and "what window the attached report covers" — a weekly email reports on the week that just ended.
ReportSchedule:
  type: object
  description: A row of `GET/POST /api/reports/schedule...` (§10.10 "Jadval bo'yicha yuborish").
  properties:
    id:
      type: integer
      format: int64
    companyId:
      type: integer
      format: int64
    email:
      type: string
      description: where the report is sent
    periodicity:
      allOf:
      - $ref: '#/ReportPeriodicity'
      description: how often (`ReportPeriodicity#span()` is both the interval and the window the attached report covers)
    format:
      type: string
      description: '`csv`, `pdf`, or `xlsx` ({@link uz.murodjon.robotcallv2.report.application.service.ReportExportService})'
    campaignId:
      type: integer
      format: int64
      description: narrows the report to one campaign, or null for every campaign
    enabled:
      type: boolean
      description: paused schedules are skipped by the dispatch sweep, never deleted
    lastSentAt:
      type: string
      format: date-time
      description: when the last email actually went out, or null if never
    createdAt:
      type: string
      format: date-time
  required:
