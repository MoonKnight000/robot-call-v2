    abandoned:
      type: integer
      format: int64
    shortAbandoned:
      type: integer
      format: int64
    answeredWithinSla:
      type: integer
      format: int64
    serviceLevelPercent:
      type: number
      format: double
    abandonRatePercent:
      type: number
      format: double
    averageWaitSeconds:
      type: number
      format: double
    maxWaitSeconds:
      type: integer
      format: int32
    averageTalkSeconds:
      type: number
      format: double
    overflowed:
      type: integer
      format: int64
    callbacksRequested:
      type: integer
      format: int64
    averageSurveyScore:
      type: number
      format: double
  required:
