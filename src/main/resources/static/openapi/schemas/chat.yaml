# `chat` feature'ining ma'lumot turlari (request/response DTO, domain, enum).
ChatChannel:
  type: string
  enum:
  - WIDGET
  - TELEGRAM
  description: Which text channel a conversation arrived on — whichever of `widgetId` / `telegramBotId` is set.
ChatDetail:
  type: object
  description: 'One conversation opened in the panel: its row, what the scenario''s tools recorded, and the whole transcript in the order it was written.'
  properties:
    chat:
      $ref: '#/ChatRow'
    outcome:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
    messages:
      type: array
      items:
        $ref: '#/ChatMessage'
ChatFilter:
  type: object
  description: Pagination + filter for POST /api/chats/list.
  properties:
    page:
      type: integer
      format: int32
      minimum: 0
    size:
      type: integer
      format: int32
      minimum: 1
      maximum: 500
    orders:
      type: object
      properties:
        ID:
          $ref: ../common.yaml#/schemas/SortDirection
        CREATED_AT:
          $ref: ../common.yaml#/schemas/SortDirection
        LAST_MESSAGE_AT:
          $ref: ../common.yaml#/schemas/SortDirection
        MESSAGE_COUNT:
          $ref: ../common.yaml#/schemas/SortDirection
      additionalProperties: false
      description: Kalitlar tartibi muhim — ro'yxatdagi tartib bo'yicha qo'llanadi
    aiAgentId:
      type: integer
      format: int64
      description: only this agent's conversations; null for all
    channel:
      allOf:
      - $ref: '#/ChatChannel'
      description: only this channel; null for both
    ended:
      type: boolean
      description: true — only finished ones, false — only those not marked finished; null for all
    from:
      type: string
      format: date-time
      description: inclusive, by when the conversation was opened
    to:
      type: string
      format: date-time
      description: exclusive
ChatMessage:
  type: object
  description: |-
    One line of a chat, stored in the order it was written.

    The transcript is not only what a person reads back: it is what the conversation is rebuilt from before the next message is answered, so a line that is not here did not happen as far as the agent is concerned.
  properties:
    id:
      type: integer
      format: int64
    chatSessionId:
      type: integer
      format: int64
    role:
      $ref: '#/ChatRole'
    text:
      type: string
    createdAt:
      type: string
      format: date-time
  required:
  - chatSessionId
ChatReplyResponse:
  type: object
  description: The agent's answer to one message.
  properties:
    reply:
      type: string
    ended:
      type: boolean
      description: the agent ended the conversation — the widget closes the input rather than letting a visitor type into a conversation nobody will answer
    messagesLeft:
      type: integer
      format: int32
      description: how many messages this conversation may still hold
  required:
  - ended
  - messagesLeft
ChatRole:
  type: string
  enum:
  - CLIENT
  - AGENT
  description: Who wrote a chat message. The two sides a transcript has, named the way a call names them.
ChatRow:
  type: object
  description: 'A conversation as the panel lists it. The `sessionKey` is not here: it is the visitor''s handle for writing into the conversation, and the panel only reads.'
  properties:
    id:
      type: integer
      format: int64
    agentId:
      type: integer
      format: int64
    agentName:
      type: string
    channel:
      $ref: '#/ChatChannel'
    widgetId:
      type: integer
      format: int64
    telegramBotId:
      type: integer
      format: int64
    language:
      type: string
    stage:
      type: string
      description: the scenario stage the conversation stands in
    disposition:
      allOf:
      - $ref: ../common.yaml#/schemas/Disposition
      description: how it ended; null while it has not
    ended:
      type: boolean
      description: set when the agent closed it or it ran out of messages — a conversation that simply went quiet stays false
    messageCount:
      type: integer
      format: int32
    createdAt:
      type: string
      format: date-time
    lastMessageAt:
      type: string
      format: date-time
  required:
  - id
  - agentId
  - ended
  - messageCount
ChatRowPage:
  type: object
  description: '`ChatRow` sahifasi'
  properties:
    totalPages:
      type: integer
      format: int32
    currentPage:
      type: integer
      format: int32
    totalElements:
      type: integer
      format: int64
    data:
      type: array
      items:
        $ref: '#/ChatRow'
  required:
  - totalPages
  - currentPage
  - totalElements
RegisterWebhookRequest:
  type: object
  properties:
    publicBaseUrl:
      type: string
      description: where this deployment answers, as the internet sees it (`https://voice.example.uz`). The update address is built from it; Telegram will not send updates to a plain http address
      minLength: 1
      maxLength: 500
  required:
  - publicBaseUrl
SaveTelegramBotRequest:
  type: object
  description: A bot this company owns, pointed at one of its agents.
  properties:
    agentId:
      type: integer
      format: int64
    name:
      type: string
      minLength: 1
      maxLength: 120
    tokenSecretKey:
      type: string
      description: 'the company secret holding the bot token ([secrets.md]). The token itself is never sent here: it is created once as a secret and named from then on, the same way a tool names one'
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9_]+$
    language:
      type: string
      maxLength: 10
  required:
  - agentId
  - name
  - tokenSecretKey
SendChatMessageRequest:
  type: object
  description: What a visitor typed.
  properties:
    text:
      type: string
      description: the message; capped because an open endpoint is where a novel gets pasted, and every character of it is paid for in model tokens
      minLength: 1
      maxLength: 2000
  required:
  - text
StartChatResponse:
  type: object
  description: 'A chat that has just been opened: the handle the browser sends back with every message, and the agent''s opening line.'
  properties:
    sessionKey:
      type: string
    greeting:
      type: string
    language:
      type: string
    maxMessages:
      type: integer
      format: int32
      description: how many messages this conversation may hold in all, so the widget can show it rather than discover it at the limit
  required:
  - maxMessages
TelegramBotRow:
  type: object
  description: 'A bot as the panel lists it. Neither the token nor the webhook secret is here: one is the bot''s identity and the other is what proves an update is Telegram''s.'
  properties:
    id:
      type: integer
      format: int64
    agentId:
      type: integer
      format: int64
    agentName:
      type: string
    name:
      type: string
    tokenSecretKey:
      type: string
    language:
      type: string
    enabled:
      type: boolean
    webhookUrl:
      type: string
      description: the address Telegram was told to send updates to, once it has been registered from this panel; null when it has not
    createdAt:
      type: string
      format: date-time
  required:
  - id
  - agentId
  - enabled
