# `scenario` feature'ining ma'lumot turlari (request/response DTO, domain, enum).
CloneScenarioRequest:
  type: object
  properties:
    scenarioKey:
      type: string
    name:
      type: string
      minLength: 1
  required:
  - name
CreateScenarioRequest:
  type: object
  properties:
    scenarioKey:
      type: string
    name:
      type: string
      minLength: 1
    description:
      type: string
    definition:
      $ref: '#/ScenarioDefinition'
  required:
  - name
  - definition
FactField:
  type: object
  properties:
    name:
      type: string
    type:
      type: string
    required:
      type: boolean
    description:
      type: string
  required:
  - required
FactWebhook:
  type: object
  description: |-
    Where a scenario fetches this call's facts from, moments before the number is dialled.

    A campaign's facts arrive once, in the CSV that created its targets, and then age. A list uploaded on Monday still says 1 500 000 so'm on Friday, and the bot says it — to somebody who paid on Wednesday. The CRM overlay (`CallContextFactory#mergeCrmFacts`) covers the fields the CRM happens to model; this covers the rest, and covers companies whose system of record is not a CRM this project has an adapter for.

    The endpoint is called with the call's identifying data and answers with a flat JSON object. Only keys the scenario's `factSchema` declares are read from the answer, so an endpoint cannot introduce facts the scenario never planned to speak — and every text value still passes through `PromptSafeText` on its way into `CallContext`, like any other untrusted fact.
  properties:
    url:
      type: string
      description: '`http`/`https` endpoint. Screened against private and loopback addresses at call time — this URL is written by a tenant, and an unscreened one is a request this server makes on their behalf into its own network'
    method:
      type: string
      description: '`POST` (default) or `GET`. POST carries the call data in a JSON body; GET appends `?phone=&clientId=&campaignId=`'
    headers:
      type: object
      additionalProperties:
        type: string
      description: 'sent as written — typically an `Authorization` for the customer''s own API. Stored inside the scenario definition, so anyone in the company with scenario read access can see them: use a token scoped to this one endpoint, not a general-purpose key'
    timeoutMs:
      type: integer
      format: int32
      description: how long the dialer waits. 0 or less means the default; the ceiling is deliberately low, because this runs between claiming a target and originating its call and a slow endpoint would throttle the whole campaign rather than just its own call
  required:
  - timeoutMs
OutcomeField:
  type: object
  description: One named result a call records.
  properties:
    name:
      type: string
    type:
      type: string
    description:
      type: string
    goal:
      type: boolean
      description: 'whether this field is what the scenario exists to record: a call that recorded it ends `GOAL_REACHED`, one that did not `GOAL_NOT_REACHED` (UNIVERSAL-OPERATOR-PLAN A.1). At most one per scenario (`ScenarioValidator`); a scenario with none keeps the dispositions its own tools set'
  required:
  - goal
PersonaTestResult:
  type: object
  properties:
    personaName:
      type: string
    personaPrompt:
      type: string
    passed:
      type: boolean
    disposition:
      type: string
    transcript:
      type: array
      items:
        type: object
        additionalProperties:
          type: string
    extractedFacts:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
    errorMessage:
      type: string
  required:
  - passed
ScenarioDefinition:
  type: object
  description: |-
    What a call says: the stages, the facts it may use, the tools it may call and the rules it must keep to.

    Who says it is not here — that is the `AiAgent` pointing at this scenario (V12). The two were briefly merged, when the Agent Builder table was folded into this record as an `agentProfile`, and the merge was wrong in both directions: a scenario is shared and versioned, while the voice a company reads it in is neither, so one company changing a voice would have meant a new version of everybody's script.
  properties:
    stages:
      type: array
      items:
        $ref: '#/StageDef'
    factSchema:
      type: array
      items:
        $ref: '#/FactField'
    tools:
      type: array
      items:
        $ref: '#/ToolDef'
    outcomeSchema:
      type: array
      items:
        $ref: '#/OutcomeField'
    rolePrompt:
      type: string
    guardrails:
      type: array
      items:
        type: string
    disclosureText:
      type: string
    factWebhook:
      $ref: '#/FactWebhook'
    styleExamples:
      type: array
      items:
        $ref: '#/StyleExample'
ScenarioFilter:
  type: object
  description: Pagination + filter + sort for POST /api/scenarios/list (§10.7).
  properties:
    page:
      type: integer
      format: int32
      minimum: 0
    size:
      type: integer
      format: int32
      minimum: 1
      maximum: 500
    orders:
      type: object
      properties:
        ID:
          $ref: ../common.yaml#/schemas/SortDirection
        SCENARIO_KEY:
          $ref: ../common.yaml#/schemas/SortDirection
        NAME:
          $ref: ../common.yaml#/schemas/SortDirection
        VERSION:
          $ref: ../common.yaml#/schemas/SortDirection
        CREATED_AT:
          $ref: ../common.yaml#/schemas/SortDirection
      additionalProperties: false
      description: Kalitlar tartibi muhim — ro'yxatdagi tartib bo'yicha qo'llanadi
    builtinOnly:
      type: boolean
ScenarioRow:
  type: object
  description: One row of GET/POST /api/scenarios (§10.7 "Ssenariylar").
  properties:
    id:
      type: integer
      format: int64
    scenarioKey:
      type: string
    version:
      type: integer
      format: int32
    name:
      type: string
    description:
      type: string
    builtin:
      type: boolean
    active:
      type: boolean
    definition:
      $ref: '#/ScenarioDefinition'
    createdAt:
      type: string
      format: date-time
    createdByName:
      type: string
  required:
  - id
  - version
  - builtin
  - active
ScenarioRowPage:
  type: object
  description: '`ScenarioRow` sahifasi'
  properties:
    totalPages:
      type: integer
      format: int32
    currentPage:
      type: integer
      format: int32
    totalElements:
      type: integer
      format: int64
    data:
      type: array
      items:
        $ref: '#/ScenarioRow'
  required:
  - totalPages
  - currentPage
  - totalElements
ScenarioSimulationRequest:
  type: object
  properties:
    scenarioId:
      type: integer
      format: int64
    scenarioDefinition:
      $ref: '#/ScenarioDefinition'
    userMessage:
      type: string
    currentState:
      type: string
    chatHistory:
      type: array
      items:
        type: object
        additionalProperties:
          type: string
    contextFacts:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
ScenarioSimulationResponse:
  type: object
  properties:
    assistantReply:
      type: string
    nextState:
      type: string
    calledTool:
      type: string
    toolArguments:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
    extractedFacts:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
    disposition:
      type: string
    ended:
      type: boolean
    latencyMs:
      type: integer
      format: int64
  required:
  - ended
  - latencyMs
ScenarioValidationResult:
  type: object
  properties:
    valid:
      type: boolean
    errors:
      type: array
      items:
        type: string
  required:
  - valid
StageDef:
  type: object
  properties:
    id:
      type: string
    purpose:
      type: string
    allowedTransitions:
      type: array
      items:
        type: string
    allowedTools:
      type: array
      items:
        type: string
    emotion:
      type: string
StyleExample:
  type: object
  description: One ✗ → ✓ pair of phrasing a scenario teaches its agent by — the domain's own examples, so the platform prompt stops carrying one domain's sentences into every scenario's calls (UNIVERSAL-OPERATOR-PLAN A.2).
  properties:
    language:
      type: string
      description: the call language the pair is written in, by prefix (`"uz"`, `"ru"`); null for every language
    wrong:
      type: string
      description: what the agent should not say — best a line a real call produced
    right:
      type: string
      description: what it should have said instead
ToolDef:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    params:
      type: array
      items:
        $ref: '#/ToolParamDef'
    preToolSpeech:
      type: string
ToolParamDef:
  type: object
  properties:
    name:
      type: string
    type:
      type: string
    required:
      type: boolean
    constraint:
      type: string
  required:
  - required
UpdateScenarioRequest:
  type: object
  description: '`version` is the `ScenarioRow.version` the editor read. A scenario saved as a newer version since is answered 409 instead of being replaced. Optional, so an older client that does not send it keeps working.'
  properties:
    name:
      type: string
      minLength: 1
    description:
      type: string
    definition:
      $ref: '#/ScenarioDefinition'
    version:
      type: integer
      format: int32
  required:
  - name
  - definition
