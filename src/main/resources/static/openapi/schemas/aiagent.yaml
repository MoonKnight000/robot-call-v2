# `aiagent` feature'ining ma'lumot turlari (request/response DTO, domain, enum).
AgentAdvancedDto:
  type: object
  description: The "advanced" settings section. The groups are the same ones `AiAgentRow` carries; of the voice only the two delivery switches belong here.
  properties:
    useRag:
      type: boolean
    initiationWebhook:
      $ref: '#/AgentWebhookConfig'
    postCallWebhook:
      $ref: '#/AgentWebhookConfig'
    emotionAdaptiveVoice:
      type: boolean
    speakingWarmth:
      type: string
      enum: [RESERVED, BALANCED, WARM]
      description: how much warmth the agent's wording carries; BALANCED by default
    voiceEmotion:
      type: string
      enum: [NEUTRAL, CHEERFUL, FRIENDLY, STRICT, WHISPER, SAD]
      description: the mood the agent speaks in by default; NEUTRAL by default
    ambience:
      $ref: '#/AgentAmbienceDto'
    callBehaviour:
      $ref: '#/AgentCallBehaviourDto'
    dataPolicy:
      $ref: '#/AgentDataPolicyDto'
AgentAmbienceDto:
  type: object
  description: '`AiAgentAmbience` as the agent endpoints read and write it. On a write a null field keeps what the agent has (or the create default).'
  properties:
    background:
      $ref: '#/AmbientSound'
    backgroundVolume:
      type: number
      format: double
    backgroundFadeInSeconds:
      type: number
      format: double
    thinking:
      $ref: '#/AmbientSound'
    thinkingVolume:
      type: number
      format: double
    noiseCancellationEnabled:
      type: boolean
    noiseCancellationMode:
      $ref: '#/NoiseCancellationMode'
AgentCallBehaviourDto:
  type: object
  description: '`AiAgentCallBehaviour` as the agent endpoints read and write it. On a write a null field keeps what the agent has (or the create default).'
  properties:
    interruptionSensitivity:
      $ref: '#/InterruptionSensitivity'
    dtmfInputEnabled:
      type: boolean
    voicemailAction:
      $ref: '#/VoicemailAction'
    voicemailMessage:
      type: string
      maxLength: 500
    midCallSmsEnabled:
      type: boolean
    midCallSmsTemplate:
      type: string
      maxLength: 500
    transferPhoneNumber:
      type: string
    transferMessage:
      type: string
    transferQueueId:
      type: integer
      format: int64
    preConversationAudioFileId:
      type: integer
      format: int64
    responseWaitMs:
      type: integer
      format: int32
      minimum: 100
      maximum: 3000
      description: caller silence (ms) the agent waits after the caller stops speaking before its turn (cascade only); null = deployment default
    reminderAfterSeconds:
      type: integer
      format: int32
      minimum: 1
      maximum: 300
      description: caller silence (s) after which the agent asks whether they are still there; null = deployment default
    reminderMaxCount:
      type: integer
      format: int32
      minimum: 0
      maximum: 10
      description: reminders before the call is ended (0 = end at the first silence); null = deployment default
    dtmfTimeoutMs:
      type: integer
      format: int32
      minimum: 500
      maximum: 10000
      description: pause (ms) between keypad digits that hands the typed sequence over; null = 2000
    dtmfTerminationKey:
      type: string
      pattern: "^[0-9#*]$"
      description: key that hands the typed sequence over at once; null = "#"
    dtmfDigitLimit:
      type: integer
      format: int32
      minimum: 1
      maximum: 50
      description: digits after which the sequence is handed over without waiting; null = no limit
    ringDurationSeconds:
      type: integer
      format: int32
      minimum: 5
    pressDigitEnabled:
      type: boolean
      description: 'Whether the agent may press keypad digits on the line itself (IVR navigation, the sendDtmfTones tool) without its scenario declaring that tool. Not dtmfInputEnabled (the caller typing digits). Omitted keeps the current value; default false.'
      maximum: 300
      description: seconds an outbound call rings before it counts as unanswered (Asterisk); null = deployment default
AgentClearableField:
  type: string
  enum:
  - INITIATION_WEBHOOK
  - POST_CALL_WEBHOOK
  - PRE_CONVERSATION_AUDIO_FILE_ID
  - MID_CALL_SMS_TEMPLATE
  - VOICEMAIL_MESSAGE
  - FAST_LLM_MODEL
  - FALLBACK_LLM_MODEL
  - MAX_OUTPUT_TOKENS
  - GREETING_PAUSE
  - SPEECH_LANGUAGES
  - RESPONSE_WAIT_MS
  - TRANSCRIPTION_MODE
  - BOOSTED_KEYWORDS
  - REMINDER_AFTER_SECONDS
  - REMINDER_MAX_COUNT
  - DTMF_TIMEOUT_MS
  - DTMF_TERMINATION_KEY
  - DTMF_DIGIT_LIMIT
  - RING_DURATION_SECONDS
  - RAG_MIN_SCORE
  description: Optional agent setting `PUT /api/ai-agents/{id}` can remove through `clearFields`.
AgentGreetingDto:
  type: object
  description: "How a call opens. On a write a null field keeps what the agent has; lines replaces the whole list (empty removes all); GREETING_PAUSE in clearFields returns the pause to the platform default."
  properties:
    mode:
      $ref: '#/GreetingMode'
    pauseBeforeSpeakingMs:
      type: integer
      format: int32
      minimum: 0
      maximum: 10000
      nullable: true
      description: quiet time between answering and the agent's first words; null = platform default
    lines:
      type: array
      maxItems: 20
      items:
        $ref: '#/GreetingLineDto'
GreetingLineDto:
  type: object
  required:
  - text
  properties:
    direction:
      $ref: '#/GreetingDirection'
    language:
      type: string
      maxLength: 16
      nullable: true
      description: BCP-47 tag or bare language (ru-RU, ru); null = any language
    text:
      type: string
      maxLength: 500
      description: what is said; {{variables}} are filled from the call facts
GreetingMode:
  type: string
  enum:
  - AI_CUSTOM
  - AI_DYNAMIC
  - USER_FIRST
  description: AI_CUSTOM - the agent speaks first with a configured line; AI_DYNAMIC - the agent speaks first and composes the opening; USER_FIRST - the caller speaks first.
GreetingDirection:
  type: string
  enum:
  - INBOUND
  - OUTBOUND
AgentDataPolicyDto:
  type: object
  description: '`AiAgentDataPolicy` as the agent endpoints read and write it. On a write a null field keeps what the agent has (or the create default).'
  properties:
    zeroPiiRetention:
      type: boolean
    storeCallAudio:
      type: boolean
    conversationRetentionDays:
      type: integer
      format: int32
    realtimeFactsDelivery:
      $ref: '#/RealtimeFactsDelivery'
AgentScriptDto:
  type: object
  description: '`AiAgentScript` as the agent endpoints read and write it. On a write a null field keeps what the agent has (or the create default).'
  properties:
    templateId:
      $ref: '#/AgentTemplate'
    scenarioId:
      type: integer
      format: int64
    mode:
      $ref: '#/ScenarioMode'
    definition:
      $ref: scenario.yaml#/ScenarioDefinition
    firstMessage:
      type: string
    systemPrompt:
      type: string
AgentSpeechEngineDto:
  type: object
  description: '`AiAgentSpeechEngine` as the agent endpoints read and write it. On a write a null field keeps what the agent has (or the create default).'
  properties:
    mode:
      $ref: ../common.yaml#/schemas/PipelineMode
    realtimeProvider:
      type: string
    pipecatStt:
      type: string
    pipecatLlm:
      type: string
    pipecatTts:
      type: string
    sttProvider:
      type: string
    sttModel:
      type: string
    ttsProvider:
      type: string
    ttsModel:
      type: string
    transcriptionMode:
      type: string
      enum: [FAST, ACCURATE]
      description: how the recogniser trades latency for accuracy (cascade only); null = deployment default
    boostedKeywords:
      type: array
      maxItems: 100
      items:
        type: string
        maxLength: 50
      description: words the recogniser should favour (cascade only); an empty list on a write clears them
AgentVoiceDto:
  type: object
  description: '`AiAgentVoice` as the agent endpoints read and write it. On a write a null field keeps what the agent has (or the create default).'
  properties:
    defaultVoice:
      type: string
      description: a tts_voice id; `GET /api/ai-agents/voices` lists them
    speed:
      type: number
      format: double
    perLanguage:
      type: object
      additionalProperties:
        type: string
    perLanguageSpeed:
      type: object
      additionalProperties:
        type: number
        format: double
    emotionAdaptive:
      type: boolean
    warmth:
      type: string
      enum: [RESERVED, BALANCED, WARM]
    emotion:
      type: string
      enum: [NEUTRAL, CHEERFUL, FRIENDLY, STRICT, WHISPER, SAD]
      description: the mood the agent speaks in by default (TTS controls + LLM wording); NEUTRAL by default
AgentAnalysisDto:
  type: object
  properties:
    dataNeeded:
      type: array
      items:
        $ref: '#/DataExtractionField'
    dataEvaluation:
      type: array
      items:
        $ref: '#/DataEvaluationCriterion'
    postCallAnalysis:
      $ref: '#/AgentPostCallAnalysis'
AgentPostCallAnalysis:
  type: object
  description: Which fixed parts of the post-call analysis the agent keeps. The call is still analysed once; a switched-off part is left out of what is stored. Summary off stores an empty summary, sentiment off stores none.
  properties:
    summaryEnabled:
      type: boolean
      default: true
    sentimentEnabled:
      type: boolean
      default: true
AgentEvalResult:
  type: object
  description: How one test case went in one evaluation run (NEXT-PLAN A.2).
  properties:
    id:
      type: integer
      format: int64
    runId:
      type: integer
      format: int64
    testCaseId:
      type: integer
      format: int64
      description: null once the case has been deleted; `caseName` keeps its name
    caseName:
      type: string
    passed:
      type: boolean
    disposition:
      type: string
    stage:
      type: string
    problems:
      type: array
      items:
        type: string
      description: every expectation it missed, empty when it passed
    transcript:
      type: string
      description: the simulated call, one `AGENT:`/`CLIENT:` line each
    qaScore:
      type: integer
      format: int32
      description: the judge's score, or null when it was not scored
    guardrailViolation:
      type: boolean
      description: the judge found a figure, date or promise the facts do not support
  required:
  - runId
  - passed
  - guardrailViolation
AgentEvalRun:
  type: object
  description: One evaluation of an agent against all its test cases (NEXT-PLAN A.2).
  properties:
    id:
      type: integer
      format: int64
    companyId:
      type: integer
      format: int64
    agentId:
      type: integer
      format: int64
    agentVersion:
      type: integer
      format: int32
      description: the published version evaluated, or null for the draft
    status:
      $ref: '#/AgentEvalRunStatus'
    total:
      type: integer
      format: int32
    passed:
      type: integer
      format: int32
    avgQaScore:
      type: integer
      format: int32
      description: the judge's mean score over the cases it scored, or null
    error:
      type: string
      description: why the run broke off, when it did
    startedAt:
      type: string
      format: date-time
    finishedAt:
      type: string
      format: date-time
  required:
  - companyId
  - agentId
  - total
  - passed
AgentEvalRunDetail:
  type: object
  description: One evaluation run with every case's transcript and verdict.
  properties:
    run:
      $ref: '#/AgentEvalRun'
    results:
      type: array
      items:
        $ref: '#/AgentEvalResult'
AgentEvalRunStatus:
  type: string
  enum:
  - RUNNING
  - DONE
  - FAILED
  description: |-
    Where an agent evaluation run stands.

    - `RUNNING`

    - `DONE`

    - `FAILED` — The run itself broke off; the cases played before it are kept.
AgentLimitsDto:
  type: object
  properties:
    concurrentCallsLimit:
      type: integer
      format: int32
    dailyCallsLimit:
      type: integer
      format: int32
    maxConversationDurationSeconds:
      type: integer
      format: int32
    silenceEndCallTimeoutSeconds:
      type: integer
      format: int32
AgentPostCallActionsDto:
  type: object
  description: DTO for Post-Call Actions & Automated Follow-ups tab.
  properties:
    actions:
      type: array
      items:
        $ref: '#/PostCallAction'
AgentPreCallFunctionsDto:
  type: object
  description: Workflow pre-call slot — the functions that run before the agent speaks.
  properties:
    functions:
      type: array
      maxItems: 15
      items:
        $ref: '#/WorkflowFunction'
WorkflowFunction:
  type: object
  required:
  - id
  - toolName
  properties:
    id:
      type: string
      maxLength: 64
      description: Names the function inside its slot; what `dependsOn` refers to.
    toolName:
      type: string
      maxLength: 100
      description: An agent tool or an enabled integration tool; only `READ` tools run.
    inputs:
      type: object
      additionalProperties:
        type: string
      description: Tool argument → text; `{{variable}}` is filled from call variables and earlier outputs.
    outputs:
      type: object
      additionalProperties:
        type: string
      description: Variable → `$` path into the tool's raw answer (responseMapping syntax).
    dependsOn:
      type: array
      items:
        type: string
    enabled:
      type: boolean
AgentPronunciationDto:
  type: object
  description: DTO for Pronunciation / Phonetic Dictionary tab.
  properties:
    rules:
      type: array
      items:
        $ref: '#/PronunciationRule'
AgentScenarioDto:
  type: object
  description: Behavior and embedded Scenario configuration for an AI Agent.
  properties:
    scenarioMode:
      $ref: '#/ScenarioMode'
    firstMessage:
      type: string
    systemPrompt:
      type: string
    stages:
      type: array
      items:
        $ref: scenario.yaml#/StageDef
    guardrails:
      type: array
      items:
        type: string
    factSchema:
      type: array
      items:
        $ref: scenario.yaml#/FactField
    disclosureText:
      type: string
    callPurpose:
      type: string
      description: what the call is about, in a sentence; stated to the model first
AgentTemplate:
  type: string
  enum:
  - APPOINTMENT_BOOKING
  - BUSINESS
  - SUPPORT
  - LEAD_QUALIFICATION
  - DEBT_REMINDER
  - INBOUND_RECEPTIONIST
  - SURVEY
  - MEDICAL
  - ORDER_TRACKING
  - BLANK
  description: Presets a new agent can be seeded from, so the first screen is not empty. Stored with the agent, one name per preset.
AgentTestCase:
  type: object
  description: One scripted caller an agent is evaluated against (NEXT-PLAN A.2).
  properties:
    id:
      type: integer
      format: int64
    companyId:
      type: integer
      format: int64
    agentId:
      type: integer
      format: int64
    name:
      type: string
    personaPrompt:
      type: string
      description: instructions to the model that plays the caller
    facts:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
      description: the call's facts, as the CRM would supply them
    language:
      type: string
      description: the caller's language; null uses the agent's
    expectDisposition:
      type: string
      description: how the call must end, or null to not judge it
    expectStage:
      type: string
      description: the stage it must end in, or null
    mustSay:
      type: array
      items:
        type: string
      description: phrases the agent has to say at some point (case-insensitive)
    mustNotSay:
      type: array
      items:
        type: string
      description: phrases the agent must never say — "chegirma", a figure, a promise
    maxTurns:
      type: integer
      format: int32
      description: turns before the simulated call is cut off
    createdAt:
      type: string
      format: date-time
  required:
  - companyId
  - agentId
  - maxTurns
AgentVersionStatus:
  type: string
  enum:
  - PUBLISHED
  - ARCHIVED
  description: 'Where a published agent snapshot stands: `PUBLISHED` is the one version calls run on, `ARCHIVED` every earlier one — kept so a rollback has something to return to.'
AgentWebhookConfig:
  type: object
  description: Webhook configuration for agent initiation or post-call callback. The URL, headers and timeout one of an agent's webhooks is called with.
  properties:
    webhookUrl:
      type: string
      description: destination URL
    method:
      type: string
      description: HTTP method (POST, GET)
    headers:
      type: object
      additionalProperties:
        type: string
      description: HTTP headers
    dynamicVariables:
      type: object
      additionalProperties:
        type: string
      description: variables to pass (initiation)
    transcript:
      type: boolean
      description: whether to send call transcript (post-call)
    audioUrl:
      type: boolean
      description: whether to send recorded audio URL (post-call)
    timeoutSeconds:
      type: integer
      minimum: 1
      maximum: 30
      description: How long the initiation webhook may take to answer before the call goes on without it. Null - platform default. Post-call deliveries keep the default.
AiAgentDataPolicy:
  type: object
  description: |-
    What is kept after the call ends, for how long, and what leaves this system during it.

    One group because they are answered together, by whoever signs off on the company's data handling rather than by whoever tunes the voice: turning on `zeroPiiRetention` while leaving the audio stored keeps the very thing the setting was meant to remove.
  properties:
    zeroPiiRetention:
      type: boolean
      description: strip personal data from what is stored about the call
    storeCallAudio:
      type: boolean
      description: keep the recording at all
    conversationRetentionDays:
      type: integer
      format: int32
      description: how long the transcript is kept; never null
    realtimeFactsDelivery:
      allOf:
      - $ref: '#/RealtimeFactsDelivery'
      description: how a speech-to-speech engine is given the call's facts; null leaves it to the deployment (`voice-agent.realtime.facts-in-prompt`). `TOOL` also keeps the figures off the vendor's instructions entirely — they are sent one at a time, only when asked for
  required:
  - zeroPiiRetention
  - storeCallAudio
AiAgentFilter:
  type: object
  properties:
    page:
      type: integer
      format: int32
      minimum: 0
    size:
      type: integer
      format: int32
      minimum: 1
      maximum: 500
    orders:
      type: object
      properties:
        ID:
          $ref: ../common.yaml#/schemas/SortDirection
        NAME:
          $ref: ../common.yaml#/schemas/SortDirection
        LANGUAGE:
          $ref: ../common.yaml#/schemas/SortDirection
        SCENARIO_ID:
          $ref: ../common.yaml#/schemas/SortDirection
        CREATED_AT:
          $ref: ../common.yaml#/schemas/SortDirection
      additionalProperties: false
      description: Kalitlar tartibi muhim — ro'yxatdagi tartib bo'yicha qo'llanadi
    search:
      type: string
    scenarioId:
      type: integer
      format: int64
    enabled:
      type: boolean
AiAgentRow:
  type: object
  description: '`AiAgent` representation returned to the agent screens. The groups are the ones `UpdateAiAgentRequest` takes, so the form can send back what it read.'
  properties:
    id:
      type: integer
      format: int64
    companyId:
      type: integer
      format: int64
    name:
      type: string
    description:
      type: string
    language:
      type: string
    speechLanguages:
      type: array
      items:
        type: string
      description: "Languages a call may be held in (BCP-47, see GET /api/ai-agents/speech-languages); the agent language always leads. Update: null keeps, [] or clearFields SPEECH_LANGUAGES leaves only the agent language."
    persona:
      $ref: ../common.yaml#/schemas/AgentPersona
    multilingual:
      type: boolean
      description: true when the agent holds calls in more than one language (speechLanguages plus languages it has a voice for)
    disclosureEnabled:
      type: boolean
    engineProfileId:
      type: string
    script:
      $ref: '#/AgentScriptDto'
    scenarioName:
      type: string
    speechEngine:
      $ref: '#/AgentSpeechEngineDto'
    voice:
      $ref: '#/AgentVoiceDto'
    llmModel:
      type: string
    fastLlmModel:
      type: string
    fallbackLlmModel:
      type: string
    fallbackLlmMode:
      $ref: '#/LlmFallbackMode'
    temperature:
      type: number
      format: double
    maxOutputTokens:
      type: integer
      format: int32
    ambience:
      $ref: '#/AgentAmbienceDto'
    greeting:
      $ref: '#/AgentGreetingDto'
    callBehaviour:
      $ref: '#/AgentCallBehaviourDto'
    limits:
      $ref: '#/AgentLimitsDto'
    dataPolicy:
      $ref: '#/AgentDataPolicyDto'
    redactPhoneNumbers:
      type: boolean
      description: Phone numbers are replaced by [PHONE] in the stored transcript and summary.
    defaultVariables:
      type: object
      additionalProperties:
        type: string
      description: Default values for {{name}} placeholders; call data, pre-call functions and the initiation webhook override them.
    disabledIntegrationTools:
      type: array
      items:
        type: string
      description: Legacy - ignored once functions is saved. Integration tools (company-enabled Uysot built-ins and HTTP tools) this agent does not get; empty = follows the company settings.
    functions:
      type: array
      items:
        $ref: '#/AgentFunction'
      description: The agent's function list; always filled - for an agent that never saved one, the list derived from its older settings (END_CALL, TRANSFER_CALL, PRESS_DIGIT, SEND_SMS, attached tools, enabled integration tools).
    ragTopK:
      type: integer
      description: How many knowledge passages answer one question (1-10). Null - the deployment default.
    ragMinScore:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: Semantic similarity floor for knowledge passages (0-1). Null - the default 0.62.
    ragInstruction:
      type: string
      maxLength: 500
      description: Focus text prepended to the knowledge search query; {{name}} placeholders are filled from call variables. Null - none.
    useRag:
      type: boolean
    dataNeeded:
      type: array
      items:
        $ref: '#/DataExtractionField'
    dataEvaluation:
      type: array
      items:
        $ref: '#/DataEvaluationCriterion'
    initiationWebhook:
      $ref: '#/AgentWebhookConfig'
    postCallWebhook:
      $ref: '#/AgentWebhookConfig'
    pronunciationRules:
      type: array
      items:
        $ref: '#/PronunciationRule'
    postCallActions:
      type: array
      items:
        $ref: '#/PostCallAction'
    preCallFunctions:
      type: array
      items:
        $ref: '#/WorkflowFunction'
    enabled:
      type: boolean
    createdAt:
      type: string
      format: date-time
    createdBy:
      type: integer
      format: int64
    createdByName:
      type: string
    publishedVersion:
      type: integer
      format: int32
    hasDraftChanges:
      type: boolean
    version:
      type: integer
      format: int64
  required:
  - id
  - companyId
  - disclosureEnabled
  - script
  - speechEngine
  - voice
  - ambience
  - callBehaviour
  - limits
  - dataPolicy
  - useRag
  - enabled
  - hasDraftChanges
  - version
AiAgentRowPage:
  type: object
  description: '`AiAgentRow` sahifasi'
  properties:
    totalPages:
      type: integer
      format: int32
    currentPage:
      type: integer
      format: int32
    totalElements:
      type: integer
      format: int64
    data:
      type: array
      items:
        $ref: '#/AiAgentRow'
  required:
  - totalPages
  - currentPage
  - totalElements
AiAgentVersionRow:
  type: object
  description: One line of an agent's version history — the snapshot itself is fetched per version.
  properties:
    version:
      type: integer
      format: int32
    status:
      $ref: '#/AgentVersionStatus'
    note:
      type: string
    publishedAt:
      type: string
      format: date-time
    publishedBy:
      type: integer
      format: int64
    publishedByName:
      type: string
    calls:
      type: integer
      format: int64
      description: calls that ran on this version
    conversions:
      type: integer
      format: int64
      description: of those, the ones that ended in PROMISE_TO_PAY, GOAL_REACHED or COMPLETED
  required:
  - version
  - calls
  - conversions
AmbientSound:
  type: string
  enum:
  - 'OFF'
  - OFFICE
  - CALL_CENTER
  - NATURAL_LINE
  - CAFE
  - KEYBOARD_TYPING
  description: |-
    Ambient background soundscape types mixed into outbound audio at ~ -38dB to -43dB — roughly 20 dB under the bot's own voice, the distance a real room sits at (`AmbientSoundGenerator`).

    `#KEYBOARD_TYPING` is the odd one out: it is not a room the bot is calling from but a thing the bot is doing, so it is played only while a reply is being composed rather than for the whole call.
CreateAiAgentRequest:
  type: object
  description: A new AI agent (`POST /api/ai-agents`). Each group may be left out as a whole; the agent then takes that group's defaults.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
    description:
      type: string
      maxLength: 500
    language:
      type: string
    speechLanguages:
      type: array
      items:
        type: string
      description: "Languages a call may be held in (BCP-47, see GET /api/ai-agents/speech-languages); the agent language always leads. Update: null keeps, [] or clearFields SPEECH_LANGUAGES leaves only the agent language."
    persona:
      $ref: ../common.yaml#/schemas/AgentPersona
    engineProfileId:
      type: string
    script:
      $ref: '#/AgentScriptDto'
    speechEngine:
      $ref: '#/AgentSpeechEngineDto'
    voice:
      $ref: '#/AgentVoiceDto'
    llmModel:
      type: string
      maxLength: 120
    fastLlmModel:
      type: string
      maxLength: 120
    fallbackLlmModel:
      type: string
      maxLength: 120
    fallbackLlmMode:
      $ref: '#/LlmFallbackMode'
    temperature:
      type: number
      format: double
    maxOutputTokens:
      type: integer
      format: int32
    ambience:
      $ref: '#/AgentAmbienceDto'
    greeting:
      $ref: '#/AgentGreetingDto'
    callBehaviour:
      $ref: '#/AgentCallBehaviourDto'
    limits:
      $ref: '#/AgentLimitsDto'
    dataPolicy:
      $ref: '#/AgentDataPolicyDto'
    useRag:
      type: boolean
    dataNeeded:
      type: array
      items:
        $ref: '#/DataExtractionField'
    dataEvaluation:
      type: array
      items:
        $ref: '#/DataEvaluationCriterion'
    initiationWebhook:
      $ref: '#/AgentWebhookConfig'
    postCallWebhook:
      $ref: '#/AgentWebhookConfig'
    enabled:
      type: boolean
  required:
  - name
DataEvaluationCriterion:
  type: object
  description: A post-call evaluation criterion assessed by AI upon call completion. One thing the call is scored on afterwards.
  properties:
    id:
      type: string
      description: unique criterion identifier (e.g. "human_follow_up_needed")
    name:
      type: string
      description: human-readable label
    criteria:
      type: string
      description: evaluation prompt or question to verify against conversation transcript
DataExtractionField:
  type: object
  description: A structured data field the AI Agent should extract from the caller during a conversation. One field the call is expected to come back with.
  properties:
    id:
      type: string
      description: unique field identifier (e.g. "caller_name", "callback_number")
    type:
      type: string
      description: Case-insensitive data type: string, number, boolean, date, enum, phone, or email. Phone and email values are format-validated after extraction.
    name:
      type: string
      description: human-readable display label
    description:
      type: string
      description: extraction instructions for the LLM
    options:
      type: array
      items:
        type: string
      description: Allowed values of an enum field (at most 20, each 1-100 characters); the answer must be one of them. Enum fields only.
EngineOptionsResponse:
  type: object
  description: Options for engine settings screen.
  properties:
    stt:
      type: array
      items:
        type: string
    tts:
      type: array
      items:
        type: string
    realtime:
      type: array
      items:
        type: string
    pipecatStt:
      type: array
      items:
        type: string
    pipecatLlm:
      type: array
      items:
        type: string
    pipecatTts:
      type: array
      items:
        type: string
InterruptionSensitivity:
  type: string
  enum:
  - LOW
  - MEDIUM
  - HIGH
  - 'OFF'
NoiseCancellationMode:
  type: string
  enum:
  - 'OFF'
  - BACKGROUND_NOISE_SUPPRESSION
  - VOICE_ISOLATION
  description: |-
    How hard the inbound cleaner works on the caller's leg before the recognizer hears it (`TelephonyNoiseCanceller`).

    - `OFF` — No noise cancellation applied.

    - `BACKGROUND_NOISE_SUPPRESSION` — Reduces non-speech background noise such as traffic, fans, AC, humming, typing, and environmental static while preserving natural caller voice.

    - `VOICE_ISOLATION` — Emphasizes the primary speaker and aggressively suppresses competing speech, background chatter, and room reverberation.
PostCallAction:
  type: object
  description: An automated follow-up action executed after a call finishes (e.g. send SMS, call CRM webhook).
  properties:
    id:
      type: string
      description: unique identifier within the agent's action list
      minLength: 1
      maxLength: 64
    name:
      type: string
      description: human-friendly title
      minLength: 1
      maxLength: 120
    actionType:
      allOf:
      - $ref: '#/PostCallActionType'
      description: SEND_SMS, WEBHOOK, or TELEGRAM
    triggerDisposition:
      allOf:
      - $ref: ../common.yaml#/schemas/Disposition
      description: specific disposition (null for any conversion)
    onlyOnSuccess:
      type: boolean
      description: true if action should only fire on successful calls (conversion or positive sentiment)
    template:
      type: string
      description: message template supporting placeholders like `{{client_name`}}, `{{summary`}}
    webhookUrl:
      type: string
      description: optional target endpoint if actionType == WEBHOOK
    headers:
      type: object
      additionalProperties:
        type: string
      description: optional HTTP headers for webhook
    enabled:
      type: boolean
      description: whether this action is active
  required:
  - id
  - name
  - actionType
  - onlyOnSuccess
  - enabled
PostCallActionType:
  type: string
  enum:
  - SEND_SMS
  - WEBHOOK
  - TELEGRAM
  description: Type of automated action triggered upon call finalization.
PronunciationRule:
  type: object
  description: |-
    Custom pronunciation or phonetic substitution rule for an AI Agent.

    Rewrites acronyms, domain jargon, brand names or numbers into spoken phonetic equivalents before passing text to the TTS engine (e.g. `"MCHJ" -> "mas'uliyati cheklangan jamiyat"`).
  properties:
    word:
      type: string
      description: original word or acronym to match
      minLength: 1
      maxLength: 120
    replacement:
      type: string
      description: spoken phonetic replacement text
      minLength: 1
      maxLength: 255
    caseSensitive:
      type: boolean
      description: whether string matching respects case (default false)
    language:
      type: string
      description: target language code or `null` / `"*"` for all languages
  required:
  - word
  - replacement
  - caseSensitive
PublishAiAgentRequest:
  type: object
  description: '@param note what this version changes, shown in the history; optional'
  properties:
    note:
      type: string
      description: what this version changes, shown in the history; optional
      maxLength: 500
RealtimeFactsDelivery:
  type: string
  enum:
  - PROMPT
  - TOOL
  description: |-
    How a speech-to-speech engine learns the call's facts — the debt amount, the due date, the contract number (§4.4).

    Only a realtime call has to choose. The cascade pipeline sees every sentence before it is spoken and withholds one whose figures do not match the facts; a realtime engine speaks straight from audio, so the only prevention left is what it was given.

    - `PROMPT` — Written into the instructions, as the cascade pipeline does. Fastest — the figure is already there when the model needs it — and the engine can misremember or embellish it; the audit only notices afterwards.

    - `TOOL` — Kept out of the instructions and fetched with `getCallFact` at the moment it is about to be said. Costs a tool round trip before a figure and leaves the model nothing to misremember — the right setting for money on a recorded line.
SaveAgentTestCaseRequest:
  type: object
  description: A test case, created or replaced as a whole (NEXT-PLAN A.2).
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    personaPrompt:
      type: string
      description: 'instructions to the model that plays the caller: who they are, what they want, how they react'
      minLength: 1
      maxLength: 4000
    facts:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
      description: the call's facts, keyed by the scenario's `factSchema` names
    language:
      type: string
      description: the caller's language; null uses the agent's
      maxLength: 10
    expectDisposition:
      type: string
      description: how the call must end (`PROMISE_TO_PAY`, `REFUSED`, …)
      maxLength: 40
    expectStage:
      type: string
      maxLength: 100
    mustSay:
      type: array
      items:
        type: string
      description: phrases the agent has to say (case-insensitive)
      maxItems: 20
    mustNotSay:
      type: array
      items:
        type: string
      description: phrases the agent must never say
      maxItems: 20
    maxTurns:
      type: integer
      format: int32
      description: turns before the call is cut off; null means 12
      minimum: 1
      maximum: 30
  required:
  - name
  - personaPrompt
ScenarioMode:
  type: string
  enum:
  - PROMPT
  - STRUCTURED_STEPS
  description: "Scenario mode of an AI Agent:\r\n- PROMPT: The agent is driven primarily by natural language instructions, rules, and goal.\r\n- STRUCTURED_STEPS: The agent follows a defined state machine (FSM) of stages with explicit transitions."
TemplateDefaults:
  type: object
  description: Default preset values provided by an agent template.
  properties:
    firstMessage:
      type: string
    systemPrompt:
      type: string
    dataNeeded:
      type: array
      items:
        $ref: '#/DataExtractionField'
    dataEvaluation:
      type: array
      items:
        $ref: '#/DataEvaluationCriterion'
TemplatePresetDto:
  type: object
  description: Template preset descriptor for frontend template picker.
  properties:
    templateId:
      $ref: '#/AgentTemplate'
    name:
      type: string
    description:
      type: string
    defaults:
      $ref: '#/TemplateDefaults'
UpdateAiAgentRequest:
  type: object
  description: |-
    Full edit of an agent (`PUT /api/ai-agents/{id}`). The groups are the same as `AiAgentRow` returns; a null field — or a group left out — keeps the agent's value.

    `version` is the one `AiAgentRow` carried when the form was opened — the draft row's lock counter, not `publishedVersion`. An agent saved by someone else since is answered 409 instead of being overwritten. Optional, so an older client that does not send it keeps working.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
    description:
      type: string
      maxLength: 500
    language:
      type: string
    speechLanguages:
      type: array
      items:
        type: string
      description: "Languages a call may be held in (BCP-47, see GET /api/ai-agents/speech-languages); the agent language always leads. Update: null keeps, [] or clearFields SPEECH_LANGUAGES leaves only the agent language."
    persona:
      $ref: ../common.yaml#/schemas/AgentPersona
    engineProfileId:
      type: string
    script:
      $ref: '#/AgentScriptDto'
    speechEngine:
      $ref: '#/AgentSpeechEngineDto'
    voice:
      $ref: '#/AgentVoiceDto'
    llmModel:
      type: string
      maxLength: 120
    fastLlmModel:
      type: string
      maxLength: 120
    fallbackLlmModel:
      type: string
      maxLength: 120
    fallbackLlmMode:
      $ref: '#/LlmFallbackMode'
    temperature:
      type: number
      format: double
    maxOutputTokens:
      type: integer
      description: Reply token cap, thinking included; omitted keeps the current value, clearFields MAX_OUTPUT_TOKENS returns to the platform default.
      format: int32
    ambience:
      $ref: '#/AgentAmbienceDto'
    greeting:
      $ref: '#/AgentGreetingDto'
    callBehaviour:
      $ref: '#/AgentCallBehaviourDto'
    limits:
      $ref: '#/AgentLimitsDto'
    dataPolicy:
      $ref: '#/AgentDataPolicyDto'
    redactPhoneNumbers:
      type: boolean
      description: Replace phone numbers by [PHONE] in stored transcripts and summaries; omitted keeps the current value.
    defaultVariables:
      type: object
      additionalProperties:
        type: string
      description: Default values for {{name}} placeholders (up to 50, names [A-Za-z0-9_-]{1,64}, values up to 500 characters); replaces the whole map, {} clears it, omitted keeps it.
    disabledIntegrationTools:
      type: array
      maxItems: 100
      items:
        type: string
        maxLength: 100
      description: 'Legacy, ignored once functions is saved. Integration tools this agent does not get: a built-in tool key (CREATE_LEAD, from GET /api/settings/integrations/tools `tool`) or an HTTP tool name (`toolName`). Replaces the whole list, [] follows the company settings again, omitted keeps it. Unknown names are accepted and ignored.'
    functions:
      type: array
      maxItems: 50
      nullable: true
      items:
        $ref: '#/AgentFunction'
      description: 'Replaces the whole function list; null keeps it, [] leaves the agent with no functions. Once saved, only this list drives the agent tools; attached tools are synced to the CUSTOM functions. Errors: AI_AGENT_FUNCTION_INVALID, AI_AGENT_FUNCTION_DUPLICATE, AI_AGENT_FUNCTION_TOOL_NOT_FOUND (all 400).'
    ragTopK:
      type: integer
      description: 1-10; 0 puts the agent back on the default count.
    ragMinScore:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: 0-1; omitted keeps the current value, clearFields RAG_MIN_SCORE returns to the default 0.62.
    ragInstruction:
      type: string
      maxLength: 500
      description: Knowledge search focus text, up to 500 characters; omitted keeps it, "" removes it.
    useRag:
      type: boolean
    dataNeeded:
      type: array
      items:
        $ref: '#/DataExtractionField'
    dataEvaluation:
      type: array
      items:
        $ref: '#/DataEvaluationCriterion'
    initiationWebhook:
      $ref: '#/AgentWebhookConfig'
    postCallWebhook:
      $ref: '#/AgentWebhookConfig'
    enabled:
      type: boolean
    version:
      type: integer
      format: int64
    clearFields:
      type: array
      description: Optional settings to remove — the one way to empty a value, since a null field keeps it. A field also given a value in the same request is refused with 400 `AI_AGENT_CLEAR_FIELD_CONFLICT`.
      items:
        $ref: '#/AgentClearableField'
      uniqueItems: true
  required:
  - name
LlmFallbackMode:
  type: string
  description: When the fallback model takes over from the main one — after its request failed (SEQUENTIAL) or when it sends no first token in time (CONCURRENT).
  enum:
  - SEQUENTIAL
  - CONCURRENT
VoicemailAction:
  type: string
  enum:
  - HANGUP
  - LEAVE_MESSAGE
  - IGNORE
  description: Action taken when Answering Machine Detection (AMD) classifies the answered call as voicemail.
AgentFunctionType:
  type: string
  enum:
  - END_CALL
  - TRANSFER_CALL
  - AGENT_TRANSFER
  - PRESS_DIGIT
  - SEND_SMS
  - EXTRACT_VARIABLE
  - CUSTOM
  - INTEGRATION
  description: 'What a function does. System types have a fixed model tool name: endCall, requestHumanTransfer, transferToAgent, sendDtmfTones, sendMidCallSms. CODE is not accepted.'
AgentFunctionTiming:
  type: string
  enum:
  - IN_TURN
  - BACKGROUND
  description: IN_TURN - the turn waits and the model replies with the answer. BACKGROUND - started and not waited for; no model round on the answer and no waiting line. A tool that needs the caller's confirmation still reads it back in the turn first.
AgentFunction:
  type: object
  description: One function (tool) the agent may use on a call. Only the settings group of its own type is filled; the others are dropped on save.
  properties:
    id:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,40}$'
      description: Stable key the client gives it, unique within the list.
    type:
      $ref: '#/AgentFunctionType'
    name:
      type: string
      description: The tool name the model sees. Fixed for a system type (the request value is ignored), the user's for EXTRACT_VARIABLE (^[a-zA-Z][a-zA-Z0-9_]{0,63}$), the tool's own for CUSTOM, the catalog's for INTEGRATION.
    description:
      type: string
      maxLength: 1000
      nullable: true
      description: Replaces the description the model reads; null - the standard one.
    speakDuringExecution:
      type: boolean
    executionMessage:
      type: string
      maxLength: 300
      nullable: true
      description: What is said while the function runs (cascade only); null - the standard filler.
    transfer:
      $ref: '#/AgentFunctionTransfer'
    agentTransfer:
      $ref: '#/AgentFunctionAgentTransfer'
    pressDigit:
      $ref: '#/AgentFunctionPressDigit'
    sms:
      $ref: '#/AgentFunctionSms'
    extract:
      $ref: '#/AgentFunctionExtract'
    toolId:
      type: integer
      format: int64
      nullable: true
      description: CUSTOM - the company's tool.
    integrationTool:
      type: string
      nullable: true
      description: INTEGRATION - the catalog tool (`toolName ?? tool` of GET /api/settings/integrations/tools).
    timing:
      allOf:
      - $ref: '#/AgentFunctionTiming'
      nullable: true
      description: CUSTOM and INTEGRATION - whether the turn waits for the answer, over the tool's own `http.waitForResult`; null - the tool's own. Dropped for other types.
  required:
  - id
  - type
AgentFunctionTransfer:
  type: object
  properties:
    destination:
      type: string
      nullable: true
      description: A phone number, a PJSIP/ or SIP/ endpoint, a sip: URI or a {{variable}}; empty - the agent's earlier transfer target (queue, number, global operator).
    mode:
      type: string
      enum:
      - COLD
      - WARM
AgentFunctionAgentTransfer:
  type: object
  properties:
    agentId:
      type: integer
      format: int64
      description: Another published agent of the same company, not this one.
    keepVoice:
      type: boolean
    keepLanguage:
      type: boolean
AgentFunctionPressDigit:
  type: object
  properties:
    pauseDetectionDelayMs:
      type: integer
      minimum: 0
      maximum: 5000
      nullable: true
AgentFunctionSms:
  type: object
  properties:
    contentMode:
      type: string
      enum:
      - PROMPT
      - STATIC
    content:
      type: string
      description: STATIC - the SMS text ({{variables}} filled, up to 480 characters); PROMPT - the instruction the model writes the text from (up to 1000).
    sendTo:
      type: string
      enum:
      - CALLER
      - NUMBER
    number:
      type: string
      nullable: true
      description: The recipient of sendTo=NUMBER, a phone number or a {{variable}}.
    speakAfter:
      type: boolean
AgentFunctionExtract:
  type: object
  properties:
    variables:
      type: array
      maxItems: 30
      items:
        $ref: '#/AgentFunctionVariable'
AgentFunctionVariable:
  type: object
  properties:
    name:
      type: string
      pattern: '^[a-zA-Z][a-zA-Z0-9_]{0,63}$'
    type:
      type: string
      enum:
      - STRING
      - NUMBER
      - BOOLEAN
      - ENUM
    description:
      type: string
      maxLength: 300
    choices:
      type: array
      maxItems: 20
      items:
        type: string
        maxLength: 100
      description: The allowed values of an ENUM variable (at least one).
