# `aiagent` feature'ining ma'lumot turlari (request/response DTO, domain, enum).
AgentAdvancedDto:
  type: object
  properties:
    useRag:
      type: boolean
    preemptiveGeneration:
      type: boolean
    ivrNavigationEnabled:
      type: boolean
    storeCallAudio:
      type: boolean
    zeroPiiRetention:
      type: boolean
    conversationRetentionDays:
      type: integer
      format: int32
    realtimeFactsDelivery:
      $ref: '#/RealtimeFactsDelivery'
    initiationWebhook:
      $ref: '#/AgentWebhookConfig'
    postCallWebhook:
      $ref: '#/AgentWebhookConfig'
    ambientSound:
      $ref: '#/AmbientSound'
    ambientSoundVolume:
      type: number
      format: double
    ambientSoundFadeInSeconds:
      type: number
      format: double
    thinkingSound:
      $ref: '#/AmbientSound'
    thinkingSoundVolume:
      type: number
      format: double
    noiseCancellationEnabled:
      type: boolean
    noiseCancellationMode:
      $ref: '#/NoiseCancellationMode'
    emotionAdaptiveVoice:
      type: boolean
    dtmfInputEnabled:
      type: boolean
    voicemailAction:
      $ref: '#/VoicemailAction'
    voicemailMessage:
      type: string
    midCallSmsEnabled:
      type: boolean
    midCallSmsTemplate:
      type: string
    transferPhoneNumber:
      type: string
    transferMessage:
      type: string
    transferQueueId:
      type: integer
      format: int64
    interruptionSensitivity:
      $ref: '#/InterruptionSensitivity'
    endpointingDelayMs:
      type: integer
      format: int32
AgentAnalysisDto:
  type: object
  properties:
    dataNeeded:
      type: array
      items:
        $ref: '#/DataExtractionField'
    dataEvaluation:
      type: array
      items:
        $ref: '#/DataEvaluationCriterion'
AgentEvalResult:
  type: object
  description: How one test case went in one evaluation run (NEXT-PLAN A.2).
  properties:
    id:
      type: integer
      format: int64
    runId:
      type: integer
      format: int64
    testCaseId:
      type: integer
      format: int64
      description: null once the case has been deleted; `caseName` keeps its name
    caseName:
      type: string
    passed:
      type: boolean
    disposition:
      type: string
    stage:
      type: string
    problems:
      type: array
      items:
        type: string
      description: every expectation it missed, empty when it passed
    transcript:
      type: string
      description: the simulated call, one `AGENT:`/`CLIENT:` line each
    qaScore:
      type: integer
      format: int32
      description: the judge's score, or null when it was not scored
    guardrailViolation:
      type: boolean
      description: the judge found a figure, date or promise the facts do not support
  required:
  - runId
  - passed
  - guardrailViolation
AgentEvalRun:
  type: object
  description: One evaluation of an agent against all its test cases (NEXT-PLAN A.2).
  properties:
    id:
      type: integer
      format: int64
    companyId:
      type: integer
      format: int64
    agentId:
      type: integer
      format: int64
    agentVersion:
      type: integer
      format: int32
      description: the published version evaluated, or null for the draft
    status:
      $ref: '#/AgentEvalRunStatus'
    total:
      type: integer
      format: int32
    passed:
      type: integer
      format: int32
    avgQaScore:
      type: integer
      format: int32
      description: the judge's mean score over the cases it scored, or null
    error:
      type: string
      description: why the run broke off, when it did
    startedAt:
      type: string
      format: date-time
    finishedAt:
      type: string
      format: date-time
  required:
  - companyId
  - agentId
  - total
  - passed
AgentEvalRunDetail:
  type: object
  description: One evaluation run with every case's transcript and verdict.
  properties:
    run:
      $ref: '#/AgentEvalRun'
    results:
      type: array
      items:
        $ref: '#/AgentEvalResult'
AgentEvalRunStatus:
  type: string
  enum:
  - RUNNING
  - DONE
  - FAILED
  description: |-
    Where an agent evaluation run stands.

    - `RUNNING`

    - `DONE`

    - `FAILED` — The run itself broke off; the cases played before it are kept.
AgentLimitsDto:
  type: object
  properties:
    concurrentCallsLimit:
      type: integer
      format: int32
    dailyCallsLimit:
      type: integer
      format: int32
    maxConversationDurationSeconds:
      type: integer
      format: int32
    silenceEndCallTimeoutSeconds:
      type: integer
      format: int32
    turnTimeoutSeconds:
      type: integer
      format: int32
AgentPostCallActionsDto:
  type: object
  description: DTO for Post-Call Actions & Automated Follow-ups tab.
  properties:
    actions:
      type: array
      items:
        $ref: '#/PostCallAction'
AgentPronunciationDto:
  type: object
  description: DTO for Pronunciation / Phonetic Dictionary tab.
  properties:
    rules:
      type: array
      items:
        $ref: '#/PronunciationRule'
AgentScenarioDto:
  type: object
  description: Behavior and embedded Scenario configuration for an AI Agent.
  properties:
    scenarioMode:
      $ref: '#/ScenarioMode'
    firstMessage:
      type: string
    systemPrompt:
      type: string
    stages:
      type: array
      items:
        $ref: scenario.yaml#/StageDef
    guardrails:
      type: array
      items:
        type: string
    factSchema:
      type: array
      items:
        $ref: scenario.yaml#/FactField
    disclosureText:
      type: string
AgentTemplate:
  type: string
  enum:
  - BUSINESS
  - SUPPORT
  - MEDICAL
  - BLANK
  description: Presets a new agent can be started from, so the first screen is not empty.
AgentTestCase:
  type: object
  description: One scripted caller an agent is evaluated against (NEXT-PLAN A.2).
  properties:
    id:
      type: integer
      format: int64
    companyId:
      type: integer
      format: int64
    agentId:
      type: integer
      format: int64
    name:
      type: string
    personaPrompt:
      type: string
      description: instructions to the model that plays the caller
    facts:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
      description: the call's facts, as the CRM would supply them
    language:
      type: string
      description: the caller's language; null uses the agent's
    expectDisposition:
      type: string
      description: how the call must end, or null to not judge it
    expectStage:
      type: string
      description: the stage it must end in, or null
    mustSay:
      type: array
      items:
        type: string
      description: phrases the agent has to say at some point (case-insensitive)
    mustNotSay:
      type: array
      items:
        type: string
      description: phrases the agent must never say — "chegirma", a figure, a promise
    maxTurns:
      type: integer
      format: int32
      description: turns before the simulated call is cut off
    createdAt:
      type: string
      format: date-time
  required:
  - companyId
  - agentId
  - maxTurns
AgentVersionStatus:
  type: string
  enum:
  - PUBLISHED
  - ARCHIVED
  description: 'Where a published agent snapshot stands: `PUBLISHED` is the one version calls run on, `ARCHIVED` every earlier one — kept so a rollback has something to return to.'
AgentWebhookConfig:
  type: object
  description: Webhook configuration for agent initiation or post-call callback. The URL, headers and timeout one of an agent's webhooks is called with.
  properties:
    webhookUrl:
      type: string
      description: destination URL
    method:
      type: string
      description: HTTP method (POST, GET)
    headers:
      type: object
      additionalProperties:
        type: string
      description: HTTP headers
    dynamicVariables:
      type: object
      additionalProperties:
        type: string
      description: variables to pass (initiation)
    transcript:
      type: boolean
      description: whether to send call transcript (post-call)
    audioUrl:
      type: boolean
      description: whether to send recorded audio URL (post-call)
AiAgentDataPolicy:
  type: object
  description: |-
    What is kept after the call ends, for how long, and what leaves this system during it.

    One group because they are answered together, by whoever signs off on the company's data handling rather than by whoever tunes the voice: turning on `zeroPiiRetention` while leaving the audio stored keeps the very thing the setting was meant to remove.
  properties:
    zeroPiiRetention:
      type: boolean
      description: strip personal data from what is stored about the call
    storeCallAudio:
      type: boolean
      description: keep the recording at all
    conversationRetentionDays:
      type: integer
      format: int32
      description: how long the transcript is kept; never null
    realtimeFactsDelivery:
      allOf:
      - $ref: '#/RealtimeFactsDelivery'
      description: how a speech-to-speech engine is given the call's facts; null leaves it to the deployment (`voice-agent.realtime.facts-in-prompt`). `TOOL` also keeps the figures off the vendor's instructions entirely — they are sent one at a time, only when asked for
  required:
  - zeroPiiRetention
  - storeCallAudio
AiAgentFilter:
  type: object
  properties:
    page:
      type: integer
      format: int32
      minimum: 0
    size:
      type: integer
      format: int32
      minimum: 1
      maximum: 500
    orders:
      type: object
      properties:
        ID:
          $ref: ../common.yaml#/schemas/SortDirection
        NAME:
          $ref: ../common.yaml#/schemas/SortDirection
        LANGUAGE:
          $ref: ../common.yaml#/schemas/SortDirection
        SCENARIO_ID:
          $ref: ../common.yaml#/schemas/SortDirection
        CREATED_AT:
          $ref: ../common.yaml#/schemas/SortDirection
      additionalProperties: false
      description: Kalitlar tartibi muhim — ro'yxatdagi tartib bo'yicha qo'llanadi
    search:
      type: string
    scenarioId:
      type: integer
      format: int64
    enabled:
      type: boolean
