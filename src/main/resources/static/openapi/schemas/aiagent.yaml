DataEvaluationCriterion:
  type: object
  description: A post-call evaluation criterion assessed by AI upon call completion. One thing the call is scored on afterwards.
  properties:
    id:
      type: string
      description: unique criterion identifier (e.g. "human_follow_up_needed")
    name:
      type: string
      description: human-readable label
    criteria:
      type: string
      description: evaluation prompt or question to verify against conversation transcript
DataExtractionField:
  type: object
  description: A structured data field the AI Agent should extract from the caller during a conversation. One field the call is expected to come back with.
  properties:
    id:
      type: string
      description: unique field identifier (e.g. "caller_name", "callback_number")
    type:
      type: string
      description: data type (e.g. "String", "Number", "Boolean")
    name:
      type: string
      description: human-readable display label
    description:
      type: string
      description: extraction instructions for the LLM
EngineOptionsResponse:
  type: object
  description: Options for engine settings screen.
  properties:
    stt:
      type: array
      items:
        type: string
    tts:
      type: array
      items:
        type: string
    realtime:
      type: array
      items:
        type: string
    pipecatStt:
      type: array
      items:
        type: string
    pipecatLlm:
      type: array
      items:
        type: string
    pipecatTts:
      type: array
      items:
        type: string
InterruptionSensitivity:
  type: string
  enum:
  - LOW
  - MEDIUM
  - HIGH
  - 'OFF'
NoiseCancellationMode:
  type: string
  enum:
  - 'OFF'
  - BACKGROUND_NOISE_SUPPRESSION
  - VOICE_ISOLATION
  description: |-
    How hard the inbound cleaner works on the caller's leg before the recognizer hears it (`TelephonyNoiseCanceller`).

    - `OFF` — No noise cancellation applied.

    - `BACKGROUND_NOISE_SUPPRESSION` — Reduces non-speech background noise such as traffic, fans, AC, humming, typing, and environmental static while preserving natural caller voice.

    - `VOICE_ISOLATION` — Emphasizes the primary speaker and aggressively suppresses competing speech, background chatter, and room reverberation.
PostCallAction:
  type: object
  description: An automated follow-up action executed after a call finishes (e.g. send SMS, call CRM webhook).
  properties:
    id:
      type: string
      description: unique identifier within the agent's action list
      minLength: 1
      maxLength: 64
    name:
      type: string
      description: human-friendly title
      minLength: 1
      maxLength: 120
    actionType:
      allOf:
      - $ref: '#/PostCallActionType'
      description: SEND_SMS, WEBHOOK, or TELEGRAM
    triggerDisposition:
      allOf:
      - $ref: ../common.yaml#/schemas/Disposition
      description: specific disposition (null for any conversion)
    onlyOnSuccess:
      type: boolean
      description: true if action should only fire on successful calls (conversion or positive sentiment)
    template:
      type: string
      description: message template supporting placeholders like `{{client_name`}}, `{{summary`}}
    webhookUrl:
      type: string
      description: optional target endpoint if actionType == WEBHOOK
    headers:
      type: object
      additionalProperties:
        type: string
      description: optional HTTP headers for webhook
    enabled:
      type: boolean
      description: whether this action is active
  required:
  - id
  - name
  - actionType
  - onlyOnSuccess
  - enabled
PostCallActionType:
  type: string
  enum:
  - SEND_SMS
  - WEBHOOK
  - TELEGRAM
  description: Type of automated action triggered upon call finalization.
PronunciationRule:
  type: object
  description: |-
    Custom pronunciation or phonetic substitution rule for an AI Agent.

    Rewrites acronyms, domain jargon, brand names or numbers into spoken phonetic equivalents before passing text to the TTS engine (e.g. `"MCHJ" -> "mas'uliyati cheklangan jamiyat"`).
  properties:
    word:
      type: string
      description: original word or acronym to match
      minLength: 1
      maxLength: 120
    replacement:
      type: string
      description: spoken phonetic replacement text
      minLength: 1
      maxLength: 255
    caseSensitive:
      type: boolean
      description: whether string matching respects case (default false)
    language:
      type: string
      description: target language code or `null` / `"*"` for all languages
  required:
  - word
  - replacement
  - caseSensitive
PublishAiAgentRequest:
  type: object
  description: '@param note what this version changes, shown in the history; optional'
  properties:
    note:
      type: string
      description: what this version changes, shown in the history; optional
      maxLength: 500
RealtimeFactsDelivery:
  type: string
  enum:
  - PROMPT
  - TOOL
  description: |-
    How a speech-to-speech engine learns the call's facts — the debt amount, the due date, the contract number (§4.4).

    Only a realtime call has to choose. The cascade pipeline sees every sentence before it is spoken and withholds one whose figures do not match the facts; a realtime engine speaks straight from audio, so the only prevention left is what it was given.

    - `PROMPT` — Written into the instructions, as the cascade pipeline does. Fastest — the figure is already there when the model needs it — and the engine can misremember or embellish it; the audit only notices afterwards.

    - `TOOL` — Kept out of the instructions and fetched with `getCallFact` at the moment it is about to be said. Costs a tool round trip before a figure and leaves the model nothing to misremember — the right setting for money on a recorded line.
SaveAgentTestCaseRequest:
  type: object
  description: A test case, created or replaced as a whole (NEXT-PLAN A.2).
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    personaPrompt:
      type: string
      description: 'instructions to the model that plays the caller: who they are, what they want, how they react'
      minLength: 1
      maxLength: 4000
    facts:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
      description: the call's facts, keyed by the scenario's `factSchema` names
    language:
      type: string
      description: the caller's language; null uses the agent's
      maxLength: 10
    expectDisposition:
      type: string
      description: how the call must end (`PROMISE_TO_PAY`, `REFUSED`, …)
      maxLength: 40
    expectStage:
      type: string
      maxLength: 100
    mustSay:
      type: array
      items:
        type: string
      description: phrases the agent has to say (case-insensitive)
      maxItems: 20
    mustNotSay:
      type: array
      items:
        type: string
      description: phrases the agent must never say
      maxItems: 20
    maxTurns:
      type: integer
      format: int32
      description: turns before the call is cut off; null means 12
      minimum: 1
      maximum: 30
  required:
  - name
  - personaPrompt
ScenarioMode:
  type: string
  enum:
