  properties:
    header:
      type: string
      description: the raw header text as it appears in the file
    mappedField:
      type: string
      description: the target field it will be loaded into (`clientId`, `phone`, `language`, or a `context_data` key like `debtAmount`), or `null` if the importer does not recognize this header
ParsedTarget:
  type: object
  description: A target ready to be inserted.
  properties:
    line:
      type: integer
      format: int32
      description: 1-based line number in the file, so an error can be found
    clientId:
      type: integer
      format: int64
      description: CRM client id
    phone:
      type: string
      description: number to dial (validated on insert)
    language:
      type: string
      description: per-target language override, or null for the campaign default
    contextJson:
      type: string
      description: debtor facts as `context_data` JSON
  required:
  - line
  - clientId
RecurrenceType:
  type: string
  enum:
  - ONCE
  - DAILY
  - WEEKLY
  - MONTHLY
  - CRON
  description: |-
    Frequency rule for recurring automated campaigns.

    - `ONCE` — Run once on manual start / creation (default).

    - `DAILY` — Run daily within dial window and allowed dial days.

    - `WEEKLY` — Run weekly on specific weekdays (e.g. every Sunday / every Monday).

    - `MONTHLY` — Run monthly on a specific day of the month (e.g. 1st or 25th of every month).

    - `CRON` — Run according to a standard 6-field Spring/Quartz Cron expression.
RetryRule:
  type: object
  description: How a campaign retries after one particular disposition.
  properties:
    maxAttempts:
      type: integer
      format: int32
      description: 'give up on the target once this many attempts have been spent and the latest one ended this way — `null` or 0 keeps the campaign''s overall `maxAttempts`. "One voicemail is enough" is `VOICEMAIL: {maxAttempts: 1`}'
    delayMinutes:
      type: integer
      format: int32
      description: minutes before the next attempt — `null` or 0 keeps the deployment default for that disposition
StepFilterOperator:
  type: string
  enum:
  - GT
  - GTE
  - LT
  - LTE
  - EQ
  - NE
  - PRESENT
  - ABSENT
  description: |-
    How a chained target source's step decides whether to keep a row.

    Deliberately small. This is the rule that stops the chain from fetching a phone number for every client a company has — "only the ones more than N days late", "only the ones that still owe something" — not a query language.

    - `GT` — Numeric comparisons. A row whose value is not a number never matches.

    - `GTE`

    - `LT`

    - `LTE`

    - `EQ` — Text comparison, case-insensitive; numbers are compared as text too.

    - `NE`

    - `PRESENT` — The path resolves to something that is neither missing nor null nor blank.

    - `ABSENT` — The inverse of `#PRESENT`.
TargetCsvPreview:
  type: object
  description: '`POST /api/campaigns/{id`/targets/csv/preview} response (§10.6 "ustunni moslashtirish" wizard step) — parses the file and reports how it would be loaded, without inserting anything.'
  properties:
    columns:
      type: array
      items:
        $ref: '#/CsvColumnMapping'
      description: each CSV header matched against a known field, or unmatched
    sampleRows:
      type: array
      items:
        $ref: '#/ParsedTarget'
      description: first rows that parsed cleanly, for an on-screen preview
    totalRows:
      type: integer
      format: int32
      description: how many data rows parsed cleanly in total (may exceed `sampleRows.size()`)
    errors:
      type: array
      items:
        $ref: ../common.yaml#/schemas/CsvRowError
      description: rows that failed to parse, with the reason
    unknownColumns:
      type: array
      items:
        type: string
      description: headers the importer does not recognize (also reflected in `columns`)
  required:
  - totalRows
