    One A/B variant, on two sets of numbers.

    `convertedCount` and `conversionRate` count the dispositions the bot recorded — a promise to pay. `attributedConversions` and `attributedValueUzs` count what a company's own systems later reported actually happening (conversions.md). Both are shown because they answer different questions, and a company that has configured no goals still has the first.
  properties:
    id:
      type: integer
      format: int64
    campaignId:
      type: integer
      format: int64
    companyId:
      type: integer
      format: int64
    name:
      type: string
    aiAgentId:
      type: integer
      format: int64
    promptOverride:
      type: string
    ttsVoiceId:
      type: string
    pipelineMode:
      allOf:
      - $ref: ../common.yaml#/schemas/PipelineMode
      description: the pipeline the variant's calls run on; null = the agent's own
    trafficWeight:
      type: integer
      format: int32
    callsCount:
      type: integer
      format: int32
    answeredCount:
      type: integer
      format: int32
    convertedCount:
      type: integer
      format: int32
    answerRate:
      type: number
      format: double
    conversionRate:
      type: number
      format: double
    attributedConversions:
      type: integer
      format: int64
    attributedValueUzs:
      type: integer
      format: int64
    spentUzs:
      type: integer
      format: int64
      description: what this variant's settled calls were charged
    costPerConversionUzs:
      type: integer
      format: int64
