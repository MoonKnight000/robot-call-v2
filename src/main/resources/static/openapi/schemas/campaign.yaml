      format: int32
    dailyCallCap:
      type: integer
      format: int32
      description: most calls a day; 0 for unlimited
    budgetUzs:
      type: integer
      format: int64
      minimum: 1
    dailyBudgetUzs:
      type: integer
      format: int64
      minimum: 1
CampaignRecurrenceDto:
