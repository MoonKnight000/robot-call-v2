TargetImportResult:
  type: object
  description: Outcome of a target CSV import.
  properties:
    campaignId:
      type: integer
      format: int64
      description: campaign the targets were loaded into
    added:
      type: integer
      format: int32
      description: how many targets were inserted
    targetIds:
      type: array
      items:
        type: integer
        format: int64
      description: ids of those targets
    skippedDuplicates:
      type: integer
      format: int32
      description: rows whose number the campaign already has queued — the same file uploaded twice inserts nothing the second time
    skippedDoNotCall:
      type: integer
      format: int32
      description: 'rows inserted with the do-not-call mark because the number is on the company''s list: counted, visible, never dialled'
    errors:
      type: array
      items:
        $ref: ../common.yaml#/schemas/CsvRowError
      description: rows that were rejected, with the reason
    unknownColumns:
      type: array
      items:
        type: string
      description: headers that were ignored — usually a typo in a header, which is worth surfacing because the facts in that column silently never reach the agent
  required:
  - campaignId
  - added
  - skippedDuplicates
  - skippedDoNotCall
TargetSourceMethod:
  type: string
  enum:
  - GET
  - POST
  description: How a campaign's target source is called.
TargetSourceProvider:
  type: string
  enum:
  - GENERIC
  - CHAINED
  - UYSOT_DEBTORS
  description: |-
    How a campaign's target source produces its list.

    - `GENERIC` — One HTTP request to the URL the company configured, whose answer is an array of rows with a phone in each. The default, and everything `PUT /api/campaigns/{id`/target-source} can create.

    - `CHAINED` — Several requests, configured on the campaign screen: one that lists rows and any number that are then called per row to fill in what the list did not carry. The general form of what `#UYSOT_DEBTORS` does for one CRM in particular.

    - `UYSOT_DEBTORS` — Today's overdue debtors, read out of Uysot's Open API. Configured by `voice-agent.crm.*` rather than by the source's own URL, because reaching a phone number there takes three chained reads and not one.

    Kept as its own provider although `#CHAINED` can now express the same chain: it is what the seeded daily campaign runs on, and it reads its credentials from the company's Uysot OAuth connection rather than from a header typed into a form.
TargetSourceRow:
  type: object
  description: |-
    A campaign's target source as the API returns it — the same fields the request takes, minus `authHeaderValue`: a secret this system was given is never handed back out, only replaced.

    Which fields are filled depends on `provider`: GENERIC uses the single-request ones and no steps, CHAINED the reverse. UYSOT_DEBTORS fills neither — it is provisioned rather than configured, and reads where to call from the platform's CRM settings.
  properties:
    campaignId:
      type: integer
      format: int64
    provider:
      $ref: '#/TargetSourceProvider'
    url:
      type: string
    method:
      $ref: '#/TargetSourceMethod'
    requestBody:
      type: string
    authHeaderName:
      type: string
    authHeaderSet:
      type: boolean
    itemsPath:
      type: string
    phoneField:
      type: string
    clientIdField:
      type: string
    languageField:
      type: string
    replaceTargets:
      type: boolean
    syncOnRecurrence:
      type: boolean
    enabled:
      type: boolean
    steps:
      type: array
      items:
        $ref: '#/TargetSourceStep'
    lastSyncAt:
      type: string
      format: date-time
    lastSyncAdded:
      type: integer
      format: int32
    lastSyncError:
      type: string
  required:
  - campaignId
  - authHeaderSet
  - replaceTargets
  - syncOnRecurrence
  - enabled
TargetSourceStep:
  type: object
  description: |-
    One request in a chained target source.

    The first step lists: it is called once (or once per page) and its answer is an array of rows. Every step after it enriches: it is called once per surviving row, and what it extracts is added to that row's variables. That is the shape a real CRM forces — the endpoint that knows who is overdue is rarely the endpoint that knows their phone number — and expressing it as configuration is what lets a company point this at their own API from the campaign screen instead of asking for code.

    Anywhere below that takes `{{name`}} is filled from the variables collected so far, so a later step's URL can read `.../contract/{{contractId`}}. Substituted values are URL-encoded in a URL and JSON-escaped in a body. The list step additionally has `{{page`}} when `#paginate` is set.
  properties:
    name:
      type: string
      description: what this step is called, for the error a rejected row reports
    method:
      $ref: '#/TargetSourceMethod'
    url:
      type: string
    body:
      type: string
    itemsPath:
      type: string
      description: dot path to the array of rows in this step's answer (`"data.data"`); only the list step uses it, and null there means the body is itself the array
    paginate:
      type: boolean
      description: 'list step only: call it again with `{{page`}} incremented until a page comes back short or the row cap is reached. Without it the step is called exactly once and whatever it answered is the whole list'
    filters:
      type: array
      items:
        $ref: '#/TargetSourceStepFilter'
      description: 'list step only: a row is carried on only if it satisfies every one of them. This is what keeps the chain from spending two requests each on clients who owe nothing'
    extract:
      type: object
      additionalProperties:
        type: string
      description: variable name → dot path in this step's answer. On the list step the paths are relative to each row; on a later step, to the whole response body. Whichever variables the source names as its phone, client id and language are used as those; every other one becomes a fact
  required:
  - paginate
TargetSourceStepFilter:
  type: object
  description: One condition a listed row has to satisfy to be worth carrying through the rest of the chain.
  properties:
    path:
      type: string
      description: 'dot path inside the row (`"delay"`, `"client.status"`). A numeric segment indexes an array: `"phones.0"`'
    operator:
      allOf:
      - $ref: '#/StepFilterOperator'
      description: how `value` is compared with what `path` resolves to
    value:
      type: string
      description: the comparison operand, as text. Ignored by `PRESENT`/`ABSENT`
TargetStatus:
  type: string
  enum:
  - PENDING
  - IN_PROGRESS
  - DONE
  - FAILED
  - EXHAUSTED
  description: Dial-loop state of a `CampaignTarget` (PROJECT.md §6).
TargetSyncResult:
  type: object
  description: Outcome of fetching a campaign's list from its target source.
  properties:
    campaignId:
      type: integer
      format: int64
    fetched:
      type: integer
      format: int32
      description: how many rows the endpoint answered with
    added:
      type: integer
      format: int32
      description: how many of them became targets
    removed:
      type: integer
      format: int32
      description: how many existing targets were cleared first (`replaceTargets`)
    skippedDuplicates:
      type: integer
      format: int32
      description: rows whose number was already queued (a sync without `replaceTargets` never doubles the list)
    skippedDoNotCall:
      type: integer
      format: int32
      description: rows stored with the do-not-call mark, never dialled
    errors:
      type: array
      items:
        $ref: ../common.yaml#/schemas/CsvRowError
      description: rows the endpoint got wrong, with the reason and the row's position
  required:
  - campaignId
  - fetched
  - added
  - removed
  - skippedDuplicates
  - skippedDoNotCall
UpdateCampaignRequest:
  type: object
  description: Full edit of a campaign (`PUT /api/campaigns/{id}`) — the same groups as `CreateCampaignRequest`, minus `type`; `dialing.mode` is ignored. `version` is the one `CampaignRow` carried when the form was opened; a campaign saved by someone else since is answered 409.
  properties:
    name:
      type: string
      minLength: 1
    aiAgentId:
      type: integer
      format: int64
    priority:
      type: integer
      format: int32
      minimum: 1
      maximum: 5
    schedule:
      $ref: '#/CampaignScheduleDto'
    retry:
      $ref: '#/CampaignRetryDto'
    limits:
      $ref: '#/CampaignLimitsDto'
    recurrence:
      $ref: '#/CampaignRecurrenceDto'
    dialing:
      $ref: '#/CampaignDialingDto'
    version:
      type: integer
      format: int64
  required:
  - name
UpdateTargetSourceRequest:
  type: object
  description: |-
    Configures where a campaign fetches its call list from (`PUT /api/campaigns/{id`/target-source}).

    Two shapes, chosen by `provider`. GENERIC is one request whose answer is already a list of rows with a phone in each, described by the fields below. CHAINED is several requests — `steps` — for the common case where the endpoint that knows who to call is not the endpoint that knows their number; the single-request fields are then unused.

    `url` carries no `@NotBlank` because a CHAINED source has no single address; `CampaignValidator` requires whichever of the two the provider needs, so an omission is still a `400` and not a source that fetches nothing.
  properties:
    provider:
      $ref: '#/TargetSourceProvider'
    url:
      type: string
      description: http(s) endpoint (GENERIC). Screened against loopback and private addresses at fetch time — this URL is written by a tenant and the request is made by this server, from inside its own network
      maxLength: 1000
    method:
      $ref: '#/TargetSourceMethod'
    requestBody:
      type: string
    authHeaderName:
      type: string
      maxLength: 100
    authHeaderValue:
      type: string
      description: write-only, and sent on every step of a chain. Omit on a later edit to keep the stored secret
    itemsPath:
      type: string
      description: dot path to the array of rows (`"data.items"`); omit when the response body is the array itself
      maxLength: 200
    phoneField:
      type: string
      description: 'GENERIC: the key holding the number in each row. CHAINED: the name of the variable the steps collected that holds it. Defaults to `phone` either way'
      maxLength: 100
    clientIdField:
      type: string
      description: likewise for the CRM's client id; omit when there is none
      maxLength: 100
    languageField:
      type: string
      description: likewise for a per-row language; omit to use the agent's
      maxLength: 100
    replaceTargets:
      type: boolean
      description: clear the campaign's targets before importing — for a source that answers with the whole of today's list
    syncOnRecurrence:
      type: boolean
      description: fetch automatically on every recurrence run (default true)
    enabled:
      type: boolean
    steps:
      type: array
      items:
        $ref: '#/TargetSourceStep'
      description: 'CHAINED only: the requests to run, in order. The first lists rows; each later one is called once per row'
