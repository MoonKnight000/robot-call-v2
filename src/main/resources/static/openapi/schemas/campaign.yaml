CampaignStatus:
  type: string
  enum:
  - DRAFT
  - SCHEDULED
  - ACTIVE
  - PAUSED
  - COMPLETED
  - ARCHIVED
  description: |-
    Lifecycle of a `Campaign` (PROJECT.md §6).

    - `DRAFT`

    - `SCHEDULED` — Started with a future `startAt`; the sweep makes it ACTIVE when that time comes.

    - `ACTIVE`

    - `PAUSED`

    - `COMPLETED` — Every target reached a terminal state while the campaign was ACTIVE — see `CampaignOutcomeService#checkCompletion`.

    - `ARCHIVED`
