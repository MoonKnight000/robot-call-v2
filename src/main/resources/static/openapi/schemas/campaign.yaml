# `campaign` feature'ining ma'lumot turlari (request/response DTO, domain, enum).
AbTestReportResponse:
  type: object
  properties:
    campaignId:
      type: integer
      format: int64
    companyId:
      type: integer
      format: int64
    totalVariants:
      type: integer
      format: int32
    totalCalls:
      type: integer
      format: int32
    totalAnswered:
      type: integer
      format: int32
    totalConverted:
      type: integer
      format: int32
    overallConversionRate:
      type: number
      format: double
    conversionRateLow:
      type: number
      format: double
      description: lower edge of the 95% interval around `overallConversionRate`, in percent
    conversionRateHigh:
      type: number
      format: double
      description: upper edge of the same interval, in percent
    leadingVariantName:
      type: string
      description: the variant with the best conversion rate so far — a ranking, not a verdict
    winningVariantName:
      type: string
      description: the variant that has actually won, or null while the test is still inconclusive; see `uz.murodjon.robotcallv2.campaign.domain.service.AbTestSignificance`
    variants:
      type: array
      items:
        $ref: '#/CampaignVariantResponse'
  required:
  - campaignId
  - companyId
  - totalVariants
  - totalCalls
  - totalAnswered
  - totalConverted
  - overallConversionRate
  - conversionRateLow
  - conversionRateHigh
AddTargetRequest:
  type: object
  properties:
    clientId:
      type: integer
      format: int64
      minimum: 0
      exclusiveMinimum: true
    phone:
      type: string
      minLength: 1
    language:
      type: string
    contextData:
      type: object
      additionalProperties: true
  required:
  - clientId
  - phone
AddTargetsResponse:
  type: object
  properties:
    campaignId:
      type: integer
      format: int64
    added:
      type: integer
      format: int32
    targetIds:
      type: array
      items:
        type: integer
        format: int64
    skippedDuplicates:
      type: integer
      format: int32
      description: numbers the campaign already had queued, left as they were
    skippedDoNotCall:
      type: integer
      format: int32
      description: numbers on the company's do-not-call list, stored marked and never dialled
  required:
  - campaignId
  - added
  - skippedDuplicates
  - skippedDoNotCall
CampaignDialingDto:
  type: object
  description: '`CampaignDialing` as the campaign endpoints read and write it.'
  properties:
    mode:
      type: string
      enum: [AI, PREVIEW, PROGRESSIVE, PREDICTIVE]
      description: who talks to the clients; AI by default. Fixed once the campaign exists — PUT ignores it
    callQueueId:
      type: integer
      format: int64
      description: the operator queue whose members take the calls — required for every mode but AI
    maxAiOverflowPercent:
      type: integer
      format: int32
      minimum: 0
      maximum: 100
      description: 'PREDICTIVE: share of answered calls the AI agent may take; default 20'
    targetOrdering:
      type: string
      enum: [FIFO, SCORE]
CampaignLimitsDto:
  type: object
  description: '`CampaignLimits` as the campaign endpoints read and write it.'
