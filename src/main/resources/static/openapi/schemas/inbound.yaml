# `inbound` feature'ining ma'lumot turlari (request/response DTO, domain, enum).
CallerRuleAction:
  type: string
  enum:
  - BLOCK_HANGUP
  - BLOCK_BUSY
  - BLOCK_MESSAGE
  - VIP
  description: |-
    What an inbound caller rule does to a matching caller, before any flow runs.

    - `BLOCK_HANGUP` — Hang up at once.

    - `BLOCK_BUSY` — Reject as busy — the caller hears an ordinary busy tone.

    - `BLOCK_MESSAGE` — Answer, say the rule's `message`, hang up.

    - `VIP` — Put first in every queue the call reaches, and take the flow's CALLER_ROUTER 'vip' exit.
CreateInboundRouteRequest:
  type: object
  properties:
    didNumber:
      type: string
      minLength: 1
      pattern: ^\+?[1-9]\d{8,14}$
    aiAgentId:
      type: integer
      format: int64
    routeType:
      $ref: '#/InboundRouteType'
    targetDestination:
      type: string
    queueStrategy:
      $ref: '#/QueueStrategy'
    ringTimeoutSec:
      type: integer
      format: int32
    failoverAction:
      $ref: '#/InboundFailoverAction'
    failoverDestination:
      type: string
    afterHoursAction:
      $ref: '#/InboundAfterHoursAction'
    afterHoursDestination:
      type: string
    ivrMenuConfig:
      type: string
    businessHoursStart:
      type: string
      example: 09:00:00
      description: 'Format: `HH:mm` Format: `HH:mm`'
    businessHoursEnd:
      type: string
      example: 09:00:00
      description: 'Format: `HH:mm` Format: `HH:mm`'
    fallbackMessage:
      type: string
    callbackCampaignId:
      type: integer
      format: int64
    scheduleId:
      type: integer
      format: int64
    callFlowId:
      type: integer
      format: int64
  required:
  - didNumber
InboundAfterHoursAction:
  type: string
  enum:
  - AI_AGENT
  - VOICEMAIL
  - PLAY_MESSAGE_AND_HANGUP
  - FORWARD_EXTERNAL
  description: |-
    Action to take when an inbound call arrives outside of configured business hours.

    - `AI_AGENT` — Route to after-hours Night AI Agent.

    - `VOICEMAIL` — Allow caller to record a voicemail message.

    - `PLAY_MESSAGE_AND_HANGUP` — Play custom fallback announcement text via TTS and hang up.

    - `FORWARD_EXTERNAL` — Forward to on-duty night engineer or mobile number.
InboundCallerRule:
  type: object
  description: Who is refused or put first before any flow runs (docs/INBOUND-PBX-PLAN.md §9).
  properties:
    id:
      type: integer
      format: int64
    companyId:
      type: integer
      format: int64
    phonePrefix:
      type: string
      description: digits the caller's number starts with ("99890", a whole number), or `#ANONYMOUS` for callers who hide their number
    action:
      $ref: '#/CallerRuleAction'
    message:
      type: string
      description: said by `CallerRuleAction#BLOCK_MESSAGE`
    note:
      type: string
    createdAt:
      type: string
      format: date-time
  required:
  - id
  - companyId
InboundCallerRuleFilter:
  type: object
  description: Pagination + sort for POST /api/inbound-caller-rules/list.
  properties:
    page:
      type: integer
      format: int32
      minimum: 0
    size:
      type: integer
      format: int32
      minimum: 1
      maximum: 500
    orders:
      type: object
      properties:
        ID:
          $ref: ../common.yaml#/schemas/SortDirection
        PHONE_PREFIX:
          $ref: ../common.yaml#/schemas/SortDirection
        CREATED_AT:
          $ref: ../common.yaml#/schemas/SortDirection
      additionalProperties: false
      description: Kalitlar tartibi muhim — ro'yxatdagi tartib bo'yicha qo'llanadi
InboundCallerRulePage:
