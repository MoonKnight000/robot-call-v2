InboundRouteType:
  type: string
  enum:
  - SCENARIO
  - OPERATOR_QUEUE
  - EXTENSION
  - EXTERNAL_NUMBER
  - STICKY_AGENT
  - IVR_MENU
  - VOICEMAIL
  description: |-
    Type of inbound call handling / routing target in the Virtual PBX.

    - `SCENARIO` — Route to AI Voice Agent (Scenario).

    - `OPERATOR_QUEUE` — Route to human operator call queue.

    - `EXTENSION` — Route to a specific internal SIP extension (e.g. 101, 102).

    - `EXTERNAL_NUMBER` — Forward to an external mobile or landline phone number.

    - `STICKY_AGENT` — Sticky agent routing: route directly to the client's assigned manager from CRM.

    - `IVR_MENU` — Interactive Voice Response (IVR) menu with DTMF or voice choices.

    - `VOICEMAIL` — Send caller directly to Voicemail.
QueueStrategy:
  type: string
  enum:
  - RING_ALL
  - ROUND_ROBIN
  - FEWEST_CALLS
  - LEAST_RECENT
  - RANDOM
  description: |-
    Call distribution strategies across available operators in a queue.

    - `RING_ALL` — Ring all available operators simultaneously.

    - `ROUND_ROBIN` — Distribute calls sequentially in a cycle across operators.

    - `FEWEST_CALLS` — Route to the operator with the fewest handled calls today.

    - `LEAST_RECENT` — Route to the operator who has been idle the longest.

    - `RANDOM` — Choose a random available operator.
