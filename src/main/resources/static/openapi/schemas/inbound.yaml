  - totalElements
InboundFailoverAction:
  type: string
  enum:
  - SCENARIO
  - VOICEMAIL
  - EXTERNAL_FORWARD
  - HANGUP
  description: |-
    Action to take when operators do not answer within the ring timeout.

    - `SCENARIO` — Fall back to AI Voice Agent scenario.

    - `VOICEMAIL` — Fall back to Voicemail recording.

    - `EXTERNAL_FORWARD` — Forward to a backup external mobile number.

    - `HANGUP` — Play busy tone or farewell and hang up.
