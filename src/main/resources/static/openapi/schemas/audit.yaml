# `audit` feature'ining ma'lumot turlari (request/response DTO, domain, enum).
AuditFilter:
  type: object
  description: Pagination + sort + filter for POST /api/reports/audit/list.
  properties:
    page:
      type: integer
      format: int32
      minimum: 0
    size:
      type: integer
      format: int32
      minimum: 1
      maximum: 500
    orders:
      type: object
      properties:
        ID:
          $ref: ../common.yaml#/schemas/SortDirection
        CREATED_AT:
          $ref: ../common.yaml#/schemas/SortDirection
        ACTION:
          $ref: ../common.yaml#/schemas/SortDirection
        ENTITY:
          $ref: ../common.yaml#/schemas/SortDirection
      additionalProperties: false
      description: Kalitlar tartibi muhim — ro'yxatdagi tartib bo'yicha qo'llanadi
    actor:
      type: string
    action:
      type: string
    entity:
      type: string
AuditLog:
  type: object
  description: Domain model for an audit log record.
  properties:
    id:
      type: integer
      format: int64
    companyId:
      type: integer
      format: int64
    actor:
      type: string
    action:
      type: string
    entity:
      type: string
    entityId:
      type: string
    detail:
      type: string
    createdAt:
      type: string
      format: date-time
    ipAddress:
      type: string
  required:
  - id
  - companyId
AuditLogPage:
  type: object
  description: '`AuditLog` sahifasi'
  properties:
    totalPages:
      type: integer
      format: int32
    currentPage:
      type: integer
      format: int32
    totalElements:
      type: integer
      format: int64
    data:
      type: array
      items:
        $ref: '#/AuditLog'
  required:
  - totalPages
  - currentPage
  - totalElements
