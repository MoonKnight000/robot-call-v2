# `donotcall` feature'ining ma'lumot turlari (request/response DTO, domain, enum).
DoNotCallFilter:
  type: object
  description: Request body for `POST /api/do-not-call/list` (§10.8).
  properties:
    page:
      type: integer
      format: int32
    size:
      type: integer
      format: int32
    orders:
      type: object
      properties:
        PHONE:
          $ref: ../common.yaml#/schemas/SortDirection
        REASON:
          $ref: ../common.yaml#/schemas/SortDirection
        SOURCE:
          $ref: ../common.yaml#/schemas/SortDirection
        CREATED_AT:
          $ref: ../common.yaml#/schemas/SortDirection
      additionalProperties: false
DoNotCallRemoveResponse:
  type: object
  description: Response for `POST /api/do-not-call/{phone`/remove} (§10.8).
  properties:
    phone:
      type: string
    removed:
      type: boolean
  required:
  - removed
DoNotCallResponse:
  type: object
  description: Response for `POST /api/targets/{id`/do-not-call}.
  properties:
    targetId:
      type: integer
      format: int64
    doNotCall:
      type: boolean
  required:
  - targetId
  - doNotCall
DoNotCallRow:
  type: object
  description: Row in `POST /api/do-not-call/list` response (§10.8).
  properties:
    id:
      type: integer
      format: int64
    phone:
      type: string
    contactName:
      type: string
    reason:
      type: string
    source:
      $ref: '#/DoNotCallSource'
    createdAt:
      type: string
      format: date-time
  required:
  - id
DoNotCallRowPage:
  type: object
  description: '`DoNotCallRow` sahifasi'
  properties:
    totalPages:
      type: integer
      format: int32
    currentPage:
      type: integer
      format: int32
    totalElements:
      type: integer
      format: int64
    data:
      type: array
      items:
        $ref: '#/DoNotCallRow'
  required:
  - totalPages
  - currentPage
  - totalElements
DoNotCallSource:
  type: string
  enum:
  - CALL
  - CRM
  - MANUAL
  description: 'Source of a DNC entry (§10.8): call agent action, CRM sync, or manual panel entry.'
