  - currentPage
  - totalElements
ToolTestResponse:
  type: object
  description: What a tool's dry run returned.
  properties:
    result:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
      description: 'exactly what the model would be handed: `status` and `data` — mapped by `responseMapping` when the tool has one, made prompt-safe, and `truncated: true` when it had to be cut'
