# `memory` feature'ining ma'lumot turlari (request/response DTO, domain, enum).
ClientMemory:
  type: object
  description: |-
    What a company knows about one phone number across every call it ever had with it — outbound from any campaign and inbound alike. Keyed by `(companyId, phone)` rather than by campaign target, so the knowledge outlives the campaign that produced it and is there when the client calls in.

    `recentCalls` is newest first and capped at `#MAX_RECENT_CALLS`; `facts` carries the scenario outcome fields worth repeating next time (`promisedDate`, `reasonCode`, ...), newest value winning.
  properties:
    id:
      type: integer
      format: int64
    companyId:
      type: integer
      format: int64
    phone:
      type: string
    preferredName:
      type: string
    preferredLanguage:
      type: string
    operatorNotes:
      type: string
    recentCalls:
      type: array
      items:
        $ref: '#/RememberedCall'
    facts:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
    updatedAt:
      type: string
      format: date-time
  required:
  - id
  - companyId
RememberedCall:
  type: object
  description: 'One past conversation with a client, as the agent will hear about it next time: when it was, which scenario ran, how it ended and what the summary LLM made of it.'
  properties:
    at:
      type: string
      format: date-time
    scenarioKey:
      type: string
    disposition:
      $ref: ../common.yaml#/schemas/Disposition
    summary:
      type: string
UpdateClientMemoryRequest:
  type: object
  description: Operator-maintained part of a client's memory. `null` leaves a field as it is, blank clears it.
  properties:
    preferredName:
      type: string
      maxLength: 100
    preferredLanguage:
      type: string
      maxLength: 10
    operatorNotes:
      type: string
      maxLength: 2000
