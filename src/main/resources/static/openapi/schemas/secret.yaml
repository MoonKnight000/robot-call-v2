# `secret` feature'ining ma'lumot turlari (request/response DTO, domain, enum).
CreateSecretRequest:
  type: object
  properties:
    key:
      type: string
      minLength: 1
      maxLength: 120
      pattern: ^[A-Za-z0-9_.-]+$
    value:
      type: string
      minLength: 1
    description:
      type: string
      maxLength: 255
  required:
  - key
  - value
SecretRow:
  type: object
  properties:
    id:
      type: integer
      format: int64
    companyId:
      type: integer
      format: int64
    key:
      type: string
    maskedValue:
      type: string
    description:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required:
  - id
  - companyId
UpdateSecretRequest:
  type: object
  properties:
    value:
      type: string
    description:
      type: string
