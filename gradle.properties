# Build performance. Applies to Docker builds and local/IDE builds alike.
# The Docker build passes --no-daemon itself, so the daemon stays on locally.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
#org.gradle.java.home=C:/Users/Surface PC/.jdks/ms-21.0.12

# Configuration cache saves a few seconds of the configuration phase, but it has
# to hold for every plugin in the graph — enable it once you have verified a
# clean `./gradlew bootJar` with it on.
# org.gradle.configuration-cache=true
